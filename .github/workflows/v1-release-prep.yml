name: v1.0.0 Release Prep

on:
  push:
    branches:
      - v1-release-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v1-release-prep
      - name: Set marketing version and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = p.read_text()
          old = 'MARKETING_VERSION = 1.0;'
          new = 'MARKETING_VERSION = 1.0.0;'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 MARKETING_VERSION occurrences, found {count}')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/v1-release-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty.xcodeproj/project.pbxproj .github/workflows/v1-release-prep.yml
          git commit -m 'Release: set marketing version to 1.0.0'
          git push origin HEAD:v1-release-prep
