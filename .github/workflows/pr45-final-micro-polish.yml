name: PR45 Final Micro Polish

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - ci/pr45_final_micro_polish.py
      - .github/workflows/pr45-final-micro-polish.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: xcode-27
    steps:
      - name: Check out PR45
        uses: actions/checkout@v4
        with:
          ref: pr45-v1-release-hardening
          fetch-depth: 0

      - name: Apply final micro-polish
        run: python3 ci/pr45_final_micro_polish.py

      - name: Validate retained contracts
        run: |
          python3 ci/validate_pr39_app_identity.py
          python3 ci/validate_pr45_release_hardening.py

      - name: Build Debug
        run: |
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build

      - name: Run tests
        run: |
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test

      - name: Commit accepted fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/UI/ProductionRootView.swift NotchSixty/UI/ProductionDynamicsView.swift
          git rm ci/pr45_final_micro_polish.py .github/workflows/pr45-final-micro-polish.yml
          git commit -m 'PR45: right-align Settings and preserve Dynamics scrollbar'
          git push origin HEAD:pr45-v1-release-hardening
