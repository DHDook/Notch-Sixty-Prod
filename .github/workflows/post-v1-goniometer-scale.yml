name: Post-v1 Responsive Goniometer Scaling

on:
  push:
    branches:
      - post-v1-meter-60hz

permissions:
  contents: write

jobs:
  patch-build-test:
    if: ${{ !contains(github.event.head_commit.message, '[gonio-landed]') }}
    runs-on: xcode-27
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: post-v1-meter-60hz

      - name: Apply logarithmic radial display scaling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty/UI/ProductionAnalysisViews.swift')
          text = path.read_text()
          old = '''                for point in snapshot.goniometer {\n                    let x = center.x + CGFloat(point.x) * scale\n                    let y = center.y - CGFloat(point.y) * scale\n                    let dot = Path(ellipseIn: CGRect(x: x - 1.2, y: y - 1.2, width: 2.4, height: 2.4))\n                    context.fill(dot, with: .color(.primary.opacity(0.36)))\n                }'''
          new = '''                for point in snapshot.goniometer {\n                    let displayPoint = goniometerDisplayPoint(x: point.x, y: point.y)\n                    let x = center.x + displayPoint.x * scale\n                    let y = center.y - displayPoint.y * scale\n                    let dot = Path(ellipseIn: CGRect(x: x - 1.2, y: y - 1.2, width: 2.4, height: 2.4))\n                    context.fill(dot, with: .color(.primary.opacity(0.36)))\n                }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one goniometer render loop, found {text.count(old)}')
          text = text.replace(old, new)
          anchor = '''    private var captureStatus: some View {'''
          helper = '''    private func goniometerDisplayPoint(x: Float, y: Float) -> CGPoint {\n        let rawX = Double(x)\n        let rawY = Double(y)\n        let radius = hypot(rawX, rawY)\n        guard radius > 1.0e-9 else { return .zero }\n\n        // Display-only radial shaping: expand quiet material without changing\n        // the goniometer angle/stereo orientation or the full-scale boundary.\n        let maximumRadius = sqrt(2.0)\n        let normalizedRadius = min(max(radius / maximumRadius, 0), 1)\n        let shapedRadius = log1p(9.0 * normalizedRadius) / log(10.0)\n        let mappedRadius = shapedRadius * maximumRadius\n        let gain = mappedRadius / radius\n        return CGPoint(x: rawX * gain, y: rawY * gain)\n    }\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('captureStatus anchor not found exactly once')
          path.write_text(text.replace(anchor, helper + anchor))
          PY
          grep -n -A20 'goniometerDisplayPoint' NotchSixty/UI/ProductionAnalysisViews.swift

      - name: Build Debug
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Run full XCTest
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test

      - name: Commit validated goniometer scaling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/post-v1-goniometer-scale.yml
          git add NotchSixty/UI/ProductionAnalysisViews.swift
          git commit -m 'Meters: expand quiet goniometer history [gonio-landed]'
          git push origin HEAD:post-v1-meter-60hz
