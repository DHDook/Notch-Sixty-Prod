name: PR31 Slice 3 Graph Integration

on:
  push:
    branches:
      - feature/noise-hum-suppression
    paths:
      - '.github/scripts/pr31_slice3_graph.py'
      - '.github/scripts/pr31_slice3_graph_fix.py'
      - '.github/workflows/pr31-slice3-graph-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/noise-hum-suppression

      - name: Apply PR31 Slice 3 graph integration
        run: python3 .github/scripts/pr31_slice3_graph.py

      - name: Apply PR31 Slice 3 integration fixes
        run: python3 .github/scripts/pr31_slice3_graph_fix.py

      - name: Run full test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit denoiser graph integration and clean helpers
        run: |
          rm -f .github/scripts/pr31_slice3_graph.py .github/scripts/pr31_slice3_graph_fix.py .github/workflows/pr31-slice3-graph-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate spectral denoiser into realtime graph'
          git push origin HEAD:feature/noise-hum-suppression
