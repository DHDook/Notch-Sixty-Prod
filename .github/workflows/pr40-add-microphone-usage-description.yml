name: PR40 Add Microphone Usage Description

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-add-microphone-usage-description.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Add microphone TCC usage description
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = path.read_text()
          anchor = '\t\t\t\tINFOPLIST_KEY_NSAudioCaptureUsageDescription = "Notch Sixty captures system audio so it can process and play it through your selected output device.";'
          addition = anchor + '\n\t\t\t\tINFOPLIST_KEY_NSMicrophoneUsageDescription = "Notch Sixty uses your selected measurement microphone to measure speaker and room response for room correction.";'
          if 'INFOPLIST_KEY_NSMicrophoneUsageDescription' not in text:
              count = text.count(anchor)
              if count != 2:
                  raise SystemExit(f'Expected Debug/Release Info.plist anchors, found {count}')
              text = text.replace(anchor, addition)
          path.write_text(text)
          PY

      - name: Commit microphone usage description
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-add-microphone-usage-description.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: add microphone privacy usage description"
          git push origin HEAD:pr40-room-correction-production-workflow
