name: PR40 Integrate Position UI

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-position-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Add retain and multi-position controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift')
          text = path.read_text()

          old_props = '''    @ObservedObject var engine: AudioIOEngine
              @ObservedObject var calibration: RoomCorrectionCalibrationController

              @State private var actionError: String?
          '''.replace('              ', '    ')
          new_props = '''    @ObservedObject var engine: AudioIOEngine
              @ObservedObject var calibration: RoomCorrectionCalibrationController
              @ObservedObject var projects: RoomCorrectionProjectController
              @ObservedObject var profiles: ProductProfileController

              @State private var actionError: String?
              @State private var positionName = ""
          '''.replace('              ', '    ')
          if new_props not in text:
              if text.count(old_props) != 1:
                  raise SystemExit('Unexpected workspace property block')
              text = text.replace(old_props, new_props, 1)

          old_review = '''                if calibration.state == .reviewing, let analysis = calibration.latestAnalysis {
                          reviewCard(analysis)
                      }

                      if let error = actionError ?? calibration.lastErrorDescription {
          '''.replace('                          ', '                ').replace('                      ', '            ')
          new_review = '''                if calibration.state == .reviewing, let analysis = calibration.latestAnalysis {
                          reviewCard(analysis)
                      }

                      if !projects.positions.isEmpty {
                          positionsCard
                      }

                      if let error = actionError ?? calibration.lastErrorDescription ?? projects.lastErrorDescription {
          '''.replace('                          ', '                ').replace('                      ', '            ')
          if new_review not in text:
              if text.count(old_review) != 1:
                  raise SystemExit('Unexpected workspace review/error block')
              text = text.replace(old_review, new_review, 1)

          old_tasks = '''        .task { calibration.prepareForUse() }
              .task(id: calibration.state) {
          '''.replace('              ', '        ')
          new_tasks = '''        .task { calibration.prepareForUse() }
              .task(id: profiles.selectedSystemProfileID) {
                  projects.prepareForUse()
              }
              .task(id: calibration.state) {
          '''.replace('              ', '        ')
          if new_tasks not in text:
              if text.count(old_tasks) != 1:
                  raise SystemExit('Unexpected workspace task anchor')
              text = text.replace(old_tasks, new_tasks, 1)

          old_review_footer = '''            Text("This review is the measured response for the current position only. Named positions, inclusion/weighting, spatial aggregation, target shaping, and FIR design remain separate downstream stages; none are inferred here.")
                  .font(.caption)
                  .foregroundStyle(.secondary)
          '''.replace('                  ', '                ')
          new_review_footer = '''            Divider()

              if projects.contains(analysis) {
                  Label("Current measurement retained in the Playback System project", systemImage: "tray.and.arrow.down.fill")
                      .font(.callout.weight(.semibold))
                      .foregroundStyle(.secondary)
              } else {
                  HStack(spacing: 12) {
                      TextField(projects.suggestedPositionName, text: $positionName)
                          .frame(maxWidth: 280)
                      Button {
                          retainReviewedMeasurement(analysis)
                      } label: {
                          Label("Keep Position", systemImage: "tray.and.arrow.down")
                      }
                      .buttonStyle(.borderedProminent)
                  }
                  Text("Leave the name blank to use \(projects.suggestedPositionName). The raw capture, impulse response, transfer function and quality metadata are saved together.")
                      .font(.caption)
                      .foregroundStyle(.secondary)
              }

              Text("This review is the measured response for the current position only. Target shaping and FIR design remain separate downstream stages; none are inferred here.")
                  .font(.caption)
                  .foregroundStyle(.secondary)
          '''.replace('              ', '            ').replace('                  ', '                ')
          if new_review_footer not in text:
              if text.count(old_review_footer) != 1:
                  raise SystemExit('Unexpected review footer anchor')
              text = text.replace(old_review_footer, new_review_footer, 1)

          anchor = '    private var calibrationStateBadge: some View {\n'
          methods = r'''    private var positionsCard: some View {
              VStack(alignment: .leading, spacing: 16) {
                  HStack {
                      VStack(alignment: .leading, spacing: 3) {
                          Text("4. Positions").font(.headline)
                          Text(projects.project?.name ?? "No room-correction project")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                      }
                      Spacer()
                      Button("Start New Project") {
                          actionError = nil
                          do {
                              try projects.startNewProject()
                              positionName = ""
                          } catch {
                              actionError = error.localizedDescription
                          }
                      }
                      .buttonStyle(.bordered)
                  }

                  ForEach(projects.positions) { position in
                      RoomCorrectionPositionRow(
                          position: position,
                          projects: projects,
                          onError: { actionError = $0 }
                      )
                  }

                  Divider()
                  if let aggregate = projects.aggregate {
                      Label(
                          "Weighted magnitude aggregate ready from \(aggregate.includedPositionIDs.count) included position\(aggregate.includedPositionIDs.count == 1 ? "" : "s")",
                          systemImage: "sum"
                      )
                      .font(.callout.weight(.semibold))
                      Text("Position weights are normalized before averaging magnitude in dB. Seat phase is intentionally kept per measurement rather than spatially averaged.")
                          .font(.caption)
                          .foregroundStyle(.secondary)
                  } else {
                      Text("No aggregate is active. Include at least one position with weight greater than zero.")
                          .font(.caption)
                          .foregroundStyle(.secondary)
                  }
              }
              .padding(20)
              .glassEffect(.regular, in: .rect(cornerRadius: 18))
          }

          private func retainReviewedMeasurement(_ analysis: RoomCorrectionMeasurementAnalysis) {
              actionError = nil
              guard let input = calibration.selectedInputDevice,
                    let sweep = calibration.activePlan?.program.settings else {
                  actionError = "The reviewed measurement no longer has its originating microphone or sweep metadata. Measure the position again before retaining it."
                  return
              }

              let microphone = RoomCorrectionMicrophone(
                  stableID: input.uid,
                  displayName: input.name,
                  manufacturer: nil,
                  inputChannelIndex: calibration.selectedInputChannelIndex,
                  calibration: nil
              )
              let proposed = positionName.trimmingCharacters(in: .whitespacesAndNewlines)
              do {
                  try projects.retainMeasurement(
                      analysis,
                      sweep: sweep,
                      microphone: microphone,
                      name: proposed.isEmpty ? nil : proposed
                  )
                  positionName = ""
              } catch {
                  actionError = error.localizedDescription
              }
          }

'''.replace('          ', '    ')
          if '    private var positionsCard: some View {' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('Unexpected calibration badge anchor')
              text = text.replace(anchor, methods + anchor, 1)

          if 'private struct RoomCorrectionPositionRow: View {' not in text:
              row = r'''

private struct RoomCorrectionPositionRow: View {
    let positionID: UUID
    @ObservedObject var projects: RoomCorrectionProjectController
    let onError: (String) -> Void
    @State private var nameDraft: String

    init(
        position: RoomCorrectionMeasurementPosition,
        projects: RoomCorrectionProjectController,
        onError: @escaping (String) -> Void
    ) {
        positionID = position.id
        self.projects = projects
        self.onError = onError
        _nameDraft = State(initialValue: position.name)
    }

    private var position: RoomCorrectionMeasurementPosition? {
        projects.positions.first { $0.id == positionID }
    }

    var body: some View {
        if let position {
            VStack(alignment: .leading, spacing: 10) {
                HStack(spacing: 12) {
                    Toggle("Included", isOn: includedBinding)
                        .toggleStyle(.switch)
                        .controlSize(.small)

                    TextField("Position name", text: $nameDraft)
                        .textFieldStyle(.roundedBorder)
                        .frame(maxWidth: 260)
                        .onSubmit { commitName() }

                    Button("Rename") { commitName() }
                        .buttonStyle(.bordered)
                        .disabled(nameDraft.trimmingCharacters(in: .whitespacesAndNewlines) == position.name)

                    Spacer()

                    Stepper(value: weightBinding, in: 0...10, step: 0.25) {
                        Text("Weight \(position.weight, specifier: "%.2f")")
                            .monospacedDigit()
                    }
                    .frame(width: 160)
                }

                HStack(spacing: 18) {
                    Text("L SNR \(formattedDB(position.left.quality.estimatedSNRDB))")
                    Text("R SNR \(formattedDB(position.right.quality.estimatedSNRDB))")
                    Text("\(position.sampleRate / 1_000, specifier: "%.1f") kHz")
                    Text(position.included ? "Included in aggregate" : "Retained · excluded")
                }
                .font(.caption)
                .foregroundStyle(.secondary)
            }
            .padding(12)
            .background(.quaternary.opacity(0.45), in: RoundedRectangle(cornerRadius: 12))
            .onChange(of: position.name) { _, newName in
                if nameDraft != newName { nameDraft = newName }
            }
        }
    }

    private var includedBinding: Binding<Bool> {
        Binding(
            get: { position?.included ?? false },
            set: { included in
                do { try projects.setMeasurementIncluded(id: positionID, included: included) }
                catch { onError(error.localizedDescription) }
            }
        )
    }

    private var weightBinding: Binding<Double> {
        Binding(
            get: { position?.weight ?? 0 },
            set: { weight in
                do { try projects.setMeasurementWeight(id: positionID, weight: weight) }
                catch { onError(error.localizedDescription) }
            }
        )
    }

    private func commitName() {
        do {
            try projects.renameMeasurement(id: positionID, to: nameDraft)
        } catch {
            onError(error.localizedDescription)
            if let position { nameDraft = position.name }
        }
    }

    private func formattedDB(_ value: Double?) -> String {
        guard let value else { return "—" }
        return String(format: "%.1f dB", value)
    }
}
'''
              text += row

          path.write_text(text)
          PY

      - name: Commit UI and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift
          git rm .github/workflows/pr40-integrate-position-ui.yml
          git commit -m "PR40 Slice D: expose named position retention and weighting"
          git push origin HEAD:pr40-room-correction-production-workflow
