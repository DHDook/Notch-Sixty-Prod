name: PR40 Integrate Position UI

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-position-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply position UI patch
        run: python3 .github/scripts/pr40_integrate_position_ui.py

      - name: Commit integration and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift
          git rm .github/scripts/pr40_integrate_position_ui.py
          git rm .github/workflows/pr40-integrate-position-ui.yml
          git commit -m "PR40 Slice D: expose named position retention and weighting"
          git push origin HEAD:pr40-room-correction-production-workflow
