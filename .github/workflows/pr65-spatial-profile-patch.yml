name: PR65 Spatial Profile Patch
on:
  push:
    branches: [feature/pr65-headphone-binaural-integration]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr65-headphone-binaural-integration
          fetch-depth: 0
      - name: Apply asserted profile changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('NotchSixty/Audio/Routing/HeadphoneDeviceProfileConfiguration.swift')
          s = p.read_text()
          def repl(old, new):
              global s
              n = s.count(old)
              if n != 1: raise SystemExit(f'expected one match, found {n}: {old[:90]!r}')
              s = s.replace(old, new, 1)
          repl('    case binauralProfileSampleRateMismatch(profile: Double, output: Double)\n',
               '    case binauralProfileSampleRateMismatch(profile: Double, output: Double)\n    case programSourceUnavailable(String)\n    case programSourceChannelCountMismatch(expected: UInt32, actual: UInt32)\n')
          repl('        case .binauralProfileSampleRateMismatch(let profile, let output):\n            return "The virtual-speaker profile is \\(profile) Hz but the headphone output is \\(output) Hz. Spatial SRC is not implicit."\n',
               '        case .binauralProfileSampleRateMismatch(let profile, let output):\n            return "The virtual-speaker profile is \\(profile) Hz but the headphone output is \\(output) Hz. Spatial SRC is not implicit."\n        case .programSourceUnavailable(let uid):\n            return "The Virtual Speakers program source is unavailable: \\(uid)."\n        case .programSourceChannelCountMismatch(let expected, let actual):\n            return "Virtual Speakers expects \\(expected) program channels, but the selected source exposes \\(actual)."\n')
          repl('    var spatialMode: HeadphoneSpatialMode = .stereo\n    var binauralProfile: BinauralProfileReference?\n',
               '    var spatialMode: HeadphoneSpatialMode = .stereo\n    /// Optional decoded-program endpoint used only by Virtual Speakers. Nil means\n    /// use the physical headphone output endpoint as the program source.\n    var programSourceDeviceUID: String?\n    var programLayout: OutputProgramLayout = .stereo\n    var binauralProfile: BinauralProfileReference?\n')
          repl('        return output\n    }\n\n    func makeRealtimeSnapshot',
               '        return output\n    }\n\n    func resolveProgramSource(\n        availableDevices: [AudioOutputDevice],\n        selectedOutput: AudioOutputDevice\n    ) throws -> AudioOutputDevice {\n        guard spatialMode == .virtualSpeakers else { return selectedOutput }\n        let uid = programSourceDeviceUID ?? selectedOutput.uid\n        guard let source = availableDevices.first(where: { $0.uid == uid }) else {\n            throw HeadphoneDeviceProfileError.programSourceUnavailable(uid)\n        }\n        let expected = UInt32(programLayout.roles.count)\n        guard source.outputChannelCount == expected else {\n            throw HeadphoneDeviceProfileError.programSourceChannelCountMismatch(\n                expected: expected, actual: source.outputChannelCount\n            )\n        }\n        return source\n    }\n\n    func makeRealtimeSnapshot')
          p.write_text(s)
          Path('.github/workflows/pr65-spatial-profile-patch.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR65: model virtual-speaker program source"
          git push origin HEAD:feature/pr65-headphone-binaural-integration
