name: PR45 Production Picker Consistency

on:
  push:
    branches:
      - pr45-v1-release-hardening

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: ${{ !contains(github.event.head_commit.message, 'PR45: unify production picker glass styling') }}
    runs-on: xcode-27
    steps:
      - name: Check out PR45
        uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening
          fetch-depth: 0

      - name: Apply production picker consistency pass
        run: python3 ci/apply_pr45_picker_consistency.py

      - name: Validate retained UI and release contracts
        run: |
          python3 ci/validate_pr37_equalizer_ui.py
          python3 ci/validate_pr38_dynamics_ui.py
          python3 ci/validate_pr39_app_identity.py
          python3 ci/validate_pr42_dynamics_ui_style.py
          python3 ci/validate_pr43_current_macos_ui.py
          python3 ci/validate_pr45_release_hardening.py
          python3 ci/validate_pr45_control_style.py

      - name: Build Debug
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Run full XCTest
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test

      - name: Commit accepted consistency fixes
        run: |
          git restore .github/workflows/pr45-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty ci/validate_pr45_control_style.py
          if git diff --cached --quiet; then
            echo 'No product/control-style changes to commit.'
            exit 0
          fi
          git commit -m 'PR45: unify production picker glass styling'
          git push origin HEAD:pr45-v1-release-hardening
