name: PR43 Apply Driver Model

on:
  push:
    branches:
      - pr43-advanced-acoustic-speaker-optimization
    paths:
      - .github/workflows/pr43-apply-driver-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr43-advanced-acoustic-speaker-optimization
          fetch-depth: 0

      - name: Apply per-driver Playback System model
        run: python3 ci/pr43_apply_driver_model.py

      - name: Validate model contract
        shell: bash
        run: |
          sed -i 's/    "mandatory crossover filtering",/    "cannot be bypassed",/' ci/validate_pr43_driver_model.py
          python3 ci/validate_pr43_driver_model.py

      - name: Commit implementation back to PR43
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          git add NotchSixty/Audio/AudioIOEngine.swift
          git add NotchSixty/State/ProductProfiles.swift
          git add NotchSixtyTests/NotchSixtyTests.swift
          git add ci/validate_pr43_driver_model.py
          git commit -m "PR43: add per-driver Playback System model"
          git push origin HEAD:pr43-advanced-acoustic-speaker-optimization
