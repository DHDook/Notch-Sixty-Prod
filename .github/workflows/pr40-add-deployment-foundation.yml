name: PR40 Add Deployment Foundation

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-add-deployment-foundation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0
      - name: Add transactional deployment foundation
        run: python3 .github/scripts/pr40_add_deployment_foundation.py
      - name: Commit deployment foundation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/pr40_add_deployment_foundation.py .github/workflows/pr40-add-deployment-foundation.yml
          git add NotchSixty/State/ProductProfiles.swift NotchSixty/Audio/RoomCorrectionFIRDesigner.swift NotchSixty/State/RoomCorrectionProjectController.swift NotchSixtyTests/RoomCorrectionFIRDesignerTests.swift NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          git commit -m "PR40 Slice F: add transactional deployment foundation"
          git push origin HEAD:pr40-room-correction-production-workflow
