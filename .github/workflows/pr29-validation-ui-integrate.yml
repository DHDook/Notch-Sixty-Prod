name: PR29 Advanced Dynamics Validation UI Integration

on:
  push:
    branches:
      - feature/advanced-dynamics-parity-2
    paths:
      - '.github/scripts/pr29_validation_ui.py'
      - '.github/workflows/pr29-validation-ui-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/advanced-dynamics-parity-2

      - name: Normalize generated Swift interpolation quotes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/pr29_validation_ui.py')
          text = p.read_text()
          p.write_text(text.replace(r'\"', '"'))
          PY

      - name: Apply PR29 validation UI integration
        run: python3 .github/scripts/pr29_validation_ui.py

      - name: Run full test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit PR29 validation UI and clean helpers
        run: |
          rm -f .github/scripts/pr29_validation_ui.py .github/workflows/pr29-validation-ui-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose PR28 and PR29 advanced dynamics validation controls'
          git push origin HEAD:feature/advanced-dynamics-parity-2
