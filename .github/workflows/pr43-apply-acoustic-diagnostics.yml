name: PR43 Apply Acoustic Diagnostics

on:
  push:
    branches:
      - pr43-advanced-acoustic-speaker-optimization
    paths:
      - .github/workflows/pr43-apply-acoustic-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr43-advanced-acoustic-speaker-optimization
          fetch-depth: 0

      - name: Apply offline acoustic diagnostics slice
        run: python3 ci/pr43_apply_acoustic_diagnostics.py

      - name: Validate staged diagnostics contract
        shell: bash
        run: |
          sed -i 's/    "Schroeder",/    "reverseEnergy",/' ci/validate_pr43_acoustic_diagnostics.py
          python3 ci/validate_pr43_acoustic_diagnostics.py

      - name: Commit implementation back to PR43
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/RoomCorrectionMeasurementAnalyzer.swift
          git add NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift
          git add NotchSixtyTests/RoomCorrectionMeasurementAnalyzerTests.swift
          git add ci/validate_pr43_acoustic_diagnostics.py
          git commit -m "PR43: add advanced acoustic diagnostics"
          git push origin HEAD:pr43-advanced-acoustic-speaker-optimization
