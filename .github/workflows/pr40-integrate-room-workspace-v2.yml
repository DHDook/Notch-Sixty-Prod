name: PR40 Production Room Correction Workspace Integration V2

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-room-workspace-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Integrate calibration controller and workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('NotchSixty/NotchSixtyApp.swift')
          text = app.read_text()

          unique = [
              (
                  '    let audioEngine: AudioIOEngine\n    let profiles: ProductProfileController\n    private var audioEngineObservation: AnyCancellable?',
                  '    let audioEngine: AudioIOEngine\n    let profiles: ProductProfileController\n    let calibration: RoomCorrectionCalibrationController\n    private var audioEngineObservation: AnyCancellable?\n    private var calibrationObservation: AnyCancellable?'
              ),
              (
                  '    func prepareForUse() {\n        audioEngine.prepareForUse()\n        profiles.restoreSelectedLayers()\n    }',
                  '    func prepareForUse() {\n        audioEngine.prepareForUse()\n        profiles.restoreSelectedLayers()\n        calibration.prepareForUse()\n    }'
              ),
              (
                  '    func shutdownForTermination() {\n        audioEngine.shutdownForTermination()\n    }',
                  '    func shutdownForTermination() {\n        calibration.cancelMeasurement()\n        audioEngine.shutdownForTermination()\n    }'
              ),
              (
                  '    private func observeAudioEngine() {\n        audioEngineObservation = audioEngine.objectWillChange.sink { [weak self] _ in\n            self?.objectWillChange.send()\n        }\n    }',
                  '    private func observeAudioEngine() {\n        audioEngineObservation = audioEngine.objectWillChange.sink { [weak self] _ in\n            self?.objectWillChange.send()\n        }\n        calibrationObservation = calibration.objectWillChange.sink { [weak self] _ in\n            self?.objectWillChange.send()\n        }\n    }'
              ),
          ]
          for old, new in unique:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one app anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          old = '        self.audioEngine = audioEngine\n        self.profiles = ProductProfileController(engine: audioEngine)\n        observeAudioEngine()'
          new = '        self.audioEngine = audioEngine\n        self.profiles = ProductProfileController(engine: audioEngine)\n        self.calibration = RoomCorrectionCalibrationController(engine: audioEngine)\n        observeAudioEngine()'
          if text.count(new) != 2:
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f'Expected two ProductController initializer anchors, found {count}')
              text = text.replace(old, new)
          app.write_text(text)

          root = Path('NotchSixty/UI/ProductionRootView.swift')
          text = root.read_text()
          old = '        case .roomCorrection:\n            ProductionRoomCorrectionView(engine: engine)'
          new = '        case .roomCorrection:\n            ProductionRoomCorrectionWorkspace(engine: engine, calibration: product.calibration)'
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one room route anchor, found {count}')
              text = text.replace(old, new, 1)
          root.write_text(text)

          project = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = project.read_text()
          replacements = [
              (
                  '\t\tA40000000000000000000016 /* ProductionProfileToolbar.swift in Sources */ = {isa = PBXBuildFile; fileRef = A40000000000000000000026 /* ProductionProfileToolbar.swift */; };',
                  '\t\tA40000000000000000000016 /* ProductionProfileToolbar.swift in Sources */ = {isa = PBXBuildFile; fileRef = A40000000000000000000026 /* ProductionProfileToolbar.swift */; };\n'
                  '\t\tA40000000000000000000017 /* ProductionRoomCorrectionWorkspace.swift in Sources */ = {isa = PBXBuildFile; fileRef = A40000000000000000000027 /* ProductionRoomCorrectionWorkspace.swift */; };'
              ),
              (
                  '\t\tA40000000000000000000026 /* ProductionProfileToolbar.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductionProfileToolbar.swift; sourceTree = "<group>"; };',
                  '\t\tA40000000000000000000026 /* ProductionProfileToolbar.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductionProfileToolbar.swift; sourceTree = "<group>"; };\n'
                  '\t\tA40000000000000000000027 /* ProductionRoomCorrectionWorkspace.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductionRoomCorrectionWorkspace.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\tA40000000000000000000050 /* UI */ = {isa = PBXGroup; children = (A40000000000000000000020 /* ProductionRootView.swift */, A40000000000000000000021 /* ProductionEqualizerView.swift */, A40000000000000000000022 /* ProductionDynamicsView.swift */, A40000000000000000000023 /* ProductionDynamicsTelemetryView.swift */, A40000000000000000000024 /* ProductionMetersView.swift */, A40000000000000000000025 /* ProductionAnalysisViews.swift */, A40000000000000000000026 /* ProductionProfileToolbar.swift */,); path = UI; sourceTree = "<group>"; };',
                  '\t\tA40000000000000000000050 /* UI */ = {isa = PBXGroup; children = (A40000000000000000000020 /* ProductionRootView.swift */, A40000000000000000000021 /* ProductionEqualizerView.swift */, A40000000000000000000022 /* ProductionDynamicsView.swift */, A40000000000000000000023 /* ProductionDynamicsTelemetryView.swift */, A40000000000000000000024 /* ProductionMetersView.swift */, A40000000000000000000025 /* ProductionAnalysisViews.swift */, A40000000000000000000026 /* ProductionProfileToolbar.swift */, A40000000000000000000027 /* ProductionRoomCorrectionWorkspace.swift */,); path = UI; sourceTree = "<group>"; };'
              ),
              (
                  '\t\t\t\tA40000000000000000000016 /* ProductionProfileToolbar.swift in Sources */,\n\t\t\t\tA20000000000000000000010 /* AudioIOEngine.swift in Sources */,',
                  '\t\t\t\tA40000000000000000000016 /* ProductionProfileToolbar.swift in Sources */,\n'
                  '\t\t\t\tA40000000000000000000017 /* ProductionRoomCorrectionWorkspace.swift in Sources */,\n'
                  '\t\t\t\tA20000000000000000000010 /* AudioIOEngine.swift in Sources */,'
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one project anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          project.write_text(text)
          PY

      - name: Commit production workspace integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/NotchSixtyApp.swift NotchSixty/UI/ProductionRootView.swift NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-integrate-room-workspace-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: integrate production room measurement workspace"
          git push origin HEAD:pr40-room-correction-production-workflow
