name: PR40 Calibration Rate Validation Hardening

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-validate-calibration-rates.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Harden native-rate validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty/Audio/CoreAudio/RoomCorrectionCalibrationTransport.swift')
          text = path.read_text()

          replacements = [
              (
                  '    case outputSampleRateMismatch(expected: Double, actual: Double)\n    case invalidInputChannel',
                  '    case outputSampleRateMismatch(expected: Double, actual: Double)\n    case sampleRateMismatch(role: String, expected: Double, actual: Double)\n    case invalidInputChannel'
              ),
              (
                  '        case .outputSampleRateMismatch(let expected, let actual):\n            return "Room measurement requires the selected output to be running at \\(expected) Hz; it is currently at \\(actual) Hz."\n        case .invalidInputChannel',
                  '        case .outputSampleRateMismatch(let expected, let actual):\n            return "Room measurement requires the selected output to be running at \\(expected) Hz; it is currently at \\(actual) Hz."\n        case .sampleRateMismatch(let role, let expected, let actual):\n            return "Room measurement requires \\(role) to run natively at \\(expected) Hz; Core Audio reported \\(actual) Hz."\n        case .invalidInputChannel'
              ),
              (
                  '        guard abs(output.nominalSampleRate - sampleRate) < 0.5 else {\n            throw RoomCorrectionCalibrationTransportError.outputSampleRateMismatch(\n                expected: sampleRate,\n                actual: output.nominalSampleRate\n            )\n        }',
                  '        let actualOutputSampleRate = try Self.readNominalSampleRate(deviceID: output.deviceID)\n        guard abs(actualOutputSampleRate - sampleRate) < 0.5 else {\n            throw RoomCorrectionCalibrationTransportError.outputSampleRateMismatch(\n                expected: sampleRate,\n                actual: actualOutputSampleRate\n            )\n        }'
              ),
              (
                  '        try Self.validateFloatPCM(outputFormat, role: "physical output")\n\n        var aggregateInputChannelIndex',
                  '        try Self.validateFloatPCM(outputFormat, role: "physical output")\n        try Self.validateSampleRate(outputFormat, expected: sampleRate, role: "physical output stream")\n\n        var aggregateInputChannelIndex'
              ),
              (
                  '                guard abs(applied - sampleRate) < 0.5 else {\n                    throw RoomCorrectionCalibrationTransportError.outputSampleRateMismatch(\n                        expected: sampleRate,\n                        actual: applied\n                    )\n                }\n                inputSampleRateWasChanged = true',
                  '                guard abs(applied - sampleRate) < 0.5 else {\n                    throw RoomCorrectionCalibrationTransportError.sampleRateMismatch(\n                        role: "measurement microphone",\n                        expected: sampleRate,\n                        actual: applied\n                    )\n                }'
              ),
              (
                  '            try Self.writeNominalSampleRate(\n                deviceID: aggregateDeviceID,\n                sampleRate: sampleRate,\n                operation: "set room-measurement aggregate sample rate"\n            )\n            let outputBufferFrames',
                  '            try Self.writeNominalSampleRate(\n                deviceID: aggregateDeviceID,\n                sampleRate: sampleRate,\n                operation: "set room-measurement aggregate sample rate"\n            )\n            let aggregateSampleRate = try Self.readNominalSampleRate(deviceID: aggregateDeviceID)\n            guard abs(aggregateSampleRate - sampleRate) < 0.5 else {\n                throw RoomCorrectionCalibrationTransportError.sampleRateMismatch(\n                    role: "room-measurement aggregate",\n                    expected: sampleRate,\n                    actual: aggregateSampleRate\n                )\n            }\n            let outputBufferFrames'
              ),
              (
                  '        try Self.validateFloatPCM(inputFormat, role: "measurement input")\n        try Self.validateFloatPCM(calibrationOutputFormat, role: "measurement output")',
                  '        try Self.validateFloatPCM(inputFormat, role: "measurement input")\n        try Self.validateFloatPCM(calibrationOutputFormat, role: "measurement output")\n        try Self.validateSampleRate(inputFormat, expected: sampleRate, role: "measurement input stream")\n        try Self.validateSampleRate(calibrationOutputFormat, expected: sampleRate, role: "measurement output stream")'
              ),
              (
                  '            kAudioAggregateDeviceMainSubDeviceKey: output.uid,\n            kAudioAggregateDeviceIsPrivateKey: true,',
                  '            kAudioAggregateDeviceMainSubDeviceKey: output.uid,\n            kAudioAggregateDeviceClockDeviceKey: output.uid,\n            kAudioAggregateDeviceIsPrivateKey: true,'
              ),
              (
                  '    private static func aggregateDescription(\n        output: AudioOutputDevice,',
                  '    private static func validateSampleRate(\n        _ format: AudioStreamFormatDescription,\n        expected: Double,\n        role: String\n    ) throws {\n        guard format.sampleRate.isFinite, abs(format.sampleRate - expected) < 0.5 else {\n            throw RoomCorrectionCalibrationTransportError.sampleRateMismatch(\n                role: role,\n                expected: expected,\n                actual: format.sampleRate\n            )\n        }\n    }\n\n    private static func aggregateDescription(\n        output: AudioOutputDevice,'
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one native-rate anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/CoreAudio/RoomCorrectionCalibrationTransport.swift
          git rm .github/workflows/pr40-validate-calibration-rates.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: validate calibration native sample rates"
          git push origin HEAD:pr40-room-correction-production-workflow
