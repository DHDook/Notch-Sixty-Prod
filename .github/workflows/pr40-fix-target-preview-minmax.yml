name: PR40 Fix Target Preview MinMax

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-fix-target-preview-minmax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply target preview min/max fix
        run: python3 .github/scripts/pr40_fix_target_preview_minmax.py

      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/RoomCorrectionTargetDesigner.swift
          git rm .github/scripts/pr40_fix_target_preview_minmax.py
          git rm .github/workflows/pr40-fix-target-preview-minmax.yml
          git commit -m "PR40 Slice E: make correction preview min/max portable"
          git push origin HEAD:pr40-room-correction-production-workflow
