name: PR39 VU scale update

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Extend and densify signature VU scale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "NotchSixty/UI/ProductionRootView.swift",
              '''enum ProductionVUScale {
              static let referenceDBFS = -18.0
              static let minimumVU = -30.0
              static let maximumVU = 3.0

              static func decibelsFS(fromLinear linear: Float) -> Double {
                  guard linear.isFinite, linear > 0 else { return -.infinity }
                  return 20 * log10(Double(linear))
              }

              static func vu(fromLinearRMS linear: Float) -> Double {
                  let dbFS = decibelsFS(fromLinear: linear)
                  guard dbFS.isFinite else { return minimumVU }
                  return min(max(dbFS - referenceDBFS, minimumVU), maximumVU)
              }

              static func normalizedPosition(forVU vu: Double) -> Double {
                  let value = min(max(vu, minimumVU), maximumVU)
                  return (value - minimumVU) / (maximumVU - minimumVU)
              }
          ''',
              '''enum ProductionVUScale {
              static let referenceDBFS = -18.0
              static let minimumVU = -40.0
              static let maximumVU = 3.0

              // Compress the quiet end and devote progressively more angular
              // resolution to the working range around 0 VU, like an analog face.
              static let scaleAnchors: [(vu: Double, position: Double)] = [
                  (-40, 0.000),
                  (-30, 0.090),
                  (-20, 0.215),
                  (-10, 0.400),
                  (-7, 0.475),
                  (-5, 0.545),
                  (-3, 0.625),
                  (-2, 0.675),
                  (-1, 0.730),
                  (0, 0.790),
                  (1, 0.855),
                  (2, 0.925),
                  (3, 1.000),
              ]

              static func decibelsFS(fromLinear linear: Float) -> Double {
                  guard linear.isFinite, linear > 0 else { return -.infinity }
                  return 20 * log10(Double(linear))
              }

              static func vu(fromLinearRMS linear: Float) -> Double {
                  let dbFS = decibelsFS(fromLinear: linear)
                  guard dbFS.isFinite else { return minimumVU }
                  return min(max(dbFS - referenceDBFS, minimumVU), maximumVU)
              }

              static func normalizedPosition(forVU vu: Double) -> Double {
                  let value = min(max(vu, minimumVU), maximumVU)
                  for index in 0..<(scaleAnchors.count - 1) {
                      let lower = scaleAnchors[index]
                      let upper = scaleAnchors[index + 1]
                      guard value <= upper.vu else { continue }
                      let span = upper.vu - lower.vu
                      let fraction = span > 0 ? (value - lower.vu) / span : 0
                      return lower.position + fraction * (upper.position - lower.position)
                  }
                  return 1
              }
          '''
          )

          replace(
              "NotchSixty/UI/ProductionRootView.swift",
              '''        let ticks: [Double] = [-30, -20, -10, -7, -5, -3, -2, -1, 0, 1, 2, 3]
                  let labels: Set<Double> = [-30, -20, -10, -5, -3, 0, 3]
          ''',
              '''        let ticks: [Double] = [-40, -35, -30, -25, -20, -15, -10, -7, -5, -4, -3, -2, -1, 0, 1, 2, 3]
                  let labels: Set<Double> = [-40, -30, -20, -10, -7, -5, -3, 0, 3]
          '''
          )

          replace(
              "ci/validate_pr36_ui_foundation.py",
              'return min(max(dbfs - (-18.0), -30.0), 3.0)',
              'return min(max(dbfs - (-18.0), -40.0), 3.0)'
          )
          replace(
              "ci/validate_pr36_ui_foundation.py",
              'require(UI, "static let minimumVU = -30.0", "extended VU display floor")',
              '''require(UI, "static let minimumVU = -40.0", "extended VU display floor")
          require(UI, "static let scaleAnchors", "nonlinear analog VU scale")
          require(UI, "(-40, 0.000)", "VU scale quiet-end anchor")
          require(UI, "(0, 0.790)", "VU scale reference anchor")
          require(UI, "(3, 1.000)", "VU scale upper anchor")'''
          )
          replace(
              "ci/validate_pr36_ui_foundation.py",
              'for dbfs, expected in [(-48.0, -30.0), (-38.0, -20.0), (-18.0, 0.0), (-15.0, 3.0), (-60.0, -30.0), (-10.0, 3.0)]:',
              'for dbfs, expected in [(-58.0, -40.0), (-48.0, -30.0), (-38.0, -20.0), (-18.0, 0.0), (-15.0, 3.0), (-60.0, -40.0), (-10.0, 3.0)]:'
          )
          PY

          python3 ci/validate_pr36_ui_foundation.py
          rm .github/workflows/pr39-vu-scale-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR39: extend signature VU scale to -40"
          git push origin HEAD:feature/pr39-production-meters-analysis
