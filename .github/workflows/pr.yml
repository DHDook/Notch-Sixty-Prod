name: PR check

# Every pull request to main: build, XCTest and behavioural C harnesses.
# Target: under 10 minutes. The slowest every-sample-rate XCTest cases (each over 30 s on the
# runner, about 25 minutes together) are skipped here and run in full by macos-full.yml
# (nightly on main, PRs labelled full-ci, manual). Add a case to the skip list below when it
# takes more than about 30 s.
on:
  pull_request:
    branches:
      - main
    # Docs-only PRs (plans, epic notes, guides) skip the build. A PR that also changes code
    # still runs everything.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build and test (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -skip-testing:NotchSixtyTests/SeparateDeviceTimingTests/testOnePassAcrossDevicesMatchesThreeSequentialPassesAtEveryRate \
            -skip-testing:NotchSixtyTests/SeatMeasurerTests/testOnePassMatchesThreeSequentialPassesAtEveryRate \
            -skip-testing:NotchSixtyTests/SystemSetupEndToEndTests/testAllTenStepsAtEveryRate \
            -skip-testing:NotchSixtyTests/SeparateDeviceTimingTests/testRepeatsAcrossDevicesKeepWithinSeatTiming \
            -skip-testing:NotchSixtyTests/SeatMeasurerTests/testWizardMeasuresThreeSeatsInOnePassPerSourceAtEveryRate \
            -skip-testing:NotchSixtyTests/QuietZoneUpstreamSurveyTests/testLeadWithinATenthOfAMillisecondAndPredictionWithinADecibelAtEveryRate \
            -skip-testing:NotchSixtyTests/RoomCorrectionDeployControllerTests/testCorrectDesignPassesAtEveryRate \
            -skip-testing:NotchSixtyTests/SeatMeasurerTests/testBurstInOneRepeatAtOneSeatRejectsOnlyThere \
            -skip-testing:NotchSixtyTests/QuietZoneUpstreamSurveyTests/testAShortLeadSaysMoveFurtherOut \
            -skip-testing:NotchSixtyTests/FeedForwardLiveReferencePumpTests/testReferenceLandsOnTheOutputClockAtEightRatesWithDrift \
            test 2>&1 | tee "$RUNNER_TEMP/xctest.log"

      - name: Upload XCTest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xctest-log
          path: ${{ runner.temp }}/xctest.log
          retention-days: 7

  harnesses:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Behavioural C harnesses
        run: ci/run_harnesses.sh

