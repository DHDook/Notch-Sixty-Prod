name: PR25 Audition Core V2

on:
  push:
    branches: [feature/latency-matched-audition-delta]
    paths:
      - .github/workflows/pr25-audition-core-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct patch cardinality
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/pr25_audition_core.py')
          t = p.read_text()
          old = "'''    bool bypassed;\\n    N60AuditionMode auditionMode;\\n    uint32_t latencyFrames;\\n''', 2)"
          new = "'''    bool bypassed;\\n    N60AuditionMode auditionMode;\\n    uint32_t latencyFrames;\\n''')"
          if old not in t:
              raise SystemExit('cardinality marker missing')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Apply PR25 core patch
        run: python3 .github/scripts/pr25_audition_core.py
      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test
      - name: Commit implementation and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr25-audition-core.yml .github/workflows/pr25-audition-core-v2.yml .github/scripts/pr25_audition_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/Audio/Realtime/N60RenderKernel.h NotchSixty/Audio/Realtime/N60RenderKernel.c NotchSixty/Audio/StereoPlaybackControl.swift NotchSixty/Audio/AudioIOEngine.swift NotchSixtyTests/StereoPlaybackControlTests.swift .github/workflows/pr25-audition-core.yml .github/workflows/pr25-audition-core-v2.yml .github/scripts/pr25_audition_core.py
          git commit -m 'Add latency-matched reference and delta audition core'
          git push origin HEAD:feature/latency-matched-audition-delta
