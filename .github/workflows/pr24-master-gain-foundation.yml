name: PR24 Master Gain Foundation

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-master-gain-foundation.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply master gain foundation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"pattern not found enough times in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          h = "NotchSixty/Audio/Realtime/N60RenderKernel.h"
          replace(h,
              "    float outputGainLinear;\n    float balanceGainLeftLinear;",
              "    float outputGainLinear;\n    float masterGainLinear;\n    float balanceGainLeftLinear;",
              2)

          c = "NotchSixty/Audio/Realtime/N60RenderKernel.c"
          replace(c,
              "    N60SmoothedGain outputGain;\n    N60SmoothedGain balanceGainLeft;",
              "    N60SmoothedGain outputGain;\n    N60SmoothedGain masterGain;\n    N60SmoothedGain balanceGainLeft;")
          replace(c,
              "        || !isfinite(snapshot.outputGainLinear)\n        || snapshot.outputGainLinear < 0.0f\n        || !isfinite(snapshot.balanceGainLeftLinear)",
              "        || !isfinite(snapshot.outputGainLinear)\n        || snapshot.outputGainLinear < 0.0f\n        || !isfinite(snapshot.masterGainLinear)\n        || snapshot.masterGainLinear < 0.0f\n        || snapshot.masterGainLinear > 1.0f\n        || !isfinite(snapshot.balanceGainLeftLinear)")
          replace(c,
              "        reset_smoothed_gain(&kernel->outputGain, snapshot->outputGainLinear);\n        reset_smoothed_gain(&kernel->balanceGainLeft, snapshot->balanceGainLeftLinear);",
              "        reset_smoothed_gain(&kernel->outputGain, snapshot->outputGainLinear);\n        reset_smoothed_gain(&kernel->masterGain, snapshot->masterGainLinear);\n        reset_smoothed_gain(&kernel->balanceGainLeft, snapshot->balanceGainLeftLinear);")
          replace(c,
              "        schedule_gain_transition(&kernel->outputGain, snapshot->outputGainLinear, gainFrames);\n        schedule_gain_transition(&kernel->balanceGainLeft, snapshot->balanceGainLeftLinear, gainFrames);",
              "        schedule_gain_transition(&kernel->outputGain, snapshot->outputGainLinear, gainFrames);\n        schedule_gain_transition(&kernel->masterGain, snapshot->masterGainLinear, gainFrames);\n        schedule_gain_transition(&kernel->balanceGainLeft, snapshot->balanceGainLeftLinear, gainFrames);")
          replace(c,
              "    snapshot.outputGainLinear = 1.0f;\n    snapshot.balanceGainLeftLinear = 1.0f;",
              "    snapshot.outputGainLinear = 1.0f;\n    snapshot.masterGainLinear = 1.0f;\n    snapshot.balanceGainLeftLinear = 1.0f;")
          replace(c,
              "    reset_smoothed_gain(&kernel->outputGain, 1.0f);\n    reset_smoothed_gain(&kernel->balanceGainLeft, 1.0f);",
              "    reset_smoothed_gain(&kernel->outputGain, 1.0f);\n    reset_smoothed_gain(&kernel->masterGain, 1.0f);\n    reset_smoothed_gain(&kernel->balanceGainLeft, 1.0f);",
              2)
          replace(c,
              "        float outputGain = next_gain_value(&kernel->outputGain);\n        left *= outputGain;\n        right *= outputGain;",
              "        float outputGain = next_gain_value(&kernel->outputGain);\n        float masterGain = next_gain_value(&kernel->masterGain);\n        left *= outputGain * masterGain;\n        right *= outputGain * masterGain;")
          replace(c,
              "        diagnostics.outputGainLinear = context.snapshot.outputGainLinear;\n        diagnostics.balanceGainLeftLinear = context.snapshot.balanceGainLeftLinear;",
              "        diagnostics.outputGainLinear = context.snapshot.outputGainLinear;\n        diagnostics.masterGainLinear = context.snapshot.masterGainLinear;\n        diagnostics.balanceGainLeftLinear = context.snapshot.balanceGainLeftLinear;")

          swift = "NotchSixty/Audio/StereoPlaybackControl.swift"
          text = Path(swift).read_text()
          marker = "struct PlaybackControlConfiguration: Equatable, Sendable {"
          if marker not in text:
              raise SystemExit("PlaybackControlConfiguration marker not found")
          model = '''enum MasterVolumeControlMode: String, Equatable, Sendable {
              case softwareDSP
              case device
          }

          struct MasterVolumeDeviceCapabilities: Equatable, Sendable {
              var volumeReadable = false
              var volumeWritable = false
              var muteReadable = false
              var muteWritable = false

              static let softwareOnly = MasterVolumeDeviceCapabilities()

              var controlMode: MasterVolumeControlMode {
                  volumeWritable ? .device : .softwareDSP
              }
          }

          struct MasterVolumeConfiguration: Equatable, Sendable {
              static let levelRange = 0.0...1.0

              var level: Double = 1.0
              var muted = false

              func softwareGain(for capabilities: MasterVolumeDeviceCapabilities) -> Float {
                  let volumeGain = capabilities.volumeWritable ? 1.0 : level
                  let muteGain = muted && !capabilities.muteWritable ? 0.0 : 1.0
                  return Float(volumeGain * muteGain)
              }
          }

          enum MasterVolumeConfigurationError: Error, LocalizedError, Equatable {
              case invalidLevel(Double)

              var errorDescription: String? {
                  switch self {
                  case .invalidLevel(let level):
                      return "Master volume \\(level) is outside the supported 0...1 range."
                  }
              }
          }

          '''
          Path(swift).write_text(text.replace(marker, model + marker, 1))

          # Add a graph parameter without forcing every existing caller/test to change.
          replace(swift,
              "        bassManagementConfiguration: BassManagementConfiguration,\n        playbackConfiguration: PlaybackControlConfiguration\n    ) throws -> N60DSPGraphSnapshot {",
              "        bassManagementConfiguration: BassManagementConfiguration,\n        playbackConfiguration: PlaybackControlConfiguration,\n        masterGainLinear: Float = 1.0\n    ) throws -> N60DSPGraphSnapshot {")
          replace(swift,
              "        graph.outputGainLinear = DSPGainConfiguration.linearGain(forDB: gainConfiguration.outputGainDB)\n        let balance = playbackConfiguration.balanceLinearGains",
              "        graph.outputGainLinear = DSPGainConfiguration.linearGain(forDB: gainConfiguration.outputGainDB)\n        graph.masterGainLinear = masterGainLinear\n        let balance = playbackConfiguration.balanceLinearGains")

          tests = Path("NotchSixtyTests/StereoPlaybackControlTests.swift")
          t = tests.read_text()
          insert_marker = "\n    func testGraphBypassReturnsUntreatedStereoSamples() {"
          if insert_marker not in t:
              raise SystemExit("test marker not found")
          new_tests = '''

              func testMasterVolumeCapabilityPolicyUsesHardwareVolumeWhenWritable() {
                  let hardware = MasterVolumeDeviceCapabilities(
                      volumeReadable: true,
                      volumeWritable: true,
                      muteReadable: true,
                      muteWritable: true
                  )
                  let software = MasterVolumeDeviceCapabilities.softwareOnly
                  let normal = MasterVolumeConfiguration(level: 0.25, muted: false)
                  let muted = MasterVolumeConfiguration(level: 0.25, muted: true)

                  XCTAssertEqual(hardware.controlMode, .device)
                  XCTAssertEqual(normal.softwareGain(for: hardware), 1.0)
                  XCTAssertEqual(muted.softwareGain(for: hardware), 1.0)
                  XCTAssertEqual(software.controlMode, .softwareDSP)
                  XCTAssertEqual(normal.softwareGain(for: software), 0.25, accuracy: 0.000_001)
                  XCTAssertEqual(muted.softwareGain(for: software), 0.0)
              }

              func testMasterMuteFallsBackToSoftwareWhenDeviceHasNoWritableMute() {
                  let capability = MasterVolumeDeviceCapabilities(
                      volumeReadable: true,
                      volumeWritable: true,
                      muteReadable: false,
                      muteWritable: false
                  )
                  XCTAssertEqual(
                      MasterVolumeConfiguration(level: 0.7, muted: true).softwareGain(for: capability),
                      0.0
                  )
                  XCTAssertEqual(
                      MasterVolumeConfiguration(level: 0.7, muted: false).softwareGain(for: capability),
                      1.0
                  )
              }

              func testRealtimeMasterGainIsIndependentAndSmoothed() {
                  guard let kernel = N60RenderKernelCreate() else {
                      return XCTFail("Unable to create render kernel")
                  }
                  defer { N60RenderKernelDestroy(kernel) }

                  var graph = N60DSPGraphSnapshotMakeUnity(96_000)
                  graph.masterGainLinear = 0.25
                  XCTAssertTrue(N60RenderKernelPublishSnapshot(kernel, graph))

                  for _ in 0..<2_000 {
                      var left: Float = 0
                      var right: Float = 0
                      N60RenderKernelProcessStereoFrame(kernel, 0.8, -0.4, &left, &right)
                      XCTAssertEqual(left, 0.2, accuracy: 0.000_01)
                      XCTAssertEqual(right, -0.1, accuracy: 0.000_01)
                  }
                  let diagnostics = N60RenderKernelGetDiagnostics(kernel)
                  XCTAssertEqual(diagnostics.masterGainLinear, 0.25, accuracy: 0.000_001)
              }
          '''
          tests.write_text(t.replace(insert_marker, new_tests + insert_marker, 1))
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit foundation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr24-master-gain-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/Audio/Realtime/N60RenderKernel.h NotchSixty/Audio/Realtime/N60RenderKernel.c NotchSixty/Audio/StereoPlaybackControl.swift NotchSixtyTests/StereoPlaybackControlTests.swift .github/workflows/pr24-master-gain-foundation.yml
          git commit -m 'Add independent master volume gain stage'
          git push origin HEAD:feature/master-volume-mute-sync
