name: PR108 Coherent Subwoofer Alignment

on:
  push:
    branches:
      - feature/pr108-coherent-subwoofer-alignment
  pull_request:
    branches:
      - feature/pr107-speaker-optimizer-fir-deployment-latency
  workflow_dispatch:

concurrency:
  group: pr108-coherent-subwoofer-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR108 coherent Sub alignment boundary
        run: python3 ci/validate_pr108_coherent_subwoofer_alignment.py
      - name: Preserve PR107 FIR deployment closure
        run: python3 ci/validate_pr107_speaker_optimizer_fir.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR108 coherent Sub alignment boundary
        run: python3 ci/validate_pr108_coherent_subwoofer_alignment.py
      - name: Preserve PR107 FIR deployment closure
        run: python3 ci/validate_pr107_speaker_optimizer_fir.py
      - name: Build arm64 Debug app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
      - name: Run PR108 coherent Sub alignment tests
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/CoherentSubwooferAlignmentTests
          -only-testing:NotchSixtyTests/CoherentSubwooferAlignmentCommissioningTests
          -only-testing:NotchSixtyTests/CoherentSubwooferAlignmentApplyTransactionTests
          -only-testing:NotchSixtyTests/CoherentSubwooferAlignmentPostApplyVerificationTests
          -only-testing:NotchSixtyTests/CoherentMultiSubwooferAlignmentTests
          -only-testing:NotchSixtyTests/CoherentMultiSubwooferAlignmentCommissioningTests
          -only-testing:NotchSixtyTests/CoherentMultiSubwooferAlignmentApplyTransactionTests
          test
      - name: Run full XCTest regression
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
