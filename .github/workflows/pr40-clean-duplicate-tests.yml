name: PR40 Duplicate Test Cleanup

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-clean-duplicate-tests.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Remove duplicate appended tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixtyTests/ProductionAnalysisTests.swift')
          text = path.read_text()
          marker = '\n    func testRoomCorrectionCalibrationStateMachineEnforcesWorkflow() throws {'
          start = text.find(marker)
          if start >= 0:
              end = text.rfind('\n}')
              if end <= start:
                  raise SystemExit('Could not isolate duplicate test block')
              text = text[:start] + text[end:]
              path.write_text(text)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixtyTests/ProductionAnalysisTests.swift
          git rm .github/workflows/pr40-clean-duplicate-tests.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: remove duplicate capture-session tests"
          git push origin HEAD:pr40-room-correction-production-workflow
