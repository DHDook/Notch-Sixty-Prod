name: PR40 Integrate Project Ownership

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-project-ownership.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Integrate project ownership with product and root UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ProductController owns the sidecar project controller alongside capture.
          app = Path('NotchSixty/NotchSixtyApp.swift')
          text = app.read_text()
          old_props = '''    let audioEngine: AudioIOEngine
              let profiles: ProductProfileController
              let calibration: RoomCorrectionCalibrationController
              private var audioEngineObservation: AnyCancellable?
              private var calibrationObservation: AnyCancellable?
          '''
          # Whitespace-tolerant line insertion instead of relying on the block above.
          lines = text.splitlines()
          calibration_property = '    let calibration: RoomCorrectionCalibrationController'
          if '    let roomCorrectionProjects: RoomCorrectionProjectController' not in lines:
              matches = [i for i, line in enumerate(lines) if line == calibration_property]
              if len(matches) != 1:
                  raise SystemExit('Unexpected ProductController calibration property count')
              lines.insert(matches[0] + 1, '    let roomCorrectionProjects: RoomCorrectionProjectController')

          text = '\n'.join(lines) + '\n'
          old_init1 = '''    init() {
                  let audioEngine = AudioIOEngine()
                  self.audioEngine = audioEngine
                  self.profiles = ProductProfileController(engine: audioEngine)
                  self.calibration = RoomCorrectionCalibrationController(engine: audioEngine)
                  observeAudioEngine()
              }
          '''
          new_init1 = '''    init() {
                  let audioEngine = AudioIOEngine()
                  let profiles = ProductProfileController(engine: audioEngine)
                  self.audioEngine = audioEngine
                  self.profiles = profiles
                  self.calibration = RoomCorrectionCalibrationController(engine: audioEngine)
                  self.roomCorrectionProjects = RoomCorrectionProjectController(profiles: profiles)
                  observeAudioEngine()
              }
          '''
          if new_init1 not in text:
              if text.count(old_init1) != 1:
                  raise SystemExit('Unexpected ProductController default initializer')
              text = text.replace(old_init1, new_init1, 1)

          old_init2 = '''    init(audioEngine: AudioIOEngine) {
                  self.audioEngine = audioEngine
                  self.profiles = ProductProfileController(engine: audioEngine)
                  self.calibration = RoomCorrectionCalibrationController(engine: audioEngine)
                  observeAudioEngine()
              }
          '''
          new_init2 = '''    init(audioEngine: AudioIOEngine) {
                  let profiles = ProductProfileController(engine: audioEngine)
                  self.audioEngine = audioEngine
                  self.profiles = profiles
                  self.calibration = RoomCorrectionCalibrationController(engine: audioEngine)
                  self.roomCorrectionProjects = RoomCorrectionProjectController(profiles: profiles)
                  observeAudioEngine()
              }
          '''
          if new_init2 not in text:
              if text.count(old_init2) != 1:
                  raise SystemExit('Unexpected ProductController injected initializer')
              text = text.replace(old_init2, new_init2, 1)

          old_prepare = '''    func prepareForUse() {
                  audioEngine.prepareForUse()
                  profiles.restoreSelectedLayers()
                  calibration.prepareForUse()
              }
          '''
          new_prepare = '''    func prepareForUse() {
                  audioEngine.prepareForUse()
                  profiles.restoreSelectedLayers()
                  roomCorrectionProjects.prepareForUse()
                  calibration.prepareForUse()
              }
          '''
          if new_prepare not in text:
              if text.count(old_prepare) != 1:
                  raise SystemExit('Unexpected ProductController prepareForUse')
              text = text.replace(old_prepare, new_prepare, 1)
          app.write_text(text)

          # Expose a new-project recovery path and suggested ergonomic position name.
          project = Path('NotchSixty/State/RoomCorrectionProjectController.swift')
          text = project.read_text()
          aggregate_anchor = '    var aggregate: RoomCorrectionAggregateResponse? { project?.aggregate }\n'
          addition = '''

              var suggestedPositionName: String {
                  Self.defaultPositionName(index: positions.count)
              }

              func startNewProject(now: Date = Date()) throws {
                  guard let systemID = selectedPlaybackSystemID else {
                      throw RoomCorrectionProjectControllerError.noSelectedPlaybackSystem
                  }
                  let fresh = RoomCorrectionProject(
                      playbackSystemID: systemID,
                      name: "\\(selectedPlaybackSystemName) Room Correction",
                      createdAt: now,
                      modifiedAt: now
                  )
                  try persistAndPublish(fresh)
              }
          '''.replace('              ', '    ')
          if '    var suggestedPositionName: String {' not in text:
              if text.count(aggregate_anchor) != 1:
                  raise SystemExit('Unexpected project aggregate property anchor')
              text = text.replace(aggregate_anchor, aggregate_anchor + addition, 1)
          project.write_text(text)

          # ProductionRootView passes the durable project owner and profile source.
          root = Path('NotchSixty/UI/ProductionRootView.swift')
          text = root.read_text()
          old = '            ProductionRoomCorrectionWorkspace(engine: engine, calibration: product.calibration)'
          new = '''            ProductionRoomCorrectionWorkspace(
                      engine: engine,
                      calibration: product.calibration,
                      projects: product.roomCorrectionProjects,
                      profiles: product.profiles
                  )'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Unexpected Room Correction workspace construction')
              text = text.replace(old, new, 1)
          root.write_text(text)
          PY

      - name: Commit integration and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/NotchSixtyApp.swift NotchSixty/State/RoomCorrectionProjectController.swift NotchSixty/UI/ProductionRootView.swift
          git rm .github/workflows/pr40-integrate-project-ownership.yml
          git commit -m "PR40 Slice D: integrate Playback System project ownership"
          git push origin HEAD:pr40-room-correction-production-workflow
