name: Batch 4 Final Product Validation

on:
  pull_request:
    branches:
      - feature/batch3-headphone-completion
    types: [opened, reopened, synchronize, labeled]
  push:
    branches:
      - feature/batch4-final-product-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch4-validation-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

jobs:
  fast-portable:
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[integration-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check blind listening, source provenance, ABI and hardware boundary
        run: |
          set -euo pipefail
          python3 ci/validate_batch4_final_validation.py
          python3 ci/validate_batch3_headphone_completion.py
          python3 ci/validate_batch2_unified_acoustics.py
          python3 ci/validate_pr114_provenance_sbom.py
          python3 ci/validate_pr112a_hardware_acceptance.py
          python3 ci/validate_pr117a_crossover_precision.py --source-only

  exact-head-apple-silicon:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'integration-ci') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[integration-ci]'))
    needs: fast-portable
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify same-head source and legal/provenance authority gates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/batch4-markers"
          python3 ci/validate_batch4_final_validation.py
          python3 ci/validate_batch3_headphone_completion.py
          python3 ci/validate_batch2_unified_acoustics.py
          python3 ci/validate_pr114_provenance_sbom.py
          python3 ci/validate_pr112a_hardware_acceptance.py
          touch "$RUNNER_TEMP/batch4-markers/portable_contract.ok"
      - name: Verify reference acoustics and SOFA renderer under Apple Clang
        run: |
          set -euo pipefail
          python3 ci/validate_acoustic_batch1.py \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 ci/validate_pr56_headphone_dsp.py
          python3 ci/validate_pr57_binaural_renderer.py
          python3 ci/validate_pr117c_spatial_reference.py
          touch "$RUNNER_TEMP/batch4-markers/apple_reference.ok"
      - name: Generate actual synthetic SOFA HDF5 fixture files
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/batch4-venv"
          "$RUNNER_TEMP/batch4-venv/bin/python" -m pip install --quiet netCDF4 numpy
          "$RUNNER_TEMP/batch4-venv/bin/python" \
            ci/generate_pr117d_sofa_fixtures.py "$RUNNER_TEMP/batch4-sofa"
          "$RUNNER_TEMP/batch4-venv/bin/python" \
            ci/generate_pr85_sofa_fixture.py "$RUNNER_TEMP/batch4-pr85.sofa"
          for f in integer384 fractional48 negative441 nonfinite384; do
            test -f "$RUNNER_TEMP/batch4-sofa/$f.sofa"
          done
          touch "$RUNNER_TEMP/batch4-markers/native_sofa_fixture.ok"
      - name: Build unsigned Apple Silicon arm64 Release application
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj \
            -scheme NotchSixty -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=NotchSixty/Info.plist build
          touch "$RUNNER_TEMP/batch4-markers/release_arm64.ok"
      - name: Run cumulative Debug XCTest including ABX and real SOFA files
        env:
          PR85_SOFA_FIXTURE: ${{ runner.temp }}/batch4-pr85.sofa
          PR117D_SOFA_FIXTURE_DIR: ${{ runner.temp }}/batch4-sofa
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj \
            -scheme NotchSixty -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
          touch "$RUNNER_TEMP/batch4-markers/full_xctest.ok"
      - name: Generate exact-run CycloneDX SBOM and license checks
        run: |
          set -euo pipefail
          python3 ci/build_pr114_sbom.py --output "$RUNNER_TEMP/batch4-sbom.json"
          python3 ci/validate_pr114_provenance_sbom.py
          touch "$RUNNER_TEMP/batch4-markers/sbom_provenance.ok"
      - name: Confirm real physical H01–H08 remain owner-gated
        run: |
          set -euo pipefail
          python3 ci/validate_pr112a_hardware_acceptance.py
          touch "$RUNNER_TEMP/batch4-markers/hardware_authority_boundary.ok"
      - name: Produce exact-head SOFTWARE-only product/owner handoff
        run: |
          set -euo pipefail
          python3 ci/build_batch4_final_handoff.py \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --branch feature/batch4-final-product-validation \
            --markers-dir "$RUNNER_TEMP/batch4-markers" \
            --sbom "$RUNNER_TEMP/batch4-sbom.json" \
            --output "$RUNNER_TEMP/batch4-final-handoff.json"
      - name: Retain batch-four acceptance packet and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: batch4-final-software-handoff
          path: |
            ${{ runner.temp }}/batch4-final-handoff.json
            ${{ runner.temp }}/batch4-sbom.json
          retention-days: 60
          if-no-files-found: error
