name: PR40 Integrate Target Design UI

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-target-design-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0
      - name: Apply production target/design UI
        run: python3 .github/scripts/pr40_integrate_target_design_ui.py
      - name: Commit UI and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/pr40_integrate_target_design_ui.py .github/workflows/pr40-integrate-target-design-ui.yml
          git add NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift
          git commit -m "PR40 Slice E: add production target and design workflow"
          git push origin HEAD:pr40-room-correction-production-workflow
