name: PR117 Acoustic Reference Laboratory

on:
  push:
    branches:
      - feature/pr117-acoustic-reference-laboratory
  pull_request:
    branches:
      - feature/pr116b-dashboard-vu-icon-alignment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr117-acoustic-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify inherited product protection and UI contracts
        run: |
          set -euo pipefail
          python3 ci/validate_pr116b_dashboard_vu.py
          python3 ci/validate_pr68_vu_volume_polish.py
          python3 ci/validate_pr112a_hardware_acceptance.py
      - name: Production C DSP versus independent acoustic/headphone references
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117_acoustic_reference_lab.py \
            --commit "$N60_COMMIT" \
            --report "$RUNNER_TEMP/pr117-acoustic-reference-portable.json"
      - name: Publish portable reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr117-acoustic-reference-ubuntu
          path: ${{ runner.temp }}/pr117-acoustic-reference-portable.json
          if-no-files-found: error
          retention-days: 30

  macos-reference-and-app:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Independent Apple Clang acoustic reference validation
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117_acoustic_reference_lab.py \
            --commit "$N60_COMMIT" \
            --report "$RUNNER_TEMP/pr117-acoustic-reference-macos.json"
          python3 ci/validate_pr56_headphone_dsp.py
          python3 ci/validate_pr57_binaural_renderer.py
          python3 ci/validate_pr86_calibration_prediction.py
          python3 ci/validate_pr109_cross_feature_contracts.py
          python3 ci/validate_pr116b_dashboard_vu.py
      - name: Build arm64 Debug app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
      - name: Build arm64 Release app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Release -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO GENERATE_INFOPLIST_FILE=NO
          INFOPLIST_FILE=NotchSixty/Info.plist build
      - name: Cumulative XCTest regression
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - name: Publish Apple Clang reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr117-acoustic-reference-macos
          path: ${{ runner.temp }}/pr117-acoustic-reference-macos.json
          if-no-files-found: error
          retention-days: 30
