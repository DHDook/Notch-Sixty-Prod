name: PR40 Capture Session Test Integration V2

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-capture-tests-integration-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Add capture session tests
        shell: bash
        env:
          TEST_SNIPPET_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('NotchSixtyTests/ProductionAnalysisTests.swift')
          text = path.read_text()
          marker = 'func testRoomCorrectionRealtimeSessionUsesBoundedPairedCaptures()'
          if marker not in text:
              snippet = base64.b64decode(os.environ['TEST_SNIPPET_B64']).decode()
              insert_at = text.rfind('\n}')
              if insert_at < 0:
                  raise SystemExit('Could not find test class closing brace')
              text = text[:insert_at] + '\n' + snippet + text[insert_at:]
              path.write_text(text)
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixtyTests/ProductionAnalysisTests.swift
          git rm .github/workflows/pr40-capture-tests-integration-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: test bounded room measurement session"
          git push origin HEAD:pr40-room-correction-production-workflow
