name: PR64 Product Wiring

on:
  push:
    branches:
      - feature/pr64-multichannel-calibration-workflow
    paths:
      - ci/pr64_wire_product.py
      - .github/workflows/pr64-wire-product.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr64-multichannel-calibration-workflow
          fetch-depth: 0
      - name: Apply asserted product wiring
        run: python3 ci/pr64_wire_product.py
      - name: Commit wiring and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f ci/pr64_wire_product.py .github/workflows/pr64-wire-product.yml
          git add NotchSixty/NotchSixtyApp.swift NotchSixty/UI/ProductionRootView.swift NotchSixty.xcodeproj/project.pbxproj
          git commit -m "PR64: wire speaker calibration into product UI"
          git push origin HEAD:feature/pr64-multichannel-calibration-workflow
