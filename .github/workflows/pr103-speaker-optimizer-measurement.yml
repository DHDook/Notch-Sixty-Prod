name: PR103 Speaker Optimizer Measurement Foundation

on:
  push:
    branches:
      - feature/pr103-speaker-optimizer-measurement-foundation
  pull_request:
    branches:
      - feature/pr102-integration-commercial-release
  workflow_dispatch:

concurrency:
  group: pr103-speaker-optimizer-measurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR103 measurement foundation
        run: python3 ci/validate_pr103_speaker_optimizer_measurement.py
      - name: Preserve PR102 release contract
        run: python3 ci/validate_pr102_release_readiness.py
      - name: Preserve disconnected feed-forward safety boundary
        run: python3 ci/audit_pr98_disconnected_boundary.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR103 measurement foundation
        run: python3 ci/validate_pr103_speaker_optimizer_measurement.py
      - name: Preserve PR102 release contract
        run: python3 ci/validate_pr102_release_readiness.py
      - name: Preserve disconnected feed-forward safety boundary
        run: python3 ci/audit_pr98_disconnected_boundary.py

      - name: Build arm64 Debug app
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Run PR103 measurement evidence tests
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/SpeakerOptimizerMeasurementEvidenceTests
          test

      - name: Run calibration regression tests
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/CalibrationPredictionVerifierTests
          -only-testing:NotchSixtyTests/RoomCorrectionMeasurementAnalyzerTests
          test
