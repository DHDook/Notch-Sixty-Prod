name: PR38 Helper

on:
  push:
    branches:
      - feature/pr38-production-dynamics
    paths:
      - ci/pr38_apply_final_slice.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr38-production-dynamics
          fetch-depth: 0
      - name: Apply PR38 final implementation slice
        run: python3 ci/pr38_apply_final_slice.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty ci docs NotchSixty.xcodeproj/project.pbxproj
          git commit -m "PR38: finish live dynamics status and mains detect"
          git push origin HEAD:feature/pr38-production-dynamics
