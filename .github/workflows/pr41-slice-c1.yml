name: PR41 Multi-output Routing Model
# Direct checkpoint after repairing both ambiguous one-shot helper targets.

on:
  push:
    branches:
      - pr41-active-crossover-matrix-parity
    paths:
      - .github/scripts/pr41_slice_c1.py
      - .github/workflows/pr41-slice-c1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - name: Check out PR41 branch
        uses: actions/checkout@v7
        with:
          ref: pr41-active-crossover-matrix-parity
          fetch-depth: 0

      - name: Apply PR41 Slice C1 patch
        run: python3 .github/scripts/pr41_slice_c1.py

      - name: Validate project and routing tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project NotchSixty.xcodeproj >/dev/null
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomCorrectionProjectControllerTests \
            test

      - name: Validate routing contract shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enum SpeakerOutputBus' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'struct MultiOutputRoutingConfiguration' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'case softwarePLL' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'outputChannelCount' NotchSixty/Audio/Devices/AudioOutputDevice.swift
          grep -q 'readOutputChannelCount' NotchSixty/Audio/Devices/OutputDeviceCatalog.swift
          grep -q 'replaceSelectedSystemOutputRouting' NotchSixty/State/ProductProfiles.swift
          grep -q 'testPlaybackSystemPersistsMultiOutputRoutingWithoutMutatingDSPOrLegacySelectedOutput' NotchSixtyTests/RoomCorrectionProjectControllerTests.swift

      - name: Commit patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/pr41_slice_c1.py .github/workflows/pr41-slice-c1.yml
          git add NotchSixty/Audio/Devices/AudioOutputDevice.swift \
                  NotchSixty/Audio/Devices/OutputDeviceCatalog.swift \
                  NotchSixty/Audio/CoreAudio/CoreAudioError.swift \
                  NotchSixty/Audio/Routing/AudioRouteConfiguration.swift \
                  NotchSixty/State/ProductProfiles.swift \
                  NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          git commit -m 'PR41 Slice C1: model persistent multi-output routing'
          git push origin HEAD:pr41-active-crossover-matrix-parity
