name: PR31 Slice 3 Diagnostic

on:
  push:
    branches:
      - feature/noise-hum-suppression
    paths:
      - '.github/workflows/pr31-slice3-debug.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/noise-hum-suppression

      - name: Apply graph integration generators
        run: |
          python3 .github/scripts/pr31_slice3_graph.py
          python3 .github/scripts/pr31_slice3_graph_fix.py

      - name: Capture concise Xcode failure diagnostics
        id: xcode
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee /tmp/pr31-slice3-xcode.log
          status=${PIPESTATUS[0]}
          mkdir -p .github/debug
          {
            echo "xcodebuild_status=$status"
            echo "--- compiler/test errors ---"
            grep -E -n -C 3 '(^|[[:space:]])(error:|fatal error:|XCTAssert|failed:|Test Case .* failed|\*\* TEST FAILED \*\*)' /tmp/pr31-slice3-xcode.log || true
            echo "--- final 160 lines ---"
            tail -n 160 /tmp/pr31-slice3-xcode.log
          } > .github/debug/pr31_slice3_errors.txt
          exit 0

      - name: Commit diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .github/debug/pr31_slice3_errors.txt
          git commit -m 'Capture PR31 Slice 3 integration failure diagnostics'
          git push origin HEAD:feature/noise-hum-suppression
