name: PR41 Same-device Fan-out Primitive

on:
  push:
    branches:
      - pr41-active-crossover-matrix-parity
    paths:
      - .github/scripts/pr41_slice_c2a.py
      - .github/workflows/pr41-slice-c2a.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - name: Check out PR41 branch
        uses: actions/checkout@v7
        with:
          ref: pr41-active-crossover-matrix-parity
          fetch-depth: 0

      - name: Apply PR41 Slice C2a patch
        run: python3 .github/scripts/pr41_slice_c2a.py

      - name: Validate same-device route plan tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project NotchSixty.xcodeproj >/dev/null
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomCorrectionProjectControllerTests \
            test

      - name: Validate realtime fan-out primitive
        shell: bash
        run: |
          set -euo pipefail
          REALTIME_SOURCES=$(find NotchSixty/Audio/Realtime -name '*.c' -print)
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -include stddef.h \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr41_same_device_output_map.c \
            $REALTIME_SOURCES \
            -framework Accelerate \
            -framework CoreAudio \
            -o /tmp/validate-pr41-same-device-output-map
          /tmp/validate-pr41-same-device-output-map

      - name: Validate C2a contract shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'struct SameDeviceOutputRoutePlan' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'makeSameDevicePlan' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'N60SameDeviceOutputMapCompile' NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h
          grep -q 'N60SameDeviceOutputMapWriteFrame' NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c
          grep -q 'Validate PR41 Same-device Output Map' .github/workflows/macos.yml
          grep -q 'testSameDeviceRoutePlanUsesOneClockDomainAndPreservesEnabledRouteOrder' NotchSixtyTests/RoomCorrectionProjectControllerTests.swift

      - name: Commit patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/pr41_slice_c2a.py .github/workflows/pr41-slice-c2a.yml
          git add NotchSixty/Audio/Routing/AudioRouteConfiguration.swift \
                  NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h \
                  NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c \
                  NotchSixtyTests/RoomCorrectionProjectControllerTests.swift \
                  ci/validate_pr41_same_device_output_map.c \
                  .github/workflows/macos.yml
          git commit -m 'PR41 Slice C2a: add same-device fan-out primitive'
          git push origin HEAD:pr41-active-crossover-matrix-parity
