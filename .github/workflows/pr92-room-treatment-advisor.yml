name: PR92 Room Treatment Advisor

on:
  push:
    branches:
      - feature/pr92-room-treatment-advisor
  pull_request:
    branches:
      - feature/pr91-conversation-preservation
  workflow_dispatch:

concurrency:
  group: pr92-room-treatment-advisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR92 Room Treatment Advisor architecture
        run: python3 ci/validate_pr92_room_treatment_advisor.py
      - name: Validate inherited PR91 Conversation Preservation
        run: python3 ci/validate_pr91_conversation_preservation.py
      - name: Validate inherited PR90 Active Quiet Zone
        run: python3 ci/validate_pr90_active_quiet_zone.py
      - name: Validate inherited PR89 Ambient Compensation
        run: python3 ci/validate_pr89_ambient_compensation.py
      - name: Validate inherited PR88 intelligent targets
        run: python3 ci/validate_pr88_intelligent_target.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR92 Room Treatment Advisor architecture
        run: python3 ci/validate_pr92_room_treatment_advisor.py
      - name: Build arm64 app with Room Advisor
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build
      - name: Run Room Advisor and information architecture tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomTreatmentAdvisorTests \
            -only-testing:NotchSixtyTests/ProductionInformationArchitectureTests \
            test
      - name: Run retained PR91/PR90 Active Acoustics tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AmbientCompensationTests \
            -only-testing:NotchSixtyTests/ActiveQuietZoneTests \
            test
      - name: Run retained XCTest suite
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test
