name: PR40 Integrate Room Design Project

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-integrate-design-project.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0
      - name: Apply project design integration
        run: python3 .github/scripts/pr40_integrate_design_project.py
      - name: Commit integration and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/pr40_integrate_design_project.py .github/workflows/pr40-integrate-design-project.yml
          git add NotchSixty/State/RoomCorrectionProjectController.swift NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          git commit -m "PR40 Slice E: persist target and FIR design candidates"
          git push origin HEAD:pr40-room-correction-production-workflow
