name: PR39 Approved Icon Install

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Decode approved icon masters
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('artwork').mkdir(exist_ok=True)
          for appearance in ('light', 'dark'):
              encoded = Path(f'ci/pr39-icon-source-{appearance}.b64').read_text().strip()
              Path(f'artwork/AppIcon-{appearance}-master.png').write_bytes(base64.b64decode(encoded))
          PY

      - name: Generate shipping icon slots from approved artwork
        run: |
          swift ci/generate_app_icons.swift
          python3 ci/validate_pr39_app_identity.py
          git diff --check

      - name: Build and test approved icon integration
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit approved masters and generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/AppIcon-light-master.png artwork/AppIcon-dark-master.png \
                  artwork/AppIcon-light-final.png artwork/AppIcon-dark-final.png \
                  NotchSixty/Assets.xcassets/AppIcon.appiconset
          git diff --cached --check
          git commit -m "PR39: install approved raster app icons"
          git push origin HEAD:feature/pr39-production-meters-analysis
