name: PR45 Final Layout Fixes

on:
  push:
    branches:
      - pr45-v1-release-hardening

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: "${{ github.event.head_commit.message != 'PR45: fix EQ adaptive width and topology label' }}"
    runs-on: xcode-27
    steps:
      - name: Check out PR45
        uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening
          fetch-depth: 0

      - name: Apply final layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root_path = Path('NotchSixty/UI/ProductionRootView.swift')
          root = root_path.read_text()
          old = '''    private var engine: AudioIOEngine { product.audioEngine }\n\n    var body: some View {'''
          new = '''    private var engine: AudioIOEngine { product.audioEngine }\n\n    private var minimumWindowWidth: CGFloat {\n        if selection == .equalizer, engine.stereoEQConfiguration.channelMode != .linked {\n            return 1_320\n        }\n        return 980\n    }\n\n    var body: some View {'''
          assert old in root, 'ProductionRootView engine/body anchor not found'
          root = root.replace(old, new, 1)
          old = '''        .frame(minWidth: 980, minHeight: 680)'''
          new = '''        .frame(minWidth: minimumWindowWidth, minHeight: 680)'''
          assert old in root, 'ProductionRootView fixed minimum frame not found'
          root_path.write_text(root.replace(old, new, 1))

          app_path = Path('NotchSixty/NotchSixtyApp.swift')
          app = app_path.read_text()
          old = '''        .defaultSize(width: 1180, height: 780)\n        .windowToolbarStyle(.unified(showsTitle: false))'''
          new = '''        .defaultSize(width: 1180, height: 780)\n        .windowResizability(.contentMinSize)\n        .windowToolbarStyle(.unified(showsTitle: false))'''
          assert old in app, 'main Window sizing anchor not found'
          app_path.write_text(app.replace(old, new, 1))

          dynamics_path = Path('NotchSixty/UI/ProductionDynamicsView.swift')
          dynamics = dynamics_path.read_text()
          old = '''            Picker("Topology", selection: binding({ $0.compressor.topology }, { $0.compressor.topology = $1 })) {\n                ForEach(CompressorTopology.allCases) { topology in\n                    Text(topology.displayName).tag(topology)\n                }\n            }\n            .productionGlassPickerChrome()\n            .pickerStyle(.segmented)'''
          new = '''            HStack(spacing: 12) {\n                Text("Topology")\n                Picker("Topology", selection: binding({ $0.compressor.topology }, { $0.compressor.topology = $1 })) {\n                    ForEach(CompressorTopology.allCases) { topology in\n                        Text(topology.displayName).tag(topology)\n                    }\n                }\n                .productionGlassPickerChrome()\n                .labelsHidden()\n                .pickerStyle(.segmented)\n                .frame(width: 230)\n            }'''
          assert old in dynamics, 'compressor Topology picker block not found'
          dynamics_path.write_text(dynamics.replace(old, new, 1))

          validator_path = Path('ci/validate_pr45_control_style.py')
          validator = validator_path.read_text()
          old = '''app = Path("NotchSixty/NotchSixtyApp.swift").read_text()\nprofiles = Path("NotchSixty/UI/ProductionProfileToolbar.swift").read_text()'''
          new = '''app = Path("NotchSixty/NotchSixtyApp.swift").read_text()\ndynamics = Path("NotchSixty/UI/ProductionDynamicsView.swift").read_text()\nprofiles = Path("NotchSixty/UI/ProductionProfileToolbar.swift").read_text()'''
          assert old in validator, 'control-style validator imports anchor not found'
          validator = validator.replace(old, new, 1)
          anchor = '''assert ".layoutPriority(1)" in bypass, "EQ Bypass must keep enough layout priority to avoid wrapping"\n\n'''
          addition = '''assert "private var minimumWindowWidth: CGFloat" in root, "production root must expose adaptive EQ window minimum width"\nassert "return 1_320" in root, "Independent/Mid-Side EQ must reserve enough width for the secondary channel selector"\nassert ".windowResizability(.contentMinSize)" in app, "main window must honor dynamic content minimum sizing"\n\ntopology_start = dynamics.index('Text("Topology")')\ntopology_end = dynamics.index('Toggle("Program-Dependent Release"', topology_start)\ntopology = dynamics[topology_start:topology_end]\nassert 'Picker("Topology"' in topology, "Topology segmented picker missing"\nassert ".labelsHidden()" in topology, "Topology label must remain outside the segmented picker chrome"\nassert ".productionGlassPickerChrome()" in topology, "Topology choices must retain Liquid Glass picker chrome"\n\n'''
          assert anchor in validator, 'control-style validator bypass anchor not found'
          validator_path.write_text(validator.replace(anchor, anchor + addition, 1))
          PY

      - name: Validate retained UI and release contracts
        run: |
          python3 ci/validate_pr37_equalizer_ui.py
          python3 ci/validate_pr38_dynamics_ui.py
          python3 ci/validate_pr39_app_identity.py
          python3 ci/validate_pr42_dynamics_ui_style.py
          python3 ci/validate_pr43_current_macos_ui.py
          python3 ci/validate_pr45_release_hardening.py
          python3 ci/validate_pr45_control_style.py

      - name: Build Debug
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Run full XCTest
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test

      - name: Commit accepted layout fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/UI/ProductionRootView.swift NotchSixty/UI/ProductionDynamicsView.swift NotchSixty/NotchSixtyApp.swift ci/validate_pr45_control_style.py
          if git diff --cached --quiet; then
            echo 'No final layout changes to commit.'
            exit 0
          fi
          git commit -m 'PR45: fix EQ adaptive width and topology label'
          git push origin HEAD:pr45-v1-release-hardening
