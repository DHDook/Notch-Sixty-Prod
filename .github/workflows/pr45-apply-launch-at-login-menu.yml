name: PR45 Apply Launch at Login Menu

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-apply-launch-at-login-menu.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening

      - name: Apply menu control
        run: python3 ci/pr45_add_launch_at_login_menu.py

      - name: Commit updated app shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/NotchSixtyApp.swift
          git diff --cached --check
          git commit -m "PR45: expose Launch at Login in app menu"
          git push origin HEAD:pr45-v1-release-hardening
