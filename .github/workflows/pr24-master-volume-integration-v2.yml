name: PR24 Master Volume Integration V2

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-master-volume-integration-v2.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrate structural master volume control
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f"pattern not found enough times in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, count))

          playback = "NotchSixty/Audio/StereoPlaybackControl.swift"
          replace(playback,
              "    var controlMode: MasterVolumeControlMode {\n        volumeWritable ? .device : .softwareDSP\n    }",
              "    var controlMode: MasterVolumeControlMode {\n        volumeReadable && volumeWritable ? .device : .softwareDSP\n    }\n\n    var usesDeviceMute: Bool {\n        muteReadable && muteWritable\n    }")
          replace(playback,
              "        let volumeGain = capabilities.volumeWritable ? 1.0 : level\n        let muteGain = muted && !capabilities.muteWritable ? 0.0 : 1.0",
              "        let volumeGain = capabilities.controlMode == .device ? 1.0 : level\n        let muteGain = muted && !capabilities.usesDeviceMute ? 0.0 : 1.0")

          kernel = "NotchSixty/Audio/Realtime/N60RenderKernel.c"
          replace(kernel,
              "        float outputGain = next_gain_value(&kernel->outputGain);\n        float masterGain = next_gain_value(&kernel->masterGain);\n        left *= outputGain * masterGain;\n        right *= outputGain * masterGain;\n    } else {\n        meter_sample(left, right, &context->postEQPeakLeft, &context->postEQPeakRight, &context->postEQSquareSumLeft, &context->postEQSquareSumRight, &context->postEQOverRangeSamples);\n    }\n\n    left = sanitize_sample(kernel, left);",
              "        float outputGain = next_gain_value(&kernel->outputGain);\n        left *= outputGain;\n        right *= outputGain;\n    } else {\n        meter_sample(left, right, &context->postEQPeakLeft, &context->postEQPeakRight, &context->postEQSquareSumLeft, &context->postEQSquareSumRight, &context->postEQOverRangeSamples);\n    }\n\n    float masterGain = next_gain_value(&kernel->masterGain);\n    left *= masterGain;\n    right *= masterGain;\n    left = sanitize_sample(kernel, left);")

          proj = "NotchSixty.xcodeproj/project.pbxproj"
          replace(proj,
              "\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */ = {isa = PBXBuildFile; fileRef = A20000000000000000000027 /* StereoPlaybackControl.swift */; };",
              "\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */ = {isa = PBXBuildFile; fileRef = A20000000000000000000027 /* StereoPlaybackControl.swift */; };\n\t\tA20000000000000000000018 /* MasterVolumeDeviceController.swift in Sources */ = {isa = PBXBuildFile; fileRef = A20000000000000000000028 /* MasterVolumeDeviceController.swift */; };")
          replace(proj,
              "\t\tA20000000000000000000027 /* StereoPlaybackControl.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = StereoPlaybackControl.swift; sourceTree = \"<group>\"; };",
              "\t\tA20000000000000000000027 /* StereoPlaybackControl.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = StereoPlaybackControl.swift; sourceTree = \"<group>\"; };\n\t\tA20000000000000000000028 /* MasterVolumeDeviceController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = MasterVolumeDeviceController.swift; sourceTree = \"<group>\"; };")
          replace(proj,
              "\t\tA20000000000000000000051 /* CoreAudio */ = {isa = PBXGroup; children = (A20000000000000000000021 /* CoreAudioError.swift */,); path = CoreAudio; sourceTree = \"<group>\"; };",
              "\t\tA20000000000000000000051 /* CoreAudio */ = {isa = PBXGroup; children = (A20000000000000000000021 /* CoreAudioError.swift */, A20000000000000000000028 /* MasterVolumeDeviceController.swift */,); path = CoreAudio; sourceTree = \"<group>\"; };")
          text = Path(proj).read_text()
          source_marker = "\t\t\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */,"
          if source_marker not in text:
              raise SystemExit("Sources phase marker not found")
          Path(proj).write_text(text.replace(source_marker, source_marker + "\n\t\t\t\tA20000000000000000000018 /* MasterVolumeDeviceController.swift in Sources */,", 1))

          engine = "NotchSixty/Audio/AudioIOEngine.swift"
          replace(engine,
              "    private let eventMonitor: AudioHardwareEventMonitor\n    private var lifecycle: AudioLifecycleStateMachine",
              "    private let eventMonitor: AudioHardwareEventMonitor\n    private let masterVolumeController: any MasterVolumeDeviceControlling\n    private var lifecycle: AudioLifecycleStateMachine")
          replace(engine,
              "    @Published private(set) var playbackControlConfiguration = PlaybackControlConfiguration()\n    @Published private(set) var gainConfiguration = DSPGainConfiguration()",
              "    @Published private(set) var playbackControlConfiguration = PlaybackControlConfiguration()\n    @Published private(set) var masterVolumeConfiguration = MasterVolumeConfiguration()\n    @Published private(set) var masterVolumeCapabilities = MasterVolumeDeviceCapabilities.softwareOnly\n    @Published private(set) var gainConfiguration = DSPGainConfiguration()")
          replace(engine,
              "        initialRouteConfiguration: AudioRouteConfiguration = AudioRouteConfiguration(),\n        eventMonitor: AudioHardwareEventMonitor = AudioHardwareEventMonitor()\n    ) {\n        self.deviceCatalog = deviceCatalog\n        self.routeConfiguration = initialRouteConfiguration\n        self.eventMonitor = eventMonitor",
              "        initialRouteConfiguration: AudioRouteConfiguration = AudioRouteConfiguration(),\n        eventMonitor: AudioHardwareEventMonitor = AudioHardwareEventMonitor(),\n        masterVolumeController: any MasterVolumeDeviceControlling = CoreAudioMasterVolumeController()\n    ) {\n        self.deviceCatalog = deviceCatalog\n        self.routeConfiguration = initialRouteConfiguration\n        self.eventMonitor = eventMonitor\n        self.masterVolumeController = masterVolumeController")
          replace(engine,
              "        eventMonitor.onDidWake = { [weak self] in self?.handleDidWake() }\n    }",
              "        eventMonitor.onDidWake = { [weak self] in self?.handleDidWake() }\n        masterVolumeController.onExternalChange = { [weak self] in self?.handleMasterVolumeDeviceChange() }\n    }")
          replace(engine,
              "            try refreshOutputDevices()\n            try eventMonitor.start()",
              "            try refreshOutputDevices()\n            try eventMonitor.start()\n            try syncMasterVolumeMonitorToSelectedOutput()")
          replace(engine,
              "            routeConfiguration.selectedOutputUID = nil\n            return",
              "            routeConfiguration.selectedOutputUID = nil\n            masterVolumeController.stopMonitoring()\n            masterVolumeCapabilities = .softwareOnly\n            return")
          replace(engine,
              "        routeConfiguration.selectedOutputUID = uid\n        lastErrorDescription = nil",
              "        routeConfiguration.selectedOutputUID = uid\n        try syncMasterVolumeMonitorToSelectedOutput()\n        lastErrorDescription = nil")

          flat_block = '''    func setFlatAuditionEnabled(_ enabled: Bool) throws {
                  var updated = playbackControlConfiguration
                  updated.flatAuditionEnabled = enabled
                  try applyPlaybackControlConfiguration(updated)
              }
          '''
          methods = flat_block + '''
              func setMasterVolumeLevel(_ level: Double) throws {
                  guard level.isFinite, MasterVolumeConfiguration.levelRange.contains(level) else {
                      throw MasterVolumeConfigurationError.invalidLevel(level)
                  }
                  var updated = masterVolumeConfiguration
                  updated.level = level
                  try applyMasterVolumeConfiguration(updated, writeDevice: true)
              }

              func setMasterMuted(_ muted: Bool) throws {
                  var updated = masterVolumeConfiguration
                  updated.muted = muted
                  try applyMasterVolumeConfiguration(updated, writeDevice: true)
              }
          '''
          replace(engine, flat_block, methods)

          e = Path(engine).read_text()
          e = e.replace(
              "playbackConfiguration: playbackControlConfiguration\n            )",
              "playbackConfiguration: playbackControlConfiguration,\n                masterGainLinear: currentMasterSoftwareGain\n            )"
          )
          e = e.replace(
              "playbackConfiguration: configuration\n            )",
              "playbackConfiguration: configuration,\n                masterGainLinear: currentMasterSoftwareGain\n            )"
          )
          Path(engine).write_text(e)

          marker = "    private func applyGainConfiguration(_ configuration: DSPGainConfiguration) throws {"
          helper = '''    private var currentMasterSoftwareGain: Float {
                  masterVolumeConfiguration.softwareGain(for: masterVolumeCapabilities)
              }

              private func applyMasterVolumeConfiguration(
                  _ configuration: MasterVolumeConfiguration,
                  writeDevice: Bool
              ) throws {
                  guard configuration.level.isFinite,
                        MasterVolumeConfiguration.levelRange.contains(configuration.level) else {
                      throw MasterVolumeConfigurationError.invalidLevel(configuration.level)
                  }

                  if writeDevice, let output = selectedOutputDevice {
                      if masterVolumeCapabilities.controlMode == .device {
                          try masterVolumeController.setVolume(configuration.level, deviceID: output.deviceID)
                      }
                      if masterVolumeCapabilities.usesDeviceMute {
                          try masterVolumeController.setMuted(configuration.muted, deviceID: output.deviceID)
                      }
                  }

                  let oldSoftwareGain = currentMasterSoftwareGain
                  let newSoftwareGain = configuration.softwareGain(for: masterVolumeCapabilities)
                  if let session = transportSession, abs(oldSoftwareGain - newSoftwareGain) > 0.000_001 {
                      var graph = try stereoEQConfiguration.makeGraphSnapshot(
                          sampleRate: session.outputFormat.sampleRate,
                          gainConfiguration: gainConfiguration,
                          bassManagementConfiguration: bassManagementConfiguration,
                          playbackConfiguration: playbackControlConfiguration,
                          masterGainLinear: newSoftwareGain
                      )
                      try attachActiveLinearPhaseProgramIfNeeded(to: &graph, stereoConfiguration: stereoEQConfiguration, playbackConfiguration: playbackControlConfiguration)
                      try attachActiveRoomCorrectionProgramIfNeeded(to: &graph, playbackConfiguration: playbackControlConfiguration)
                      try session.publishDSPGraph(graph)
                  }

                  masterVolumeConfiguration = configuration
                  lastErrorDescription = nil
              }

              private func syncMasterVolumeMonitorToSelectedOutput() throws {
                  guard let output = selectedOutputDevice else {
                      masterVolumeController.stopMonitoring()
                      masterVolumeCapabilities = .softwareOnly
                      return
                  }
                  try masterVolumeController.monitor(deviceID: output.deviceID)
                  try synchronizeMasterVolumeFromSelectedDevice()
              }

              private func synchronizeMasterVolumeFromSelectedDevice() throws {
                  guard let output = selectedOutputDevice else { return }
                  let previousCapabilities = masterVolumeCapabilities
                  let snapshot = try masterVolumeController.inspect(deviceID: output.deviceID)
                  masterVolumeCapabilities = snapshot.capabilities

                  var updated = masterVolumeConfiguration
                  if snapshot.capabilities.controlMode == .device, let level = snapshot.level {
                      updated.level = min(max(level, 0), 1)
                  }
                  if snapshot.capabilities.usesDeviceMute, let muted = snapshot.muted {
                      updated.muted = muted
                  }

                  let oldGain = masterVolumeConfiguration.softwareGain(for: previousCapabilities)
                  let newGain = updated.softwareGain(for: snapshot.capabilities)
                  if let session = transportSession, abs(oldGain - newGain) > 0.000_001 {
                      var graph = try stereoEQConfiguration.makeGraphSnapshot(
                          sampleRate: session.outputFormat.sampleRate,
                          gainConfiguration: gainConfiguration,
                          bassManagementConfiguration: bassManagementConfiguration,
                          playbackConfiguration: playbackControlConfiguration,
                          masterGainLinear: newGain
                      )
                      try attachActiveLinearPhaseProgramIfNeeded(to: &graph, stereoConfiguration: stereoEQConfiguration, playbackConfiguration: playbackControlConfiguration)
                      try attachActiveRoomCorrectionProgramIfNeeded(to: &graph, playbackConfiguration: playbackControlConfiguration)
                      try session.publishDSPGraph(graph)
                  }
                  masterVolumeConfiguration = updated
              }

              private func handleMasterVolumeDeviceChange() {
                  do {
                      try synchronizeMasterVolumeFromSelectedDevice()
                      lastErrorDescription = nil
                  } catch {
                      lastErrorDescription = error.localizedDescription
                  }
              }

          '''
          replace(engine, marker, helper + marker)
          replace(engine,
              "        eventMonitor.stop()\n    }",
              "        masterVolumeController.stopMonitoring()\n        eventMonitor.stop()\n    }")
          replace(engine,
              "        if !selectedIsPresent && (lifecycle.state == .running || lifecycle.state == .reconfiguring) {",
              "        if !selectedIsPresent {\n            masterVolumeController.stopMonitoring()\n            masterVolumeCapabilities = .softwareOnly\n        } else {\n            try? syncMasterVolumeMonitorToSelectedOutput()\n        }\n\n        if !selectedIsPresent && (lifecycle.state == .running || lifecycle.state == .reconfiguring) {")
          replace(engine,
              "        resumeAfterWake = true\n        eventMonitor.removeSelectedOutputSampleRateMonitor()",
              "        resumeAfterWake = true\n        eventMonitor.removeSelectedOutputSampleRateMonitor()\n        masterVolumeController.stopMonitoring()")
          replace(engine,
              "            try eventMonitor.monitorSampleRate(of: output.deviceID)\n            lastErrorDescription = nil",
              "            try eventMonitor.monitorSampleRate(of: output.deviceID)\n            try syncMasterVolumeMonitorToSelectedOutput()\n            lastErrorDescription = nil")
          replace(engine,
              "            try eventMonitor.monitorSampleRate(of: output.deviceID)\n            sampleRateChangesHandled &+= 1",
              "            try eventMonitor.monitorSampleRate(of: output.deviceID)\n            try syncMasterVolumeMonitorToSelectedOutput()\n            sampleRateChangesHandled &+= 1")
          replace(engine,
              "                try eventMonitor.monitorSampleRate(of: output.deviceID)\n                recoverySuccesses &+= 1",
              "                try eventMonitor.monitorSampleRate(of: output.deviceID)\n                try syncMasterVolumeMonitorToSelectedOutput()\n                recoverySuccesses &+= 1")

          app = "NotchSixty/NotchSixtyApp.swift"
          replace(app,
              "struct ProductConfiguration: Equatable, Sendable {\n    static let currentSchemaVersion = 2\n\n    var schemaVersion: Int\n    var selectedOutputUID: String?\n    var dsp: ProductDSPConfiguration",
              "struct ProductConfiguration: Equatable, Sendable {\n    static let currentSchemaVersion = 3\n\n    var schemaVersion: Int\n    var selectedOutputUID: String?\n    var masterVolume: MasterVolumeConfiguration\n    var dsp: ProductDSPConfiguration")
          replace(app,
              "        selectedOutputUID: String? = nil,\n        dsp: ProductDSPConfiguration = ProductDSPConfiguration()\n    ) {\n        self.schemaVersion = schemaVersion\n        self.selectedOutputUID = selectedOutputUID\n        self.dsp = dsp",
              "        selectedOutputUID: String? = nil,\n        masterVolume: MasterVolumeConfiguration = MasterVolumeConfiguration(),\n        dsp: ProductDSPConfiguration = ProductDSPConfiguration()\n    ) {\n        self.schemaVersion = schemaVersion\n        self.selectedOutputUID = selectedOutputUID\n        self.masterVolume = masterVolume\n        self.dsp = dsp")
          replace(app,
              "            selectedOutputUID: audioEngine.routeConfiguration.selectedOutputUID,\n            dsp: ProductDSPConfiguration(",
              "            selectedOutputUID: audioEngine.routeConfiguration.selectedOutputUID,\n            masterVolume: audioEngine.masterVolumeConfiguration,\n            dsp: ProductDSPConfiguration(")

          tests = "NotchSixtyTests/StereoPlaybackControlTests.swift"
          t = Path(tests).read_text()
          test_marker = "\n    func testGraphBypassReturnsUntreatedStereoSamples() {"
          extra = '''

              func testMasterGainStillAppliesDuringGlobalGraphBypass() {
                  guard let kernel = N60RenderKernelCreate() else {
                      return XCTFail("Unable to create render kernel")
                  }
                  defer { N60RenderKernelDestroy(kernel) }
                  var graph = N60DSPGraphSnapshotMakeUnity(96_000)
                  graph.bypassed = true
                  graph.masterGainLinear = 0.25
                  XCTAssertTrue(N60RenderKernelPublishSnapshot(kernel, graph))
                  var left: Float = 0
                  var right: Float = 0
                  for _ in 0..<2_000 {
                      N60RenderKernelProcessStereoFrame(kernel, 0.8, -0.4, &left, &right)
                  }
                  XCTAssertEqual(left, 0.2, accuracy: 0.000_01)
                  XCTAssertEqual(right, -0.1, accuracy: 0.000_01)
              }
          '''
          if test_marker not in t:
              raise SystemExit("test marker not found")
          Path(tests).write_text(t.replace(test_marker, extra + test_marker, 1))

          Path("docs/MASTER_VOLUME_CONTROL.md").write_text('''# Master Volume and Mute Control\n\nPR #24 independently implements playback master volume from public Core Audio HAL properties and the proprietary realtime graph. Historical GPL volume-management code is not used as an implementation reference.\n\nThe user-selected physical output remains authoritative; Notch Sixty never silently follows the default output device. A readable+writable main-output scalar volume uses device authority and HAL change listeners. Otherwise volume falls back to a separate smoothed software master-gain stage. Mute uses the device property only when readable+writable; otherwise it uses software master gain.\n\nMaster volume remains separate from input preamp, automatic headroom, DSP output gain, and transport transition gain. Global DSP Bypass and Flat bypass processing but not playback volume or software mute. External listener callbacks read state only, preventing notification feedback loops. Reconnect, sample-rate rebuild, and wake rebind to the same selected-output UID.\n''')
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit integration and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr24-master-volume-integration.yml .github/workflows/pr24-master-volume-integration-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate master volume mute and device synchronization'
          git push origin HEAD:feature/master-volume-mute-sync
