name: PR24 Integration Runner V3

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-integration-runner-v3.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply structural integration and repair scoped calls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr24-master-volume-integration-v2.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run test suite"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('embedded patch start not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('embedded patch end not found')
          lines = source[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/pr24_patch.py').write_text(patch)
          PY
          python3 /tmp/pr24_patch.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('NotchSixty/Audio/AudioIOEngine.swift')
          text = p.read_text()
          bad_calls = [
              '''                stereoConfiguration: stereoEQConfiguration,
                  playbackConfiguration: playbackControlConfiguration,
                  masterGainLinear: currentMasterSoftwareGain
              )''',
              '''                to: &graph,
                  playbackConfiguration: playbackControlConfiguration,
                  masterGainLinear: currentMasterSoftwareGain
              )''',
              '''                stereoConfiguration: stereoEQConfiguration,
                  playbackConfiguration: configuration,
                  masterGainLinear: currentMasterSoftwareGain
              )''',
              '''                to: &graph,
                  playbackConfiguration: configuration,
                  masterGainLinear: currentMasterSoftwareGain
              )''',
          ]
          good_calls = [
              '''                stereoConfiguration: stereoEQConfiguration,
                  playbackConfiguration: playbackControlConfiguration
              )''',
              '''                to: &graph,
                  playbackConfiguration: playbackControlConfiguration
              )''',
              '''                stereoConfiguration: stereoEQConfiguration,
                  playbackConfiguration: configuration
              )''',
              '''                to: &graph,
                  playbackConfiguration: configuration
              )''',
          ]
          for bad, good in zip(bad_calls, good_calls):
              text = text.replace(bad, good)
          # Protect the intended graph-builder calls: at least one must still carry master gain.
          if 'masterGainLinear: currentMasterSoftwareGain' not in text:
              raise SystemExit('all master gain graph arguments were removed unexpectedly')
          p.write_text(text)
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit integration and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr24-master-volume-integration.yml \
            .github/workflows/pr24-master-volume-integration-v2.yml \
            .github/workflows/pr24-retrigger-integration.yml \
            .github/workflows/pr24-integration-runner.yml \
            .github/workflows/pr24-integration-runner-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate master volume mute and device synchronization'
          git push origin HEAD:feature/master-volume-mute-sync
