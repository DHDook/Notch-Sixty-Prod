name: PR31 Slice 2 Integration

on:
  push:
    branches:
      - feature/noise-hum-suppression
    paths:
      - '.github/scripts/pr31_slice2.py'
      - '.github/scripts/pr31_slice2_fix.py'
      - '.github/scripts/pr31_slice2_detector_fix.py'
      - '.github/workflows/pr31-slice2-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/noise-hum-suppression

      - name: Apply PR31 Slice 2
        run: python3 .github/scripts/pr31_slice2.py

      - name: Apply diagnostics bridge fix
        run: python3 .github/scripts/pr31_slice2_fix.py

      - name: Apply detector confidence rejection fix
        run: python3 .github/scripts/pr31_slice2_detector_fix.py

      - name: Run full test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit PR31 Slice 2 and clean helpers
        run: |
          rm -f .github/scripts/pr31_slice2.py .github/scripts/pr31_slice2_fix.py .github/scripts/pr31_slice2_detector_fix.py .github/workflows/pr31-slice2-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add mains hum detection and tracking'
          git push origin HEAD:feature/noise-hum-suppression
