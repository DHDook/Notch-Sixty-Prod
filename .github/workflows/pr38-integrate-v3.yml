name: PR38 Integration Helper v3

on:
  push:
    branches:
      - feature/pr38-production-dynamics
    paths:
      - .github/workflows/pr38-integrate-v3.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr38-production-dynamics
          fetch-depth: 0
      - name: Apply PR38 production Dynamics integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          # Reuse the already-reviewed v2 integration script, replacing only its
          # brittle exact-match denoiser-call edit with a start/end-marker splice.
          workflow = Path('.github/workflows/pr38-integrate-v2.yml').read_text()
          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          script = dedent(workflow[start:end])

          block_start = script.index("rep(\n'''        guard N60DynamicsSnapshotSetSpectralDenoiser(")
          block_end_marker = "''', \"denoiser advanced snapshot\")"
          block_end = script.index(block_end_marker, block_start) + len(block_end_marker)

          resilient = r'''start_marker = "        guard N60DynamicsSnapshotSetSpectralDenoiser("
          end_marker = "        ) else { throw DynamicsConfigurationError.invalidSpectralDenoiser }\n"
          setter_start = text.index(start_marker)
          setter_end = text.index(end_marker, setter_start) + len(end_marker)
          replacement = ''' + "'''" + '''        guard N60DynamicsSnapshotSetSpectralDenoiserLegacyAdvanced(
              &snapshot,
              sampleRate,
              spectralDenoiser.enabled,
              spectralDenoiser.algorithmPreset.cType,
              spectralDenoiser.quality.cType,
              Float(spectralDenoiser.reductionAmount),
              Float(spectralDenoiser.thresholdDBFS),
              spectralDenoiser.protectedRangeEnabled,
              Float(spectralDenoiser.protectedLowHz),
              Float(spectralDenoiser.protectedHighHz),
              spectralDenoiser.profileRevision,
              spectralDenoiser.profileCommand.cType,
              spectralDenoiser.advancedTuningEnabled,
              Float(spectralDenoiser.minimumGain),
              Float(spectralDenoiser.attackMs),
              Float(spectralDenoiser.releaseMs)
          ) else { throw DynamicsConfigurationError.invalidSpectralDenoiser }
          ''' + "'''" + r'''
          text = text[:setter_start] + replacement + text[setter_end:]'''

          script = script[:block_start] + resilient + script[block_end:]
          exec(compile(script, 'pr38-integrate-v3-generated.py', 'exec'))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty NotchSixty.xcodeproj ci/validate_pr38_denoiser_advanced.c
          git commit -m "PR38: integrate production dynamics workspace and parity controls"
          git push origin HEAD:feature/pr38-production-dynamics
