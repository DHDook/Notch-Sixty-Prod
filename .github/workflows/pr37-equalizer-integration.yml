name: PR37 Equalizer Integration

on:
  push:
    branches:
      - feature/pr37-production-equalizer

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR37 branch
        uses: actions/checkout@v7
        with:
          ref: feature/pr37-production-equalizer
          fetch-depth: 0

      - name: Apply production Equalizer workspace
        run: python3 ci/pr37_apply_equalizer_workspace.py

      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "PR37: add production equalizer workspace"
          git push origin HEAD:feature/pr37-production-equalizer
