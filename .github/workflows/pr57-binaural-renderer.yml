name: PR57 Binaural Renderer

on:
  pull_request:
    branches:
      - feature/pr56-headphone-correction-crossfeed
      - main

permissions:
  contents: read

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate binaural renderer and SOFA boundary
        run: python3 ci/validate_pr57_binaural_renderer.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate binaural renderer with Apple Clang
        run: python3 ci/validate_pr57_binaural_renderer.py
      - name: Build app with binaural ABI exposed to Swift
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build
