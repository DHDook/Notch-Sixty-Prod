name: PR39 Analyzer Path Fix

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Align analyzer source with Xcode Diagnostics group
        run: |
          mkdir -p NotchSixty/Diagnostics
          git mv NotchSixty/Audio/Diagnostics/ProductionAnalysisWorker.swift NotchSixty/Diagnostics/ProductionAnalysisWorker.swift
          rm .github/workflows/pr39-analyzer-path-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR39: align analyzer source with Diagnostics group"
          git push origin HEAD:feature/pr39-production-meters-analysis
