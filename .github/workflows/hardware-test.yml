name: Hardware Test DMG

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/hardware-test.yml
      - NotchSixty/Info.plist

permissions:
  contents: write

jobs:
  package:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply PR23 safety UI patch and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "NotchSixty/Audio/AudioIOEngine.swift",
              "              band.gainDB.isFinite,\n              band.q.isFinite,",
              "              band.gainDB.isFinite,\n              StereoEQConfiguration.bandGainRange.contains(band.gainDB),\n              band.q.isFinite,"
          )

          replace(
              "NotchSixty/ContentView.swift",
              "    var body: some View {\n        VStack(alignment: .leading, spacing: 14) {",
              "    var body: some View {\n        ScrollView {\n            VStack(alignment: .leading, spacing: 14) {"
          )
          replace(
              "NotchSixty/ContentView.swift",
              "            ScrollView {\n                TimelineView(.periodic(from: .now, by: 0.25)) { _ in\n                    diagnosticsView(engine.diagnosticsSnapshot())\n                }\n            }",
              "            TimelineView(.periodic(from: .now, by: 0.25)) { _ in\n                diagnosticsView(engine.diagnosticsSnapshot())\n            }"
          )
          replace(
              "NotchSixty/ContentView.swift",
              "        }\n        .padding(20)\n        .frame(minWidth: 880, minHeight: 1_040)\n        .onAppear",
              "            }\n            .padding(20)\n        }\n        .frame(minWidth: 880, minHeight: 700)\n        .onAppear"
          )
          replace(
              "NotchSixty/ContentView.swift",
              "            TextField(\"dB\", value: binding.gainDB, format: .number.precision(.fractionLength(1))).frame(width: 65)\n            Text(\"dB\").foregroundStyle(.secondary)",
              "            TextField(\"dB\", value: binding.gainDB, format: .number.precision(.fractionLength(1))).frame(width: 65)\n            Text(\"dB (±24 max)\").font(.caption).foregroundStyle(.secondary)"
          )
          replace(
              "NotchSixty/ContentView.swift",
              "            set: { updated in try? engine.updateEQBand(updated) }",
              "            set: { updated in\n                guard updated.gainDB.isFinite else { return }\n                var sanitized = updated\n                sanitized.gainDB = min(\n                    max(updated.gainDB, StereoEQConfiguration.bandGainRange.lowerBound),\n                    StereoEQConfiguration.bandGainRange.upperBound\n                )\n                try? engine.updateEQBand(sanitized)\n            }"
          )
          PY

          git show HEAD^:.github/workflows/hardware-test.yml > .github/workflows/hardware-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/Audio/AudioIOEngine.swift NotchSixty/ContentView.swift .github/workflows/hardware-test.yml
          git commit -m 'Clamp EQ gain UI and make diagnostics reachable'
          git push origin HEAD:feature/stereo-playback-control-parity

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Build Release app
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/NotchSixtyDerivedData"
          CODE_SIGNING_ALLOWED=NO
          GENERATE_INFOPLIST_FILE=NO
          INFOPLIST_FILE=NotchSixty/Info.plist
          build

      - name: Ad-hoc sign sandboxed test app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          test -d "$APP"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements NotchSixty/NotchSixty.entitlements \
            "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Validate test app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          EXECUTABLE="$APP/Contents/MacOS/Notch Sixty"

          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Architectures: $ARCHS"
          test "$ARCHS" = "arm64"

          CAPTURE_USAGE="$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$APP/Contents/Info.plist")"
          test -n "$CAPTURE_USAGE"
          echo "Audio capture usage description: $CAPTURE_USAGE"

          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>&1)"
          echo "$ENTITLEMENTS"
          echo "$ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          echo "$ENTITLEMENTS" | grep -q '<true/>'

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          STAGE="$RUNNER_TEMP/NotchSixtyHardwareTest"
          DMG="$RUNNER_TEMP/NotchSixty-hardware-test.dmg"

          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname 'Notch Sixty Hardware Test' \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"

          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          {
            echo '### Notch Sixty hardware-test DMG'
            echo
            echo "SHA-256: \`$SHA256\`"
            echo
            echo 'This artifact is ad-hoc signed for hardware validation only. It is not notarized and is not an App Store release.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NotchSixty-hardware-test
          path: ${{ runner.temp }}/NotchSixty-hardware-test.dmg
          if-no-files-found: error
          retention-days: 14
