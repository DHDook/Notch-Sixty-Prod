name: PR45 Export Current Icons

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-export-current-icons.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening
      - name: Collect current app icon sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/icons
          cp artwork/AppIcon-light-final.png /tmp/icons/current-light-final.png
          cp artwork/AppIcon-dark-final.png /tmp/icons/current-dark-final.png
          cp NotchSixty/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png /tmp/icons/current-light-1024.png
          cp NotchSixty/Assets.xcassets/AppIcon.appiconset/icon_dark_512x512@2x.png /tmp/icons/current-dark-1024.png
      - uses: actions/upload-artifact@v6
        with:
          name: pr45-current-icons
          path: /tmp/icons
          retention-days: 1
