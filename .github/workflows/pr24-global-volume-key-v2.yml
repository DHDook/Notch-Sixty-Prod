name: PR24 Global Volume Key V2

on:
  push:
    branches: [feature/master-volume-mute-sync]
    paths: [.github/workflows/pr24-global-volume-key-v2.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 .github/scripts/pr24_global_volume_patch.py
      - run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr24-global-volume-key-v2.yml .github/scripts/pr24_global_volume_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/Audio/AudioIOEngine.swift NotchSixtyTests/StereoPlaybackControlTests.swift docs/MASTER_VOLUME_CONTROL.md .github/workflows/pr24-global-volume-key-v2.yml .github/scripts/pr24_global_volume_patch.py
          git commit -m 'Route global volume keys to software master fallback'
          git push origin HEAD:feature/master-volume-mute-sync
# retry with Input Monitoring permission decoupled from route validity
