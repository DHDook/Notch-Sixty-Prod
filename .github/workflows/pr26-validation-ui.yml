name: PR26 Dynamics Validation UI

on:
  push:
    branches: [feature/dynamics-parity-foundation]
    paths:
      - .github/workflows/pr26-validation-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply validation UI
        run: python3 .github/scripts/pr26_validation_ui.py
      - name: Run full test suite
        run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - name: Commit and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr26-validation-ui.yml .github/scripts/pr26_validation_ui.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expose dynamics validation controls and telemetry'
          git push origin HEAD:feature/dynamics-parity-foundation
