name: PR43 Finish Surface Staging

on:
  push:
    branches:
      - pr43-advanced-acoustic-speaker-optimization

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr43-advanced-acoustic-speaker-optimization
          fetch-depth: 0

      - name: Correct staged patch against current speaker-bus model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ci/pr43_finish_surface_patch.py')
          text = path.read_text()
          old = '''            switch bus {
            case .subLeft, .subRight: initialFrequency = 60
            case .lowLeft, .lowRight: initialFrequency = 120
            case .midLeft, .midRight: initialFrequency = 1_000
            case .highLeft, .highRight: initialFrequency = 5_000
            case .fullRangeLeft, .fullRangeRight: initialFrequency = 1_000
            }'''
          new = '''            switch bus {
            case .subMono: initialFrequency = 60
            case .leftLow, .rightLow: initialFrequency = 120
            case .leftMid, .rightMid: initialFrequency = 1_000
            case .leftHigh, .rightHigh: initialFrequency = 5_000
            case .leftFullRange, .rightFullRange: initialFrequency = 1_000
            }'''
          if old not in text:
              raise SystemExit('speaker-bus patch anchor missing')
          text = text.replace(old, new, 1)
          marker = '''## Also deferred

- per-driver realtime meter UI:'''
          replacement = '''## Also deferred

- automatic low-latency IIR Room Correction fitting: the commercial graph intentionally keeps Content-Preset EQ separate from the dedicated Playback-System Room Correction lane. Shipping an automatic IIR fitter now would either hide system filters inside the content EQ bank or require a new system-IIR render lane immediately before 1.0. PR43 preserves the bounded minimum-phase FIR correction path and defers system-owned automatic IIR until that lane can be designed, persisted, bypassed, and verified explicitly;
- per-driver realtime meter UI:'''
          if marker not in text:
              raise SystemExit('closure deferral anchor missing')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY

      - name: Apply production surface and closure patch
        run: python3 ci/pr43_finish_surface_patch.py

      - name: Mark kickoff scope closed by final ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/PR43_ADVANCED_ACOUSTIC_SPEAKER_OPTIMIZATION.md')
          text = path.read_text()
          text = text.replace(
              'Status: **KICKOFF / IMPLEMENTATION IN PROGRESS**',
              'Status: **CLOSED BY `docs/PR43_CLOSURE.md` — REAL-MAC ACCEPTANCE PENDING**',
              1,
          )
          path.write_text(text)
          PY

      - name: Validate PR43 closure surface
        run: python3 ci/validate_pr43_closure.py

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build Debug app
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build

      - name: Run XCTest
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test

      - name: Commit validated surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm ci/pr43_finish_surface_patch.py
          git add NotchSixty/UI/ProductionRootView.swift docs/PR43_CLOSURE.md docs/PR43_ADVANCED_ACOUSTIC_SPEAKER_OPTIMIZATION.md ci/validate_pr43_closure.py
          git commit -m 'PR43: expose per-driver controls and close measurement scope'
          git push origin HEAD:pr43-advanced-acoustic-speaker-optimization
