name: PR43 Finish Surface Staging

on:
  push:
    branches:
      - pr43-advanced-acoustic-speaker-optimization

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr43-advanced-acoustic-speaker-optimization
          fetch-depth: 0

      - name: Apply validated PR43 production surface
        run: |
          python3 ci/pr43_finish_surface_fixup.py
          python3 ci/pr43_finish_surface_patch.py
          python3 ci/validate_pr43_closure.py

      - name: Commit validated production surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm ci/pr43_finish_surface_patch.py ci/pr43_finish_surface_fixup.py
          git add NotchSixty/UI/ProductionRootView.swift docs/PR43_CLOSURE.md docs/PR43_ADVANCED_ACOUSTIC_SPEAKER_OPTIMIZATION.md ci/validate_pr43_closure.py
          git commit -m 'PR43: expose per-driver controls and close measurement scope'
          git push origin HEAD:pr43-advanced-acoustic-speaker-optimization
