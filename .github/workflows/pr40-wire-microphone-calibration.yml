name: PR40 Wire Microphone Calibration

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-microphone-calibration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply microphone calibration production wiring
        run: python3 .github/scripts/pr40_wire_microphone_calibration.py

      - name: Commit integration and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/State/RoomCorrectionCalibrationController.swift \
                  NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift \
                  NotchSixty/NotchSixty.entitlements \
                  NotchSixtyTests/RoomCorrectionCalibrationControllerTests.swift
          git rm .github/scripts/pr40_wire_microphone_calibration.py
          git rm .github/workflows/pr40-wire-microphone-calibration.yml
          git commit -m "PR40: wire microphone calibration through production measurement"
          git push origin HEAD:pr40-room-correction-production-workflow
