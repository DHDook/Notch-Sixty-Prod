name: PR23 Xcode Target Fix

on:
  push:
    branches:
      - feature/stereo-playback-control-parity

permissions:
  contents: write

jobs:
  fix-targets:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add new PR23 files to Xcode targets
        shell: bash
        run: |
          set -euo pipefail
          base64 -D -i .pr23-pbx.patch.gz.b64 | gunzip > /tmp/pr23-pbx.patch
          git apply --check /tmp/pr23-pbx.patch
          git apply /tmp/pr23-pbx.patch
          plutil -lint NotchSixty.xcodeproj/project.pbxproj
          git rm .pr23-pbx.patch.gz.b64 .github/workflows/pr23-pbx-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git commit -m "Add PR23 sources to Xcode targets"
          git push origin HEAD:feature/stereo-playback-control-parity
