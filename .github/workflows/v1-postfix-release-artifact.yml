name: v1.0.0 Post-fix Release Artifact

on:
  push:
    branches:
      - v1.0.0-postfix-build-artifacts

permissions:
  contents: read

jobs:
  release-dmg:
    if: ${{ contains(github.event.head_commit.message, '[postfix-build-trigger]') }}
    runs-on: xcode-27
    steps:
      - name: Check out exact merged post-fix revision
        uses: actions/checkout@v7
        with:
          ref: ccdfec4cfce85c7c7f9603c53022f7ac1f07d559

      - name: Show toolchain and revision
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          test "$(git rev-parse HEAD)" = "ccdfec4cfce85c7c7f9603c53022f7ac1f07d559"

      - name: Run full unit test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Build Release app
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/NotchSixtyReleaseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          GENERATE_INFOPLIST_FILE=NO
          INFOPLIST_FILE=NotchSixty/Info.plist
          build

      - name: Ad-hoc sign Release app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyReleaseDerivedData/Build/Products/Release/Notch Sixty.app"
          test -d "$APP"
          codesign --force --sign - --timestamp=none --entitlements NotchSixty/NotchSixty.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Validate v1.0.0 Release app metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyReleaseDerivedData/Build/Products/Release/Notch Sixty.app"
          INFO="$APP/Contents/Info.plist"
          EXECUTABLE="$APP/Contents/MacOS/Notch Sixty"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          test "$VERSION" = "1.0.0"
          test "$BUILD" = "1"
          test "$BUNDLE_ID" = "com.dhdook.NotchSixty"
          test "$ARCHS" = "arm64"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>&1)"
          echo "$ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          echo "$ENTITLEMENTS" | grep -q '<true/>'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$INFO")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO")"
          echo "dmg_name=Notch-Sixty-1.0.0-build-1-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Create v1.0.0 Release DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyReleaseDerivedData/Build/Products/Release/Notch Sixty.app"
          STAGE="$RUNNER_TEMP/NotchSixtyReleaseStage"
          DMG="$RUNNER_TEMP/Notch-Sixty-1.0.0-build-1-arm64.dmg"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Notch Sixty 1.0.0" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload v1.0.0 Release DMG
        uses: actions/upload-artifact@v4
        with:
          name: NotchSixty-release-1.0.0-build-1-postfix
          path: |
            ${{ runner.temp }}/Notch-Sixty-1.0.0-build-1-arm64.dmg
            ${{ runner.temp }}/Notch-Sixty-1.0.0-build-1-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 90
