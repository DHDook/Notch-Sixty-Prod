name: PR40 Fix Target Designer PBX ID

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-fix-target-designer-pbx-id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply PBX build-file ID fix
        run: python3 .github/scripts/pr40_fix_target_designer_pbx_id.py

      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/scripts/pr40_fix_target_designer_pbx_id.py
          git rm .github/workflows/pr40-fix-target-designer-pbx-id.yml
          git commit -m "PR40 Slice E: fix target designer PBX build-file identity"
          git push origin HEAD:pr40-room-correction-production-workflow
