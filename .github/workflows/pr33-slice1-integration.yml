name: PR33 Slice 1 Integration

on:
  push:
    branches:
      - feature/residual-dynamics-parity
    paths:
      - scripts/pr33_slice1_integrate.py
      - .github/workflows/pr33-slice1-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/residual-dynamics-parity
          fetch-depth: 0

      - name: Apply PR33 Slice 1
        run: python3 scripts/pr33_slice1_integrate.py

      - name: Validate patch
        run: git diff --check

      - name: Run full test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit Slice 1 and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/pr33_slice1_integrate.py .github/workflows/pr33-slice1-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add general Dynamic EQ foundation'
          git push origin HEAD:feature/residual-dynamics-parity
