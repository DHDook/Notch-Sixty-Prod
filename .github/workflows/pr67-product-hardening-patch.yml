name: PR67 Product Hardening Patch

on:
  push:
    branches:
      - feature/pr67-product-hardening-acceptance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply asserted product hardening integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          # 1. Accurate maximum configured path latency for the semantic render graph.
          path = 'NotchSixty/Audio/Realtime/N60LiveNChannelRenderCore.h'
          text = read(path)
          anchor = '''static inline bool N60LiveNChannelRenderGraphMake(\n'''
          latency = '''static inline uint64_t N60LiveNChannelRenderGraphLatencyFrames(\n    const N60LiveNChannelRenderGraph * _Nullable graph\n) {\n    if (graph == NULL || !N60LiveNChannelRenderGraphIsValid(graph)) return 0u;\n\n    uint64_t maximumProgramDelay = 0u;\n    for (uint32_t channel = 0; channel < graph->programLayout.channelCount; ++channel) {\n        const uint64_t delay = (uint64_t)N60ProgramLaneGraphEffectiveDelayFrames(\n            &graph->laneGraph, channel\n        );\n        if (delay > maximumProgramDelay) maximumProgramDelay = delay;\n    }\n\n    uint64_t maximumSubwooferDelay = 0u;\n    if (graph->bassManagementEnabled) {\n        for (uint32_t sub = 0; sub < graph->bassManagement.subwooferCount; ++sub) {\n            const uint64_t delay = (uint64_t)graph->bassManagement.subwoofers[sub].delayFrames;\n            if (delay > maximumSubwooferDelay) maximumSubwooferDelay = delay;\n        }\n    }\n    return maximumProgramDelay + maximumSubwooferDelay;\n}\n\n'''
          text = replace_once(text, anchor, latency + anchor, 'render latency helper')
          write(path, text)

          # 2. Demand-driven semantic program + final physical-output metering.
          path = 'NotchSixty/Audio/Realtime/N60LiveNChannelBridge.h'
          text = read(path)
          old = '''typedef struct {\n    uint64_t captureCallbacks;\n    uint64_t outputCallbacks;\n    uint64_t renderedFrames;\n    uint64_t renderFailures;\n    uint64_t outputWriteFailures;\n    uint64_t gatedOutputCallbacks;\n    uint64_t gatedOutputFrames;\n    bool outputGateOpen;\n    N60ProgramTransportSnapshot transport;\n} N60LiveNChannelBridgeSnapshot;\n'''
          new = '''typedef struct {\n    bool enabled;\n    uint32_t programChannelCount;\n    uint32_t physicalChannelCount;\n    float programPeak[N60_MAX_PROGRAM_CHANNELS];\n    float programRMS[N60_MAX_PROGRAM_CHANNELS];\n    uint64_t programOverRangeSamples[N60_MAX_PROGRAM_CHANNELS];\n    float physicalPeak[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n    float physicalRMS[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n    uint64_t physicalOverRangeSamples[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n} N60LiveNChannelMeterSnapshot;\n\ntypedef struct {\n    uint64_t captureCallbacks;\n    uint64_t outputCallbacks;\n    uint64_t renderedFrames;\n    uint64_t renderFailures;\n    uint64_t outputWriteFailures;\n    uint64_t gatedOutputCallbacks;\n    uint64_t gatedOutputFrames;\n    bool outputGateOpen;\n    uint64_t algorithmicLatencyFrames;\n    N60ProgramTransportSnapshot transport;\n    N60LiveNChannelMeterSnapshot meter;\n} N60LiveNChannelBridgeSnapshot;\n'''
          text = replace_once(text, old, new, 'nchannel snapshot')
          old = '''    _Atomic bool outputGateOpen;\n    _Atomic uint32_t outputGainBits;\n    _Atomic uint64_t captureCallbacks;\n'''
          new = '''    _Atomic bool outputGateOpen;\n    _Atomic uint32_t outputGainBits;\n    _Atomic bool meteringDemand;\n    _Atomic uint32_t meterProgramPeakBits[N60_MAX_PROGRAM_CHANNELS];\n    _Atomic uint32_t meterProgramRMSBits[N60_MAX_PROGRAM_CHANNELS];\n    _Atomic uint64_t meterProgramOverRangeSamples[N60_MAX_PROGRAM_CHANNELS];\n    _Atomic uint32_t meterPhysicalPeakBits[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n    _Atomic uint32_t meterPhysicalRMSBits[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n    _Atomic uint64_t meterPhysicalOverRangeSamples[N60_LIVE_MAX_PHYSICAL_CHANNELS];\n    _Atomic uint64_t captureCallbacks;\n'''
          text = replace_once(text, old, new, 'nchannel atomics')
          anchor = '''static inline float N60LiveNChannelClampOutputGain(float gain) {\n'''
          helper = '''static inline void N60LiveNChannelBridgeClearMeterPublication(\n    N60LiveNChannelBridge * _Nullable bridge\n) {\n    if (bridge == NULL) return;\n    for (uint32_t channel = 0; channel < N60_MAX_PROGRAM_CHANNELS; ++channel) {\n        atomic_store_explicit(&bridge->meterProgramPeakBits[channel], 0u, memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterProgramRMSBits[channel], 0u, memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterProgramOverRangeSamples[channel], 0u, memory_order_relaxed);\n    }\n    for (uint32_t physical = 0; physical < N60_LIVE_MAX_PHYSICAL_CHANNELS; ++physical) {\n        atomic_store_explicit(&bridge->meterPhysicalPeakBits[physical], 0u, memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterPhysicalRMSBits[physical], 0u, memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterPhysicalOverRangeSamples[physical], 0u, memory_order_relaxed);\n    }\n}\n\n'''
          text = replace_once(text, anchor, helper + anchor, 'nchannel clear meter')
          old = '''    atomic_store_explicit(&bridge->gatedOutputFrames, 0u, memory_order_relaxed);\n    return true;\n}\n\nstatic inline void N60LiveNChannelBridgeSetOutputGain(\n'''
          new = '''    atomic_store_explicit(&bridge->gatedOutputFrames, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meteringDemand, false, memory_order_release);\n    N60LiveNChannelBridgeClearMeterPublication(bridge);\n    return true;\n}\n\nstatic inline void N60LiveNChannelBridgeSetOutputGain(\n'''
          text = replace_once(text, old, new, 'nchannel reset meter')
          anchor = '''static inline N60LiveNChannelBridgeSnapshot N60LiveNChannelBridgeGetSnapshot(\n'''
          meter_api = '''static inline void N60LiveNChannelBridgeSetMeteringDemand(\n    N60LiveNChannelBridge * _Nullable bridge,\n    bool enabled\n) {\n    if (bridge == NULL) return;\n    if (enabled) {\n        N60LiveNChannelBridgeClearMeterPublication(bridge);\n        atomic_store_explicit(&bridge->meteringDemand, true, memory_order_release);\n    } else {\n        atomic_store_explicit(&bridge->meteringDemand, false, memory_order_release);\n        N60LiveNChannelBridgeClearMeterPublication(bridge);\n    }\n}\n\nstatic inline N60LiveNChannelMeterSnapshot N60LiveNChannelBridgeGetMeterSnapshot(\n    const N60LiveNChannelBridge * _Nullable bridge\n) {\n    N60LiveNChannelMeterSnapshot result = {0};\n    if (bridge == NULL) return result;\n    result.enabled = atomic_load_explicit(&bridge->meteringDemand, memory_order_acquire);\n    result.programChannelCount = bridge->graph.programLayout.channelCount;\n    result.physicalChannelCount = bridge->graph.outputMap.physicalChannelCount;\n    for (uint32_t channel = 0; channel < result.programChannelCount; ++channel) {\n        result.programPeak[channel] = N60LiveNChannelBitsToFloat(atomic_load_explicit(\n            &bridge->meterProgramPeakBits[channel], memory_order_relaxed\n        ));\n        result.programRMS[channel] = N60LiveNChannelBitsToFloat(atomic_load_explicit(\n            &bridge->meterProgramRMSBits[channel], memory_order_relaxed\n        ));\n        result.programOverRangeSamples[channel] = atomic_load_explicit(\n            &bridge->meterProgramOverRangeSamples[channel], memory_order_relaxed\n        );\n    }\n    for (uint32_t physical = 0; physical < result.physicalChannelCount; ++physical) {\n        result.physicalPeak[physical] = N60LiveNChannelBitsToFloat(atomic_load_explicit(\n            &bridge->meterPhysicalPeakBits[physical], memory_order_relaxed\n        ));\n        result.physicalRMS[physical] = N60LiveNChannelBitsToFloat(atomic_load_explicit(\n            &bridge->meterPhysicalRMSBits[physical], memory_order_relaxed\n        ));\n        result.physicalOverRangeSamples[physical] = atomic_load_explicit(\n            &bridge->meterPhysicalOverRangeSamples[physical], memory_order_relaxed\n        );\n    }\n    return result;\n}\n\nstatic inline float N60LiveNChannelMeterProgramPeak(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t channel\n) {\n    return meter != NULL && channel < meter->programChannelCount ? meter->programPeak[channel] : 0.0f;\n}\n\nstatic inline float N60LiveNChannelMeterProgramRMS(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t channel\n) {\n    return meter != NULL && channel < meter->programChannelCount ? meter->programRMS[channel] : 0.0f;\n}\n\nstatic inline uint64_t N60LiveNChannelMeterProgramOverRangeSamples(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t channel\n) {\n    return meter != NULL && channel < meter->programChannelCount\n        ? meter->programOverRangeSamples[channel] : 0u;\n}\n\nstatic inline float N60LiveNChannelMeterPhysicalPeak(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t physical\n) {\n    return meter != NULL && physical < meter->physicalChannelCount ? meter->physicalPeak[physical] : 0.0f;\n}\n\nstatic inline float N60LiveNChannelMeterPhysicalRMS(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t physical\n) {\n    return meter != NULL && physical < meter->physicalChannelCount ? meter->physicalRMS[physical] : 0.0f;\n}\n\nstatic inline uint64_t N60LiveNChannelMeterPhysicalOverRangeSamples(\n    const N60LiveNChannelMeterSnapshot * _Nullable meter, uint32_t physical\n) {\n    return meter != NULL && physical < meter->physicalChannelCount\n        ? meter->physicalOverRangeSamples[physical] : 0u;\n}\n\n'''
          text = replace_once(text, anchor, meter_api + anchor, 'nchannel meter api')
          old = '''        .outputGateOpen = atomic_load_explicit(&bridge->outputGateOpen, memory_order_acquire),\n        .transport = N60ProgramTransportGetSnapshot(bridge->transport),\n    };\n}\n'''
          new = '''        .outputGateOpen = atomic_load_explicit(&bridge->outputGateOpen, memory_order_acquire),\n        .algorithmicLatencyFrames = N60LiveNChannelRenderGraphLatencyFrames(&bridge->graph),\n        .transport = N60ProgramTransportGetSnapshot(bridge->transport),\n        .meter = N60LiveNChannelBridgeGetMeterSnapshot(bridge),\n    };\n}\n'''
          text = replace_once(text, old, new, 'nchannel snapshot values')
          old = '''    const float masterGain = N60LiveNChannelBitsToFloat(\n        atomic_load_explicit(&bridge->outputGainBits, memory_order_acquire)\n    );\n\n    for (uint32_t frameIndex = 0; frameIndex < frameCount; ++frameIndex) {\n'''
          new = '''    const float masterGain = N60LiveNChannelBitsToFloat(\n        atomic_load_explicit(&bridge->outputGainBits, memory_order_acquire)\n    );\n    const bool meterDemand = atomic_load_explicit(\n        &bridge->meteringDemand, memory_order_acquire\n    );\n    N60ProgramLaneMeterAccumulator programMeter = {0};\n    float physicalPeak[N60_LIVE_MAX_PHYSICAL_CHANNELS] = {0};\n    double physicalSquareSum[N60_LIVE_MAX_PHYSICAL_CHANNELS] = {0};\n    uint64_t physicalOverRange[N60_LIVE_MAX_PHYSICAL_CHANNELS] = {0};\n    uint32_t physicalMeterFrames = 0u;\n    if (meterDemand) {\n        N60ProgramLaneMeterAccumulatorReset(\n            &programMeter, bridge->graph.programLayout.channelCount\n        );\n    }\n\n    for (uint32_t frameIndex = 0; frameIndex < frameCount; ++frameIndex) {\n'''
          text = replace_once(text, old, new, 'nchannel meter local')
          old = '''                &input,\n                &physical,\n                NULL)) {\n'''
          new = '''                &input,\n                &physical,\n                meterDemand ? &programMeter : NULL)) {\n'''
          text = replace_once(text, old, new, 'nchannel lane meter hook')
          old = '''        const float gain = N60LiveNChannelBridgeNextOutputGain(bridge, masterGain);\n        if (!N60LiveNChannelWritePhysicalFrame(&physical, outOutputData, frameIndex, gain)) {\n'''
          new = '''        const float gain = N60LiveNChannelBridgeNextOutputGain(bridge, masterGain);\n        if (meterDemand) {\n            for (uint32_t physicalIndex = 0; physicalIndex < physical.physicalChannelCount; ++physicalIndex) {\n                const float value = physical.values[physicalIndex] * gain;\n                const float magnitude = fabsf(value);\n                if (magnitude > physicalPeak[physicalIndex]) physicalPeak[physicalIndex] = magnitude;\n                physicalSquareSum[physicalIndex] += (double)value * (double)value;\n                if (magnitude > 1.0f) physicalOverRange[physicalIndex] += 1u;\n            }\n            physicalMeterFrames += 1u;\n        }\n        if (!N60LiveNChannelWritePhysicalFrame(&physical, outOutputData, frameIndex, gain)) {\n'''
          text = replace_once(text, old, new, 'nchannel physical meter hook')
          old = '''        atomic_fetch_add_explicit(&bridge->renderedFrames, 1u, memory_order_relaxed);\n    }\n    return noErr;\n}\n'''
          new = '''        atomic_fetch_add_explicit(&bridge->renderedFrames, 1u, memory_order_relaxed);\n    }\n\n    if (meterDemand) {\n        const N60ProgramLaneMeterReading reading =\n            N60ProgramLaneMeterAccumulatorReading(&programMeter);\n        for (uint32_t channel = 0; channel < reading.channelCount; ++channel) {\n            atomic_store_explicit(\n                &bridge->meterProgramPeakBits[channel],\n                N60LiveNChannelFloatToBits(reading.peak[channel]),\n                memory_order_relaxed\n            );\n            atomic_store_explicit(\n                &bridge->meterProgramRMSBits[channel],\n                N60LiveNChannelFloatToBits(reading.rms[channel]),\n                memory_order_relaxed\n            );\n            atomic_fetch_add_explicit(\n                &bridge->meterProgramOverRangeSamples[channel],\n                reading.overRangeSamples[channel],\n                memory_order_relaxed\n            );\n        }\n        if (physicalMeterFrames > 0u) {\n            for (uint32_t physicalIndex = 0;\n                 physicalIndex < bridge->graph.outputMap.physicalChannelCount;\n                 ++physicalIndex) {\n                const float rms = (float)sqrt(\n                    physicalSquareSum[physicalIndex] / (double)physicalMeterFrames\n                );\n                atomic_store_explicit(\n                    &bridge->meterPhysicalPeakBits[physicalIndex],\n                    N60LiveNChannelFloatToBits(physicalPeak[physicalIndex]),\n                    memory_order_relaxed\n                );\n                atomic_store_explicit(\n                    &bridge->meterPhysicalRMSBits[physicalIndex],\n                    N60LiveNChannelFloatToBits(rms),\n                    memory_order_relaxed\n                );\n                atomic_fetch_add_explicit(\n                    &bridge->meterPhysicalOverRangeSamples[physicalIndex],\n                    physicalOverRange[physicalIndex],\n                    memory_order_relaxed\n                );\n            }\n        }\n    }\n    return noErr;\n}\n'''
          text = replace_once(text, old, new, 'nchannel meter publish')
          write(path, text)

          # 3. Demand-driven final stereo output meter for Virtual Speakers.
          path = 'NotchSixty/Audio/Realtime/N60BinauralHeadphoneBridge.h'
          text = read(path)
          old = '''typedef struct {\n    uint64_t captureCallbacks;\n'''
          new = '''typedef struct {\n    bool enabled;\n    float peakLeft;\n    float peakRight;\n    float rmsLeft;\n    float rmsRight;\n    uint64_t overRangeLeft;\n    uint64_t overRangeRight;\n} N60BinauralHeadphoneMeterSnapshot;\n\ntypedef struct {\n    uint64_t captureCallbacks;\n'''
          text = replace_once(text, old, new, 'binaural meter type')
          old = '''    N60ProgramTransportSnapshot transport;\n    N60ProtectionTelemetry protection;\n    N60HeadTrackedBinauralSnapshot headTracking;\n'''
          new = '''    N60ProgramTransportSnapshot transport;\n    N60ProtectionTelemetry protection;\n    N60HeadTrackedBinauralSnapshot headTracking;\n    N60BinauralHeadphoneMeterSnapshot meter;\n'''
          text = replace_once(text, old, new, 'binaural snapshot meter')
          old = '''    _Atomic bool outputGateOpen;\n    _Atomic uint32_t outputGainBits;\n    _Atomic uint64_t captureCallbacks;\n'''
          new = '''    _Atomic bool outputGateOpen;\n    _Atomic uint32_t outputGainBits;\n    _Atomic bool meteringDemand;\n    _Atomic uint32_t meterPeakLeftBits;\n    _Atomic uint32_t meterPeakRightBits;\n    _Atomic uint32_t meterRMSLeftBits;\n    _Atomic uint32_t meterRMSRightBits;\n    _Atomic uint64_t meterOverRangeLeft;\n    _Atomic uint64_t meterOverRangeRight;\n    _Atomic uint64_t captureCallbacks;\n'''
          text = replace_once(text, old, new, 'binaural meter atomics')
          anchor = '''static inline float N60BinauralHeadphoneClampGain(float gain) {\n'''
          helper = '''static inline void N60BinauralHeadphoneBridgeClearMeterPublication(\n    N60BinauralHeadphoneBridge * _Nullable bridge\n) {\n    if (bridge == NULL) return;\n    atomic_store_explicit(&bridge->meterPeakLeftBits, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meterPeakRightBits, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meterRMSLeftBits, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meterRMSRightBits, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meterOverRangeLeft, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meterOverRangeRight, 0u, memory_order_relaxed);\n}\n\n'''
          text = replace_once(text, anchor, helper + anchor, 'binaural clear meter')
          old = '''    atomic_store_explicit(&bridge->gatedOutputFrames, 0u, memory_order_relaxed);\n    return true;\n}\n\nstatic inline void N60BinauralHeadphoneBridgeSetOutputGain(\n'''
          new = '''    atomic_store_explicit(&bridge->gatedOutputFrames, 0u, memory_order_relaxed);\n    atomic_store_explicit(&bridge->meteringDemand, false, memory_order_release);\n    N60BinauralHeadphoneBridgeClearMeterPublication(bridge);\n    return true;\n}\n\nstatic inline void N60BinauralHeadphoneBridgeSetOutputGain(\n'''
          text = replace_once(text, old, new, 'binaural reset meter')
          anchor = '''static inline bool N60BinauralHeadphoneBridgeCanPrepareTrackedGeneration(\n'''
          meter_api = '''static inline void N60BinauralHeadphoneBridgeSetMeteringDemand(\n    N60BinauralHeadphoneBridge * _Nullable bridge, bool enabled\n) {\n    if (bridge == NULL) return;\n    if (enabled) {\n        N60BinauralHeadphoneBridgeClearMeterPublication(bridge);\n        atomic_store_explicit(&bridge->meteringDemand, true, memory_order_release);\n    } else {\n        atomic_store_explicit(&bridge->meteringDemand, false, memory_order_release);\n        N60BinauralHeadphoneBridgeClearMeterPublication(bridge);\n    }\n}\n\nstatic inline N60BinauralHeadphoneMeterSnapshot N60BinauralHeadphoneBridgeGetMeterSnapshot(\n    const N60BinauralHeadphoneBridge * _Nullable bridge\n) {\n    if (bridge == NULL) return (N60BinauralHeadphoneMeterSnapshot){0};\n    return (N60BinauralHeadphoneMeterSnapshot){\n        .enabled = atomic_load_explicit(&bridge->meteringDemand, memory_order_acquire),\n        .peakLeft = N60BinauralHeadphoneBitsToFloat(atomic_load_explicit(&bridge->meterPeakLeftBits, memory_order_relaxed)),\n        .peakRight = N60BinauralHeadphoneBitsToFloat(atomic_load_explicit(&bridge->meterPeakRightBits, memory_order_relaxed)),\n        .rmsLeft = N60BinauralHeadphoneBitsToFloat(atomic_load_explicit(&bridge->meterRMSLeftBits, memory_order_relaxed)),\n        .rmsRight = N60BinauralHeadphoneBitsToFloat(atomic_load_explicit(&bridge->meterRMSRightBits, memory_order_relaxed)),\n        .overRangeLeft = atomic_load_explicit(&bridge->meterOverRangeLeft, memory_order_relaxed),\n        .overRangeRight = atomic_load_explicit(&bridge->meterOverRangeRight, memory_order_relaxed),\n    };\n}\n\n'''
          text = replace_once(text, anchor, meter_api + anchor, 'binaural meter api')
          old = '''    return N60HeadTrackedBinauralRuntimeLatencyFrames(bridge->binauralRuntime)\n        + (uint64_t)N60ProtectionSnapshotLatencyFrames(&bridge->protectionSnapshot);\n'''
          new = '''    const uint64_t correctionDelay = bridge->headphoneSnapshot.channels[0].delayFrames\n        > bridge->headphoneSnapshot.channels[1].delayFrames\n        ? bridge->headphoneSnapshot.channels[0].delayFrames\n        : bridge->headphoneSnapshot.channels[1].delayFrames;\n    return N60HeadTrackedBinauralRuntimeLatencyFrames(bridge->binauralRuntime)\n        + correctionDelay\n        + (uint64_t)N60ProtectionSnapshotLatencyFrames(&bridge->protectionSnapshot);\n'''
          text = replace_once(text, old, new, 'binaural latency correction')
          old = '''        .protection = N60ProtectionRuntimeTelemetry(bridge->protectionRuntime),\n        .headTracking = N60HeadTrackedBinauralRuntimeGetSnapshot(bridge->binauralRuntime),\n'''
          new = '''        .protection = N60ProtectionRuntimeTelemetry(bridge->protectionRuntime),\n        .headTracking = N60HeadTrackedBinauralRuntimeGetSnapshot(bridge->binauralRuntime),\n        .meter = N60BinauralHeadphoneBridgeGetMeterSnapshot(bridge),\n'''
          text = replace_once(text, old, new, 'binaural snapshot values')
          old = '''    const float masterGain = N60BinauralHeadphoneBitsToFloat(\n        atomic_load_explicit(&bridge->outputGainBits, memory_order_acquire)\n    );\n    N60ProtectionRuntimeBeginBuffer(bridge->protectionRuntime);\n'''
          new = '''    const float masterGain = N60BinauralHeadphoneBitsToFloat(\n        atomic_load_explicit(&bridge->outputGainBits, memory_order_acquire)\n    );\n    const bool meterDemand = atomic_load_explicit(\n        &bridge->meteringDemand, memory_order_acquire\n    );\n    float meterPeakLeft = 0.0f;\n    float meterPeakRight = 0.0f;\n    double meterSquareLeft = 0.0;\n    double meterSquareRight = 0.0;\n    uint64_t meterOverLeft = 0u;\n    uint64_t meterOverRight = 0u;\n    N60ProtectionRuntimeBeginBuffer(bridge->protectionRuntime);\n'''
          text = replace_once(text, old, new, 'binaural meter local')
          old = '''        left *= gain;\n        right *= gain;\n\n        if (!N60BinauralHeadphoneWriteStereoFrame(\n'''
          new = '''        left *= gain;\n        right *= gain;\n        if (meterDemand) {\n            const float leftMagnitude = fabsf(left);\n            const float rightMagnitude = fabsf(right);\n            if (leftMagnitude > meterPeakLeft) meterPeakLeft = leftMagnitude;\n            if (rightMagnitude > meterPeakRight) meterPeakRight = rightMagnitude;\n            meterSquareLeft += (double)left * (double)left;\n            meterSquareRight += (double)right * (double)right;\n            if (leftMagnitude > 1.0f) meterOverLeft += 1u;\n            if (rightMagnitude > 1.0f) meterOverRight += 1u;\n        }\n\n        if (!N60BinauralHeadphoneWriteStereoFrame(\n'''
          text = replace_once(text, old, new, 'binaural meter hook')
          old = '''        atomic_fetch_add_explicit(&bridge->renderedFrames, 1u, memory_order_relaxed);\n    }\n    return noErr;\n}\n'''
          new = '''        atomic_fetch_add_explicit(&bridge->renderedFrames, 1u, memory_order_relaxed);\n    }\n    if (meterDemand && frameCount > 0u) {\n        atomic_store_explicit(&bridge->meterPeakLeftBits, N60BinauralHeadphoneFloatToBits(meterPeakLeft), memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterPeakRightBits, N60BinauralHeadphoneFloatToBits(meterPeakRight), memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterRMSLeftBits, N60BinauralHeadphoneFloatToBits((float)sqrt(meterSquareLeft / (double)frameCount)), memory_order_relaxed);\n        atomic_store_explicit(&bridge->meterRMSRightBits, N60BinauralHeadphoneFloatToBits((float)sqrt(meterSquareRight / (double)frameCount)), memory_order_relaxed);\n        atomic_fetch_add_explicit(&bridge->meterOverRangeLeft, meterOverLeft, memory_order_relaxed);\n        atomic_fetch_add_explicit(&bridge->meterOverRangeRight, meterOverRight, memory_order_relaxed);\n    }\n    return noErr;\n}\n'''
          text = replace_once(text, old, new, 'binaural meter publish')
          write(path, text)

          # 4. Session control-plane meter access.
          path = 'NotchSixty/Audio/CoreAudio/CoreAudioNChannelTransportSession.swift'
          text = read(path)
          old = '''    func setOutputGain(_ gain: Float) {\n        guard let bridge else { return }\n        N60LiveNChannelBridgeSetOutputGain(bridge, gain)\n    }\n\n    func counters() -> AudioTransportCounters {\n'''
          new = '''    func setOutputGain(_ gain: Float) {\n        guard let bridge else { return }\n        N60LiveNChannelBridgeSetOutputGain(bridge, gain)\n    }\n\n    func setDetailedMeteringDemand(_ enabled: Bool) {\n        N60LiveNChannelBridgeSetMeteringDemand(bridge, enabled)\n    }\n\n    func bridgeSnapshot() -> N60LiveNChannelBridgeSnapshot? {\n        guard let bridge else { return nil }\n        return N60LiveNChannelBridgeGetSnapshot(bridge)\n    }\n\n    func counters() -> AudioTransportCounters {\n'''
          text = replace_once(text, old, new, 'nchannel session meter')
          write(path, text)

          path = 'NotchSixty/Audio/CoreAudio/CoreAudioBinauralHeadphoneTransportSession.swift'
          text = read(path)
          old = '''    func setOutputGain(_ gain: Float) {\n        N60BinauralHeadphoneBridgeSetOutputGain(bridge, gain)\n    }\n\n    func headTrackingSnapshot() -> N60HeadTrackedBinauralSnapshot? {\n'''
          new = '''    func setOutputGain(_ gain: Float) {\n        N60BinauralHeadphoneBridgeSetOutputGain(bridge, gain)\n    }\n\n    func setDetailedMeteringDemand(_ enabled: Bool) {\n        N60BinauralHeadphoneBridgeSetMeteringDemand(bridge, enabled)\n    }\n\n    func bridgeSnapshot() -> N60BinauralHeadphoneBridgeSnapshot? {\n        guard let bridge else { return nil }\n        return N60BinauralHeadphoneBridgeGetSnapshot(bridge)\n    }\n\n    func headTrackingSnapshot() -> N60HeadTrackedBinauralSnapshot? {\n'''
          text = replace_once(text, old, new, 'binaural session meter')
          write(path, text)

          # 5. Product-facing transport meter model.
          path = 'NotchSixty/Diagnostics/AudioDiagnosticsSnapshot.swift'
          text = read(path)
