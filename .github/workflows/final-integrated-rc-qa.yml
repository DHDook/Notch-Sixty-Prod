name: Final Integrated RC and QA

on:
  push:
    branches:
      - feature/final-integrated-rc-qa
  pull_request:
    branches:
      - feature/optional-acoustic-research-expansion
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-integrated-rc-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

jobs:
  portable:
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[integration-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate final source, research, routing and PR112 owner safety
        run: |
          set -euo pipefail
          python3 ci/validate_final_integrated_rc_qa.py --source-only
          python3 ci/validate_optional_acoustic_research.py
          python3 ci/validate_batch4_final_validation.py
          python3 ci/validate_batch3_headphone_completion.py
          python3 ci/validate_batch2_unified_acoustics.py
          python3 ci/validate_pr112a_hardware_acceptance.py

      - name: Run final RC Release/logging/icon hygiene gate
        run: python3 ci/validate_final_rc_hardening.py

      - name: Validate precise 48/384-kHz multichannel bass management
        run: python3 ci/validate_pr55_multichannel_bass_management.py

      - name: Validate PR114 release baseline
        run: python3 ci/validate_pr114_release_baseline.py

      - name: Validate PR114 App Store privacy and security
        run: python3 ci/validate_pr114_privacy_security.py

      - name: Validate PR114 licensing, provenance and SBOM
        run: python3 ci/validate_pr114_provenance_sbom.py

      - name: Validate PR114 packaging and release manifest
        run: python3 ci/validate_pr114_packaging.py

      - name: Validate PR114 commercial metadata and negative gates
        run: python3 ci/validate_pr114_commercial_handoff.py --self-test

      - name: Build deterministic PR114 production SBOM
        run: >-
          python3 ci/build_pr114_sbom.py
          --output "${RUNNER_TEMP}/pr114-production-sbom.json"

      - name: Upload PR114 production SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pr114-production-sbom
          path: ${{ runner.temp }}/pr114-production-sbom.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve PR113B product-finish contract
        run: python3 ci/validate_pr113b_ab_foundation.py

      - name: Preserve commercial and App Store foundations
        run: |
          set -euo pipefail
          python3 ci/validate_pr102_release_readiness.py
          python3 ci/validate_pr102_app_store_boundary.py
          python3 ci/validate_pr102_dependency_manifest.py

  macos:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'integration-ci') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[integration-ci]'))
    needs: portable
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR114 and inherited release contracts
        run: |
          set -euo pipefail
          python3 ci/validate_final_integrated_rc_qa.py --source-only
          python3 ci/validate_final_rc_hardening.py
          python3 ci/validate_pr55_multichannel_bass_management.py
          python3 ci/validate_optional_acoustic_research.py
          python3 ci/validate_batch4_final_validation.py
          python3 ci/validate_batch3_headphone_completion.py
          python3 ci/validate_batch2_unified_acoustics.py
          python3 ci/validate_acoustic_batch1.py --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 ci/validate_pr112a_hardware_acceptance.py
          python3 ci/validate_pr114_release_baseline.py
          python3 ci/validate_pr114_privacy_security.py
          python3 ci/validate_pr114_provenance_sbom.py
          python3 ci/validate_pr114_packaging.py
          python3 ci/validate_pr114_commercial_handoff.py --self-test
          python3 ci/validate_pr113b_ab_foundation.py
          python3 ci/validate_pr102_release_readiness.py
          python3 ci/validate_pr102_app_store_boundary.py
          python3 ci/validate_pr102_dependency_manifest.py
          touch /tmp/pr114-validators.passed

      - name: Build deterministic PR114 production SBOM
        run: >-
          python3 ci/build_pr114_sbom.py
          --output "${RUNNER_TEMP}/pr114-production-sbom.json"

      - name: Build unsigned arm64 Debug app
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
          touch /tmp/pr114-debug-build.passed

      - name: Run product-finish targeted tests
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/ProductionInformationArchitectureTests \
            -only-testing:NotchSixtyTests/SpeakerMeasurementLabReportTests \
            test
          touch /tmp/pr114-targeted-tests.passed

      - name: Build unsigned arm64 Release app
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/PR114ReleaseDerivedData" \
            CODE_SIGNING_ALLOWED=NO GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=NotchSixty/Info.plist build
          touch /tmp/pr114-release-build.passed

      - name: Archive unsigned Release preflight
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/NotchSixty-PR114.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=NotchSixty/Info.plist

      - name: Verify unsigned archive preflight
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APP="$RUNNER_TEMP/PR114ReleaseDerivedData/Build/Products/Release/Notch Sixty.app"
          ARCHIVE="$RUNNER_TEMP/NotchSixty-PR114.xcarchive"
          ARCHIVE_APP="$ARCHIVE/Products/Applications/Notch Sixty.app"

          for APP in "$RELEASE_APP" "$ARCHIVE_APP"; do
            INFO="$APP/Contents/Info.plist"
            EXECUTABLE="$APP/Contents/MacOS/Notch Sixty"
            NOTICE="$APP/Contents/Resources/ThirdPartyNotices.txt"
            test -d "$APP"
            test -f "$INFO"
            test -x "$EXECUTABLE"
            test -f "$NOTICE"
            test "$(lipo -archs "$EXECUTABLE")" = "arm64"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.dhdook.NotchSixty"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "1.0.0"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "1"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO")" = "27.0"
            test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$INFO")"
            test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO")"
            grep -q 'libmysofa v1.3.4' "$NOTICE"
            grep -q 'BSD 3-Clause' "$NOTICE"
          done

          cmp \
            "$RELEASE_APP/Contents/Info.plist" \
            "$ARCHIVE_APP/Contents/Info.plist"
          touch /tmp/pr114-archive.passed

      - name: Create ad-hoc sandbox RC copy
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APP="$RUNNER_TEMP/PR114ReleaseDerivedData/Build/Products/Release/Notch Sixty.app"
          RC_ROOT="$RUNNER_TEMP/PR114RemoteRC"
          RC_APP="$RC_ROOT/Notch Sixty.app"
          rm -rf "$RC_ROOT"
          mkdir -p "$RC_ROOT"
          cp -R "$RELEASE_APP" "$RC_APP"

          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements NotchSixty/NotchSixty.entitlements \
            "$RC_APP"
          codesign --verify --strict --verbose=2 "$RC_APP"
          codesign -d --entitlements :- "$RC_APP" \
            > "$RUNNER_TEMP/pr114-effective-entitlements.plist" \
            2>/dev/null

      - name: Verify ad-hoc RC effective entitlements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          import os

          root = Path.cwd()
          expected = plistlib.loads(
              (root / "NotchSixty" / "NotchSixty.entitlements").read_bytes()
          )
          actual = plistlib.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pr114-effective-entitlements.plist").read_bytes()
          )
          if actual != expected:
              raise SystemExit(
                  f"effective ad-hoc RC entitlements differ: {actual!r} != {expected!r}"
              )
          PY

      - name: Create remote RC DMG
        shell: bash
        run: |
          set -euo pipefail
          RC_APP="$RUNNER_TEMP/PR114RemoteRC/Notch Sixty.app"
          INFO="$RC_APP/Contents/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          DMG="$RUNNER_TEMP/Notch-Sixty-${VERSION}-build-${BUILD}-final-stack-remote-rc-arm64.dmg"
          STAGE="$RUNNER_TEMP/PR114RemoteRCStage"

          rm -rf "$STAGE" "$DMG" "$DMG.sha256"
          mkdir -p "$STAGE"
          cp -R "$RC_APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "Notch Sixty ${VERSION} Final Test RC" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

          echo "PR114_RC_DMG=$DMG" >> "$GITHUB_ENV"
          touch /tmp/pr114-package.passed

      - name: Generate actual native SOFA HDF5 import fixtures
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/final-rc-venv"
          "$RUNNER_TEMP/final-rc-venv/bin/python" -m pip install --quiet netCDF4 numpy
          "$RUNNER_TEMP/final-rc-venv/bin/python"             ci/generate_pr117d_sofa_fixtures.py "$RUNNER_TEMP/final-rc-sofa"
          "$RUNNER_TEMP/final-rc-venv/bin/python"             ci/generate_pr85_sofa_fixture.py "$RUNNER_TEMP/final-rc-pr85.sofa"

      - name: Run cumulative XCTest regression
        env:
          PR85_SOFA_FIXTURE: ${{ runner.temp }}/final-rc-pr85.sofa
          PR117D_SOFA_FIXTURE_DIR: ${{ runner.temp }}/final-rc-sofa
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
          touch /tmp/pr114-xctest.passed

      - name: Verify actual test DMG image and mounted installed application
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify "$PR114_RC_DMG"
          MOUNT="$RUNNER_TEMP/FinalRCAuditMount"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$PR114_RC_DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          APP="$MOUNT/Notch Sixty.app"
          test -x "$APP/Contents/MacOS/Notch Sixty"
          test -f "$APP/Contents/Resources/ThirdPartyNotices.txt"
          test "$(lipo -archs "$APP/Contents/MacOS/Notch Sixty")" = "arm64"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Build PR114 remote commercial RC manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/build_pr114_release_candidate_manifest.py \
            --release-app "$RUNNER_TEMP/PR114ReleaseDerivedData/Build/Products/Release/Notch Sixty.app" \
            --archive "$RUNNER_TEMP/NotchSixty-PR114.xcarchive" \
            --rc-app "$RUNNER_TEMP/PR114RemoteRC/Notch Sixty.app" \
            --rc-dmg "$PR114_RC_DMG" \
            --effective-entitlements "$RUNNER_TEMP/pr114-effective-entitlements.plist" \
            --sbom "$RUNNER_TEMP/pr114-production-sbom.json" \
            --validators-marker /tmp/pr114-validators.passed \
            --debug-build-marker /tmp/pr114-debug-build.passed \
            --targeted-tests-marker /tmp/pr114-targeted-tests.passed \
            --release-build-marker /tmp/pr114-release-build.passed \
            --archive-marker /tmp/pr114-archive.passed \
            --package-marker /tmp/pr114-package.passed \
            --xctest-marker /tmp/pr114-xctest.passed \
            --output "$RUNNER_TEMP/pr114-remote-commercial-rc.json"
          python3 -m json.tool "$RUNNER_TEMP/pr114-remote-commercial-rc.json" >/dev/null

      - name: PR114 integrated RC gate
        shell: bash
        env:
          PR114_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr114_commercial_handoff.py \
            --rc-manifest "$RUNNER_TEMP/pr114-remote-commercial-rc.json" \
            --rc-dmg "$PR114_RC_DMG" \
            --sbom "$RUNNER_TEMP/pr114-production-sbom.json"

      - name: Build integrated final QA manifest bound to this actual DMG
        shell: bash
        env:
          FINAL_RC_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 ci/validate_final_integrated_rc_qa.py             --manifest "$RUNNER_TEMP/pr114-remote-commercial-rc.json"             --dmg "$PR114_RC_DMG"             --sbom "$RUNNER_TEMP/pr114-production-sbom.json"             --run-id "$FINAL_RC_RUN_ID"             --output "$RUNNER_TEMP/final-integrated-rc-qa.json"
          shasum -a 256 "$RUNNER_TEMP/final-integrated-rc-qa.json"             > "$RUNNER_TEMP/final-integrated-rc-qa.json.sha256"

      - name: Compress unsigned macOS archive for owner verification
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/Notch-Sixty-final-rc-arm64.xcarchive.tar.gz"             -C "$RUNNER_TEMP" NotchSixty-PR114.xcarchive
          shasum -a 256 "$RUNNER_TEMP/Notch-Sixty-final-rc-arm64.xcarchive.tar.gz"             > "$RUNNER_TEMP/Notch-Sixty-final-rc-arm64.xcarchive.tar.gz.sha256"

      - name: Upload PR114 remote RC evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-integrated-remote-rc
          path: |
            ${{ runner.temp }}/pr114-remote-commercial-rc.json
            ${{ runner.temp }}/final-integrated-rc-qa.json
            ${{ runner.temp }}/final-integrated-rc-qa.json.sha256
            ${{ runner.temp }}/Notch-Sixty-final-rc-arm64.xcarchive.tar.gz
            ${{ runner.temp }}/Notch-Sixty-final-rc-arm64.xcarchive.tar.gz.sha256
            ${{ runner.temp }}/pr114-production-sbom.json
            ${{ runner.temp }}/pr114-effective-entitlements.plist
            ${{ env.PR114_RC_DMG }}
            ${{ env.PR114_RC_DMG }}.sha256
          if-no-files-found: error
          retention-days: 90
