name: PR45 Final Acceptance UX Fixes

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-final-acceptance-fixes.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening

      - name: Apply final acceptance fixes
        run: |
          python3 ci/pr45_final_acceptance_fixes.py
          python3 ci/pr45_update_settings_guard.py

      - name: Validate retained contracts
        run: |
          python3 ci/validate_pr39_app_identity.py
          python3 ci/validate_pr42_app_shell.py
          python3 ci/validate_pr44_factory_presets.py
          python3 ci/validate_pr45_release_hardening.py

      - name: Build Debug
        run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build

      - name: Run tests
        run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test

      - name: Commit accepted fixes
        shell: bash
        run: |
          rm .github/workflows/pr45-final-acceptance-fixes.yml
          rm ci/pr45_final_acceptance_fixes.py
          rm ci/pr45_update_settings_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PR45: fix final acceptance app shell and preset UX'
          git push origin HEAD:pr45-v1-release-hardening
