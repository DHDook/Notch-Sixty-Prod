name: PR40 Fix Calibration Rediscovery

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-fix-calibration-rediscovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply calibration rediscovery fix
        run: python3 .github/scripts/pr40_fix_calibration_rediscovery.py

      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/State/RoomCorrectionCalibrationController.swift \
                  NotchSixtyTests/RoomCorrectionCalibrationControllerTests.swift
          git rm .github/scripts/pr40_fix_calibration_rediscovery.py
          git rm .github/workflows/pr40-fix-calibration-rediscovery.yml
          git commit -m "PR40: clear microphone calibration on device rediscovery"
          git push origin HEAD:pr40-room-correction-production-workflow
