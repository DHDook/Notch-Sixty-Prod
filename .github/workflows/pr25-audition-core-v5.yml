name: PR25 Audition Core V5

on:
  push:
    branches: [feature/latency-matched-audition-delta]
    paths:
      - .github/workflows/pr25-audition-core-v5.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply PR25 core
        run: |
          python3 .github/scripts/pr25_prepare_core.py
          python3 .github/scripts/pr25_audition_core.py
          python3 .github/scripts/pr25_policy_test_patch.py
      - name: Run full test suite
        run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr25-audition-core.yml .github/workflows/pr25-audition-core-v2.yml .github/workflows/pr25-audition-core-v3.yml .github/workflows/pr25-audition-core-v4.yml .github/workflows/pr25-audition-core-v5.yml
          rm -f .github/scripts/pr25_audition_core.py .github/scripts/pr25_policy_test_patch.py .github/scripts/pr25_prepare_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add latency-matched reference and delta audition core'
          git push origin HEAD:feature/latency-matched-audition-delta
