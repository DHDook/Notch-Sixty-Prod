name: PR83 Plug-in Rack UX

on:
  push:
    branches:
      - feature/pr83-plugin-rack-ux
  pull_request:
    branches:
      - feature/pr82-live-au-rack-mutation
  workflow_dispatch:

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate inherited PR82 mutation architecture
        run: python3 ci/validate_pr82_live_audio_unit_rack_mutation.py
      - name: Run inherited PR82 lock-free rack exchange simulator
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr82_audio_unit_rack_exchange.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr82-rack-exchange
          /tmp/pr82-rack-exchange
      - name: Validate PR83 transactional plug-in UX
        run: python3 ci/validate_pr83_plugin_rack_ux.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR83 transactional plug-in UX
        run: python3 ci/validate_pr83_plugin_rack_ux.py
      - name: Validate inherited PR82 mutation architecture
        run: python3 ci/validate_pr82_live_audio_unit_rack_mutation.py
      - name: Run inherited PR82 lock-free rack exchange simulator
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr82_audio_unit_rack_exchange.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr82-rack-exchange
          /tmp/pr82-rack-exchange
      - name: Build arm64 app with Plug-in Rack UX
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build
      - name: Run retained PR79 host-foundation tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitHostFoundationTests \
            test
      - name: Run retained PR80 offline preparation tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitOfflinePreparationTests \
            test
      - name: Run retained PR81 live rack tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitLiveRackRuntimeTests \
            test
      - name: Run PR82/83 rack mutation tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitRackMutationTests \
            test
      - name: Run retained XCTest suite
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test
