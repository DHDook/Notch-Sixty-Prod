name: PR39 Slice2 ownership fix

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Enforce single-consumer analysis-ring ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c",
              '''void N60RealtimeAudioBridgeSetAnalysisDemand(
              N60RealtimeAudioBridge *bridge,
              uint32_t demandMask
          ) {
              if (bridge == NULL) return;
              uint32_t sanitized = demandMask & N60_ANALYSIS_DEMAND_ALL;
              uint32_t previous = atomic_exchange_explicit(
                  &bridge->analysisDemandMask, sanitized, memory_order_acq_rel
              );
              if (previous != sanitized) {
                  uint64_t writeIndex = atomic_load_explicit(
                      &bridge->analysisWriteIndex, memory_order_acquire
                  );
                  atomic_store_explicit(&bridge->analysisReadIndex, writeIndex, memory_order_release);
              }
          }
          ''',
              '''void N60RealtimeAudioBridgeSetAnalysisDemand(
              N60RealtimeAudioBridge *bridge,
              uint32_t demandMask
          ) {
              if (bridge == NULL) return;
              uint32_t sanitized = demandMask & N60_ANALYSIS_DEMAND_ALL;
              atomic_store_explicit(&bridge->analysisDemandMask, sanitized, memory_order_release);
          }

          void N60RealtimeAudioBridgeDiscardAnalysisFrames(N60RealtimeAudioBridge *bridge) {
              if (bridge == NULL) return;
              uint64_t writeIndex = atomic_load_explicit(
                  &bridge->analysisWriteIndex, memory_order_acquire
              );
              atomic_store_explicit(&bridge->analysisReadIndex, writeIndex, memory_order_release);
          }
          '''
          )

          replace(
              "NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h",
              '''uint32_t N60RealtimeAudioBridgeAnalysisDemand(
              const N60RealtimeAudioBridge * _Nonnull bridge
          );
          N60AnalysisCaptureSnapshot N60RealtimeAudioBridgeGetAnalysisCaptureSnapshot(
          ''',
              '''uint32_t N60RealtimeAudioBridgeAnalysisDemand(
              const N60RealtimeAudioBridge * _Nonnull bridge
          );
          // Consumer-side operation. The analysis worker is the sole owner of
          // the ring read index and calls this off the realtime thread when a
          // demand generation changes.
          void N60RealtimeAudioBridgeDiscardAnalysisFrames(
              N60RealtimeAudioBridge * _Nonnull bridge
          );
          N60AnalysisCaptureSnapshot N60RealtimeAudioBridgeGetAnalysisCaptureSnapshot(
          '''
          )

          replace(
              "NotchSixty/Diagnostics/ProductionAnalysisWorker.swift",
              '''            if changed {
                          self.clearHistory()
                          self.spectrumAnalyzer.requestPeakHoldReset()
                      }
          ''',
              '''            if changed {
                          N60RealtimeAudioBridgeDiscardAnalysisFrames(self.bridge)
                          self.clearHistory()
                          self.spectrumAnalyzer.requestPeakHoldReset()
                      }
          '''
          )

          replace(
              "NotchSixty/Audio/CoreAudio/CoreAudioError.swift",
              '''    func readAnalysisFrames(into buffer: UnsafeMutableBufferPointer<N60AnalysisFrame>) -> Int {
                  guard let bridge, let baseAddress = buffer.baseAddress, !buffer.isEmpty else { return 0 }
                  return Int(N60RealtimeAudioBridgeReadAnalysisFrames(
                      bridge, baseAddress, UInt32(buffer.count)
                  ))
              }

          ''',
              ''''''
          )

          replace(
              "NotchSixty/Audio/AudioIOEngine.swift",
              '''    func readAnalysisFrames(into buffer: UnsafeMutableBufferPointer<N60AnalysisFrame>) -> Int {
                  transportSession?.readAnalysisFrames(into: buffer) ?? 0
              }

          ''',
              ''''''
          )

          replace(
              "docs/PR39_SLICE2_STATUS.md",
              '''- The ring is single-producer/single-consumer: the callback never waits and never overwrites unread analysis data. If the control-plane reader falls behind, new analysis frames are dropped and counted.
          ''',
              '''- The ring is single-producer/single-consumer: the callback never waits and never overwrites unread analysis data. If the control-plane reader falls behind, new analysis frames are dropped and counted.
          - The analysis worker exclusively owns the consumer read index. Control-thread demand changes never advance or rewind that index; stale frames are discarded on the worker's serial queue when the demand generation changes.
          '''
          )
          PY

          rm .github/workflows/pr39-slice2-ownership-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR39: enforce analysis ring consumer ownership"
          git push origin HEAD:feature/pr39-production-meters-analysis
