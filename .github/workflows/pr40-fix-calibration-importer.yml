name: PR40 Fix Calibration Importer

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-fix-calibration-importer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Apply importer adapter fix
        run: python3 .github/scripts/pr40_fix_calibration_importer.py

      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/UI/ProductionRoomCorrectionWorkspace.swift
          git rm .github/scripts/pr40_fix_calibration_importer.py
          git rm .github/workflows/pr40-fix-calibration-importer.yml
          git commit -m "PR40: fix microphone calibration file importer adapter"
          git push origin HEAD:pr40-room-correction-production-workflow
