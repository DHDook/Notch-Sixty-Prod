name: PR40 Measurement Transport Project Wiring

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-measurement-transport.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Wire measurement transport into Xcode project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = path.read_text()

          replacements = [
              (
                  '\t\tA10000000000000000000019 /* ProductionAnalysisTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002C /* ProductionAnalysisTests.swift */; };',
                  '\t\tA10000000000000000000019 /* ProductionAnalysisTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002C /* ProductionAnalysisTests.swift */; };\n'
                  '\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */; };'
              ),
              (
                  '\t\tA2000000000000000000001B /* ProductProfiles.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002B /* ProductProfiles.swift */; };',
                  '\t\tA2000000000000000000001B /* ProductProfiles.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002B /* ProductProfiles.swift */; };\n'
                  '\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */; };'
              ),
              (
                  '\t\tA30000000000000000000017 /* N60DynamicsLegacyAdvanced.c in Sources */ = {isa = PBXBuildFile; fileRef = A3000000000000000000002D /* N60DynamicsLegacyAdvanced.c */; };',
                  '\t\tA30000000000000000000017 /* N60DynamicsLegacyAdvanced.c in Sources */ = {isa = PBXBuildFile; fileRef = A3000000000000000000002D /* N60DynamicsLegacyAdvanced.c */; };\n'
                  '\t\tA30000000000000000000018 /* N60RoomMeasurementBridge.c in Sources */ = {isa = PBXBuildFile; fileRef = A3000000000000000000002F /* N60RoomMeasurementBridge.c */; };'
              ),
              (
                  '\t\tA1000000000000000000002C /* ProductionAnalysisTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductionAnalysisTests.swift; sourceTree = "<group>"; };',
                  '\t\tA1000000000000000000002C /* ProductionAnalysisTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductionAnalysisTests.swift; sourceTree = "<group>"; };\n'
                  '\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementTests.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\tA2000000000000000000002B /* ProductProfiles.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductProfiles.swift; sourceTree = "<group>"; };',
                  '\t\tA2000000000000000000002B /* ProductProfiles.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ProductProfiles.swift; sourceTree = "<group>"; };\n'
                  '\t\tA2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationTransport.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\tA3000000000000000000002E /* N60DynamicsLegacyAdvanced.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = N60DynamicsLegacyAdvanced.h; sourceTree = "<group>"; };',
                  '\t\tA3000000000000000000002E /* N60DynamicsLegacyAdvanced.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = N60DynamicsLegacyAdvanced.h; sourceTree = "<group>"; };\n'
                  '\t\tA3000000000000000000002F /* N60RoomMeasurementBridge.c */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.c; path = N60RoomMeasurementBridge.c; sourceTree = "<group>"; };\n'
                  '\t\tA30000000000000000000030 /* N60RoomMeasurementBridge.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = N60RoomMeasurementBridge.h; sourceTree = "<group>"; };'
              ),
              (
                  '\t\tA20000000000000000000051 /* CoreAudio */ = {isa = PBXGroup; children = (A20000000000000000000021 /* CoreAudioError.swift */, A20000000000000000000028 /* MasterVolumeDeviceController.swift */,); path = CoreAudio; sourceTree = "<group>"; };',
                  '\t\tA20000000000000000000051 /* CoreAudio */ = {isa = PBXGroup; children = (A20000000000000000000021 /* CoreAudioError.swift */, A20000000000000000000028 /* MasterVolumeDeviceController.swift */, A2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */,); path = CoreAudio; sourceTree = "<group>"; };'
              ),
              (
                  '\t\t\t\tA1000000000000000000002C /* ProductionAnalysisTests.swift */,\n\t\t\t);\n\t\t\tpath = NotchSixtyTests;',
                  '\t\t\t\tA1000000000000000000002C /* ProductionAnalysisTests.swift */,\n'
                  '\t\t\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */,\n'
                  '\t\t\t);\n\t\t\tpath = NotchSixtyTests;'
              ),
              (
                  '\t\t\t\tA3000000000000000000002E /* N60DynamicsLegacyAdvanced.h */,\n\t\t\t);\n\t\t\tpath = Realtime;',
                  '\t\t\t\tA3000000000000000000002E /* N60DynamicsLegacyAdvanced.h */,\n'
                  '\t\t\t\tA3000000000000000000002F /* N60RoomMeasurementBridge.c */,\n'
                  '\t\t\t\tA30000000000000000000030 /* N60RoomMeasurementBridge.h */,\n'
                  '\t\t\t);\n\t\t\tpath = Realtime;'
              ),
              (
                  '\t\t\t\tA2000000000000000000001B /* ProductProfiles.swift in Sources */,\n\t\t\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */,',
                  '\t\t\t\tA2000000000000000000001B /* ProductProfiles.swift in Sources */,\n'
                  '\t\t\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */,\n'
                  '\t\t\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */,'
              ),
              (
                  '\t\t\t\tA30000000000000000000017 /* N60DynamicsLegacyAdvanced.c in Sources */,\n\t\t\t);',
                  '\t\t\t\tA30000000000000000000017 /* N60DynamicsLegacyAdvanced.c in Sources */,\n'
                  '\t\t\t\tA30000000000000000000018 /* N60RoomMeasurementBridge.c in Sources */,\n'
                  '\t\t\t);'
              ),
              (
                  '\t\t\t\tA10000000000000000000019 /* ProductionAnalysisTests.swift in Sources */,\n\t\t\t);',
                  '\t\t\t\tA10000000000000000000019 /* ProductionAnalysisTests.swift in Sources */,\n'
                  '\t\t\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */,\n'
                  '\t\t\t);'
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one project anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit project wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-wire-measurement-transport.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: wire calibration transport into Xcode target"
          git push origin HEAD:pr40-room-correction-production-workflow
