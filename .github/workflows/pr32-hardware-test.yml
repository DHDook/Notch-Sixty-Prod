name: PR32 Hardware Test DMG

on:
  push:
    branches: [feature/dynamics-parity-closure]

permissions:
  contents: write

jobs:
  package:
    runs-on: xcode-27
    steps:
      - name: Check out exact substantive PR32 revision
        uses: actions/checkout@v7
        with:
          ref: e32fc3be92105b900418a1e72297aa9ee8f12602
          fetch-depth: 0

      - name: Show exact revision
        run: |
          test "$(git rev-parse HEAD)" = "e32fc3be92105b900418a1e72297aa9ee8f12602"
          git rev-parse HEAD
          xcodebuild -version

      - name: Run unit tests
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Build Release app
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/NotchSixtyDerivedData"
          CODE_SIGNING_ALLOWED=NO
          GENERATE_INFOPLIST_FILE=NO
          INFOPLIST_FILE=NotchSixty/Info.plist
          build

      - name: Ad-hoc sign sandboxed test app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          test -d "$APP"
          codesign --force --sign - --timestamp=none --entitlements NotchSixty/NotchSixty.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Validate test app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          EXECUTABLE="$APP/Contents/MacOS/Notch Sixty"
          ARCHS="$(lipo -archs "$EXECUTABLE")"
          echo "Architectures: $ARCHS"
          test "$ARCHS" = "arm64"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP" 2>&1)"
          echo "$ENTITLEMENTS" | grep -q 'com.apple.security.app-sandbox'
          echo "$ENTITLEMENTS" | grep -q '<true/>'

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/NotchSixtyDerivedData/Build/Products/Release/Notch Sixty.app"
          STAGE="$RUNNER_TEMP/NotchSixtyPR32HardwareTest"
          DMG="$RUNNER_TEMP/NotchSixty-PR32-hardware-test.dmg"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname 'Notch Sixty PR32 Hardware Test' -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "PR32 exact source: e32fc3be92105b900418a1e72297aa9ee8f12602" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NotchSixty-PR32-hardware-test
          path: ${{ runner.temp }}/NotchSixty-PR32-hardware-test.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary workflow from branch
        shell: bash
        run: |
          git checkout feature/dynamics-parity-closure
          git pull --ff-only origin feature/dynamics-parity-closure
          rm -f .github/workflows/pr32-hardware-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary PR32 hardware workflow'
          git push origin HEAD:feature/dynamics-parity-closure
