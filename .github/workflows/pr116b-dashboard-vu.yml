name: PR116B Dashboard VU Palette and Forward Roadmap

on:
  push:
    branches:
      - feature/pr116b-dashboard-vu-icon-alignment
  pull_request:
    branches:
      - feature/pr116-final-app-icons
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr116b-vu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check VU appearance and roadmap
        run: |
          set -euo pipefail
          python3 ci/validate_pr116b_dashboard_vu.py
          python3 ci/validate_pr68_vu_volume_polish.py
          python3 ci/validate_pr113_production_ux.py
          python3 ci/validate_pr112a_hardware_acceptance.py
          python3 ci/validate_pr109_cross_feature_contracts.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate visual and inherited contracts
        run: |
          set -euo pipefail
          python3 ci/validate_pr116b_dashboard_vu.py
          python3 ci/validate_pr68_vu_volume_polish.py
          python3 ci/validate_pr113_production_ux.py
      - name: Build unsigned arm64 Debug app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
      - name: Build unsigned arm64 Release app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Release -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO GENERATE_INFOPLIST_FILE=NO
          INFOPLIST_FILE=NotchSixty/Info.plist build
      - name: Full application XCTest regression
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
