name: PR41 Multi-device Aggregate Transport

on:
  push:
    branches:
      - pr41-active-crossover-matrix-parity
    paths:
      - .github/scripts/pr41_slice_c3.py
      - .github/workflows/pr41-slice-c3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - name: Check out PR41 branch
        uses: actions/checkout@v7
        with:
          ref: pr41-active-crossover-matrix-parity
          fetch-depth: 0

      - name: Apply PR41 Slice C3 patch
        run: python3 .github/scripts/pr41_slice_c3.py

      - name: Validate focused routing and profile tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project NotchSixty.xcodeproj >/dev/null
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomCorrectionProjectControllerTests \
            test

      - name: Validate C3 transport contract shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'struct AggregateDeviceOutputRoutePlan' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'kAudioAggregateDeviceSubDeviceListKey' NotchSixty/Audio/CoreAudio/CoreAudioError.swift
          grep -q 'kAudioSubDeviceDriftCompensationKey' NotchSixty/Audio/CoreAudio/CoreAudioError.swift
          grep -q 'kAudioAggregateDeviceMainSubDeviceKey' NotchSixty/Audio/CoreAudio/CoreAudioError.swift
          grep -q 'waitForDeviceAlive' NotchSixty/Audio/CoreAudio/CoreAudioError.swift
          grep -q 'aggregateDeviceOutputPlan' NotchSixty/Audio/AudioIOEngine.swift
          grep -q 'testAggregateDevicePlanFlattensPhysicalChannelsReferenceFirst' NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          ! grep -q 'AudioDeviceStart(selectedOutput.deviceID, outputIOProcID)' NotchSixty/Audio/CoreAudio/CoreAudioError.swift

      - name: Commit C3 and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/scripts/pr41_slice_c3.py \
            .github/workflows/pr41-slice-c3.yml
          git add NotchSixty/Audio/Routing/AudioRouteConfiguration.swift \
                  NotchSixty/Audio/CoreAudio/CoreAudioError.swift \
                  NotchSixty/Audio/AudioIOEngine.swift \
                  NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          git commit -m 'PR41 Slice C3: activate multi-device aggregate transport'
          git push origin HEAD:pr41-active-crossover-matrix-parity
