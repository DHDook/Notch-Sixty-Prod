name: PR39 Final Icon Generation

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Generate final light/dark app icons
        run: |
          swift ci/generate_app_icons.swift
          python3 ci/validate_pr39_app_identity.py
          git diff --check

      - name: Build and test with generated icons
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Assets.xcassets/AppIcon.appiconset artwork/AppIcon-light-final.png artwork/AppIcon-dark-final.png
          git diff --cached --check
          git commit -m "PR39: install final enameled app icons"
          git push origin HEAD:feature/pr39-production-meters-analysis
