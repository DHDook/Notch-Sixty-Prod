name: PR40 Add Final Room Correction Regressions

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-add-final-regressions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Add final room-correction regressions
        run: python3 .github/scripts/pr40_add_final_regressions.py

      - name: Validate regression shape
        run: |
          grep -q 'testRoomCorrectionAuditionModesMatchLatencyAlignedContract' NotchSixtyTests/StereoPlaybackControlTests.swift
          grep -q 'testRawGlobalBypassOverridesAttachedRoomCorrectionAndDeltaAudition' NotchSixtyTests/StereoPlaybackControlTests.swift
          grep -q 'testRoomCorrectionPreparationPolicyParksAndRestoresOnlyForRawBypass' NotchSixtyTests/StereoPlaybackControlTests.swift
          grep -q 'testPersistentRoomCorrectionEnableTogglePreservesDeploymentAndContentPreset' NotchSixtyTests/RoomCorrectionProjectControllerTests.swift

      - name: Commit regressions and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/pr40_add_final_regressions.py .github/workflows/pr40-add-final-regressions.yml
          git add NotchSixtyTests/StereoPlaybackControlTests.swift NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          git commit -m 'PR40 Slice F: add final room correction regression coverage'
          git push origin HEAD:pr40-room-correction-production-workflow
