name: PR40 Wire FIR Designer

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-fir-designer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Wire FIR designer into app and test targets
        run: python3 .github/scripts/pr40_wire_fir_designer.py

      - name: Commit wiring and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/scripts/pr40_wire_fir_designer.py
          git rm .github/workflows/pr40-wire-fir-designer.yml
          git commit -m "PR40 Slice E: compile minimum-phase FIR designer"
          git push origin HEAD:pr40-room-correction-production-workflow
