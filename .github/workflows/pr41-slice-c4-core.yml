name: PR41 Physical Speaker Bus Crossover

on:
  push:
    branches:
      - pr41-active-crossover-matrix-parity
    paths:
      - .github/scripts/pr41_slice_c4_core.py
      - .github/workflows/pr41-slice-c4-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - name: Check out PR41 branch
        uses: actions/checkout@v7
        with:
          ref: pr41-active-crossover-matrix-parity
          fetch-depth: 0

      - name: Apply PR41 Slice C4 core patch
        run: |
          sed -i '' 's/2_000\.0/2000.0/g' .github/scripts/pr41_slice_c4_core.py
          python3 .github/scripts/pr41_slice_c4_core.py

      - name: Validate focused routing and crossover tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project NotchSixty.xcodeproj >/dev/null
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomCorrectionProjectControllerTests \
            test

      - name: Validate physical speaker-bus IOProc
        shell: bash
        run: |
          set -euo pipefail
          REALTIME_SOURCES=$(find NotchSixty/Audio/Realtime -name '*.c' -print)
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -include stddef.h \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr41_same_device_output_map.c \
            $REALTIME_SOURCES \
            -framework Accelerate \
            -framework CoreAudio \
            -o /tmp/validate-pr41-physical-speaker-buses
          /tmp/validate-pr41-physical-speaker-buses

      - name: Validate C4 core contract shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'N60SpeakerBusSplitterSnapshot' NotchSixty/Audio/Realtime/N60Crossover.h
          grep -q 'N60RealtimeAudioBridgeConfigureSpeakerBusSplitter' NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h
          grep -q 'process_speaker_bus_splitter' NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c
          grep -q 'enum SpeakerCrossoverMode' NotchSixty/Audio/AudioIOEngine.swift
          grep -q 'physicalSpeakerBusRoutingActive' NotchSixty/Audio/AudioIOEngine.swift
          grep -q 'renderBassManagementConfiguration' NotchSixty/Audio/AudioIOEngine.swift
          grep -q 'validateForC4LiveTransport' NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          grep -q 'validate_live_mains_sub_splitter' ci/validate_pr41_same_device_output_map.c

      - name: Commit C4 core and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/scripts/pr41_slice_c4_core.py \
            .github/workflows/pr41-slice-c4-core.yml
          git add NotchSixty/Audio/Realtime/N60Crossover.h \
                  NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h \
                  NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c \
                  NotchSixty/Audio/AudioIOEngine.swift \
                  NotchSixty/Audio/Routing/AudioRouteConfiguration.swift \
                  NotchSixty/Audio/CoreAudio/CoreAudioError.swift \
                  NotchSixtyTests/RoomCorrectionProjectControllerTests.swift \
                  ci/validate_pr41_same_device_output_map.c
          git commit -m 'PR41 Slice C4: activate true physical speaker buses'
          git push origin HEAD:pr41-active-crossover-matrix-parity
