name: PR32 Provenance Integration

on:
  push:
    branches: [feature/dynamics-parity-closure]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/dynamics-parity-closure
          fetch-depth: 0
      - name: Append PR32 provenance
        run: python3 scripts/pr32_provenance.py
      - name: Validate documentation
        run: git diff --check
      - name: Commit provenance and clean helpers
        run: |
          rm -f scripts/pr32_provenance.py .github/workflows/pr32-provenance-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document PR32 provenance and parity disposition'
          git push origin HEAD:feature/dynamics-parity-closure
