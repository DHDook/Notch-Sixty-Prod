name: PR23 EQ Safety Fix

on:
  push:
    branches:
      - feature/stereo-playback-control-parity
    paths:
      - .github/workflows/pr23-safety-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace("NotchSixty/Audio/Realtime/N60Biquad.h",
                  '#ifdef __cplusplus\nextern "C" {\n#endif\n',
                  '#ifdef __cplusplus\nextern "C" {\n#endif\n\n#define N60_EQ_MIN_GAIN_DB (-12.0)\n#define N60_EQ_MAX_GAIN_DB (12.0)\n')
          replace("NotchSixty/Audio/Realtime/N60Biquad.h",
                  '        || !isfinite(gainDB)\n        || !isfinite(q) || q <= 0.0) {',
                  '        || !isfinite(gainDB)\n        || gainDB < N60_EQ_MIN_GAIN_DB || gainDB > N60_EQ_MAX_GAIN_DB\n        || !isfinite(q) || q <= 0.0) {')

          replace("NotchSixty/Audio/AudioIOEngine.swift",
                  'struct EQBand: Identifiable, Equatable, Sendable {\n    let id: UUID',
                  'struct EQBand: Identifiable, Equatable, Sendable {\n    static let gainRange = -12.0...12.0\n\n    let id: UUID')
          replace("NotchSixty/Audio/AudioIOEngine.swift",
                  '              band.gainDB.isFinite,\n              band.q.isFinite,',
                  '              band.gainDB.isFinite,\n              EQBand.gainRange.contains(band.gainDB),\n              band.q.isFinite,')
          replace("NotchSixty/Audio/StereoPlaybackControl.swift",
                  '                  band.gainDB.isFinite,\n                  band.q.isFinite,',
                  '                  band.gainDB.isFinite,\n                  EQBand.gainRange.contains(band.gainDB),\n                  band.q.isFinite,')

          replace("NotchSixty/ContentView.swift",
                  '            Text("dB").foregroundStyle(.secondary)\n            TextField("Q", value: binding.q, format: .number.precision(.fractionLength(2...3))).frame(width: 65)',
                  '            Text("dB").foregroundStyle(.secondary)\n            Text("±12 max").font(.caption2).foregroundStyle(.secondary)\n            TextField("Q", value: binding.q, format: .number.precision(.fractionLength(2...3))).frame(width: 65)')
          replace("NotchSixty/ContentView.swift",
                  '            set: { updated in try? engine.updateEQBand(updated) }',
                  '            set: { updated in\n                guard updated.gainDB.isFinite else { return }\n                var sanitized = updated\n                sanitized.gainDB = min(max(updated.gainDB, EQBand.gainRange.lowerBound), EQBand.gainRange.upperBound)\n                try? engine.updateEQBand(sanitized)\n            }')
          replace("NotchSixty/ContentView.swift",
                  '    var body: some View {\n        VStack(alignment: .leading, spacing: 14) {',
                  '    var body: some View {\n        ScrollView {\n            VStack(alignment: .leading, spacing: 14) {')
          replace("NotchSixty/ContentView.swift",
                  '            ScrollView {\n                TimelineView(.periodic(from: .now, by: 0.25)) { _ in\n                    diagnosticsView(engine.diagnosticsSnapshot())\n                }\n            }',
                  '            TimelineView(.periodic(from: .now, by: 0.25)) { _ in\n                diagnosticsView(engine.diagnosticsSnapshot())\n            }')
          replace("NotchSixty/ContentView.swift",
                  '        }\n        .padding(20)\n        .frame(minWidth: 880, minHeight: 1_040)\n        .onAppear',
                  '            }\n            .padding(20)\n        }\n        .frame(minWidth: 880, minHeight: 700)\n        .onAppear')

          tests = Path("NotchSixtyTests/StereoPlaybackControlTests.swift")
          text = tests.read_text()
          marker = '\n    func testStereoGraphCompilesUpToSixtyFourBandsPerChannelAt384k() throws {'
          insert = '''

    func testUnsafeEQGainIsRejectedBeforeGraphPublication() {
        for gain in [300.0, -300.0, Double.infinity, -Double.infinity, Double.nan] {
            let configuration = StereoEQConfiguration(
                linkedBands: [EQBand(frequencyHz: 1_000, gainDB: gain, q: 1)]
            )
            XCTAssertThrowsError(
                try configuration.makeGraphSnapshot(
                    sampleRate: 96_000,
                    gainConfiguration: DSPGainConfiguration(),
                    bassManagementConfiguration: BassManagementConfiguration(),
                    playbackConfiguration: PlaybackControlConfiguration()
                ),
                "gain \\(gain) must not reach the realtime graph"
            )
        }
    }

    func testEQGainBoundaryIsAcceptedAndBeyondBoundaryIsRejectedByPortableDesigner() {
        var coefficients = N60BiquadCoefficients()
        XCTAssertTrue(N60BiquadDesign(N60BiquadFilterTypePeaking, 96_000, 1_000, 12, 1, &coefficients))
        XCTAssertTrue(N60BiquadDesign(N60BiquadFilterTypePeaking, 96_000, 1_000, -12, 1, &coefficients))
        XCTAssertFalse(N60BiquadDesign(N60BiquadFilterTypePeaking, 96_000, 1_000, 12.001, 1, &coefficients))
        XCTAssertFalse(N60BiquadDesign(N60BiquadFilterTypePeaking, 96_000, 1_000, -12.001, 1, &coefficients))
        XCTAssertFalse(N60BiquadDesign(N60BiquadFilterTypePeaking, 96_000, 1_000, 300, 1, &coefficients))
    }
'''
          if marker not in text:
              raise SystemExit("test marker not found")
          tests.write_text(text.replace(marker, insert + marker, 1))

          doc = Path("docs/STEREO_PLAYBACK_CONTROL.md")
          doc.write_text(doc.read_text() + '\n## Hardware safety hardening\n\nHardware acceptance exposed that free-form EQ gain entry could accept extreme values such as +300 dB. PR #23 now enforces a -12...+12 dB per-band range in both the Swift product model and the portable C biquad designer, clamps the engineering UI to the same range, and regression-tests extreme and non-finite inputs. This conservative ceiling can be revisited after automatic headroom and true-peak protection land.\n')
          PY

          rm .github/workflows/pr23-safety-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden EQ gain safety after hardware validation'
          git push origin HEAD:feature/stereo-playback-control-parity
