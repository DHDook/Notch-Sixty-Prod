name: PR115 Volume Feedback

on:
  push:
    branches:
      - feature/pr115-volume-feedback
  pull_request:
    branches:
      - feature/pr114-commercial-release-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr115-volume-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve PR114 commercial baseline
        run: |
          set -euo pipefail
          python3 ci/validate_pr114_release_baseline.py
          python3 ci/validate_pr114_privacy_security.py
          python3 ci/validate_pr114_provenance_sbom.py
          python3 ci/validate_pr114_packaging.py
          python3 ci/validate_pr114_commercial_handoff.py --self-test
          python3 ci/validate_pr113b_ab_foundation.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run target UI tests on arm64 Debug build
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/ProductionInformationArchitectureTests \
            test
      - name: Build unsigned arm64 Release app
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/PR115DerivedData" \
            CODE_SIGNING_ALLOWED=NO GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=NotchSixty/Info.plist build

      - name: Run cumulative XCTest regression
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test

      - name: Assemble and verify ad-hoc-signed arm64 hardware-test app
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APP="$RUNNER_TEMP/PR115DerivedData/Build/Products/Release/Notch Sixty.app"
          PACKAGE_ROOT="$RUNNER_TEMP/PR115HardwareTest"
          PACKAGE_APP="$PACKAGE_ROOT/Notch Sixty.app"
          test -d "$SOURCE_APP"
          test -x "$SOURCE_APP/Contents/MacOS/Notch Sixty"
          test "$(lipo -archs "$SOURCE_APP/Contents/MacOS/Notch Sixty")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SOURCE_APP/Contents/Info.plist")" = com.dhdook.NotchSixty
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SOURCE_APP/Contents/Info.plist")" = 1.0.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$SOURCE_APP/Contents/Info.plist")" = 26.0
          grep -q 'libmysofa v1.3.4' "$SOURCE_APP/Contents/Resources/ThirdPartyNotices.txt"
          rm -rf "$PACKAGE_ROOT"
          mkdir -p "$PACKAGE_ROOT"
          cp -R "$SOURCE_APP" "$PACKAGE_APP"
          codesign --force --sign - --timestamp=none \
            --entitlements NotchSixty/NotchSixty.entitlements "$PACKAGE_APP"
          codesign --verify --strict --verbose=2 "$PACKAGE_APP"
          codesign -d --entitlements :- "$PACKAGE_APP" \
            > "$RUNNER_TEMP/pr115-effective-entitlements.plist" 2>/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import os, plistlib
          expected = plistlib.loads(Path("NotchSixty/NotchSixty.entitlements").read_bytes())
          actual = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / "pr115-effective-entitlements.plist").read_bytes())
          if actual != expected:
              raise SystemExit(f"Sandbox entitlement mismatch: {actual!r} != {expected!r}")
          PY

      - name: Package ad-hoc arm64 PR115 hardware-test DMG
        shell: bash
        env:
          PR115_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PR115HardwareTest/Notch Sixty.app"
          STAGE="$RUNNER_TEMP/PR115DMGStage"
          DMG="$RUNNER_TEMP/Notch-Sixty-1.0.0-build-1-PR115-hardware-test-arm64.dmg"
          rm -rf "$STAGE" "$DMG" "$DMG.sha256"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Notch Sixty PR115 Test" \
            -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "PR115_TEST_DMG=$DMG" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dmg = Path(os.environ["RUNNER_TEMP"]) / "Notch-Sixty-1.0.0-build-1-PR115-hardware-test-arm64.dmg"
          manifest = {
              "schemaVersion": 1,
              "milestone": "PR115",
              "purpose": "owner supervised hardware and UX testing only",
              "sourceCommit": os.environ["PR115_SOURCE_HEAD"],
              "version": "1.0.0",
              "buildNumber": "1",
              "minMacOS": "26.0",
              "architecture": "arm64",
              "package": dmg.name,
              "sha256": hashlib.sha256(dmg.read_bytes()).hexdigest(),
              "adHocSigned": True,
              "appSandboxEntitlementsVerified": True,
              "remoteTestSuitePassed": True,
              "physicalHardwareAcceptance": False,
              "appleDeveloperIDSignature": False,
              "notarized": False,
              "appStoreAccepted": False,
              "publicDistributionAuthorized": False,
              "mainMerged": False
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "pr115-hardware-test-manifest.json"
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload PR115 arm64 hardware-test DMG and evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr115-hardware-test-arm64
          path: |
            ${{ env.PR115_TEST_DMG }}
            ${{ env.PR115_TEST_DMG }}.sha256
            ${{ runner.temp }}/pr115-effective-entitlements.plist
            ${{ runner.temp }}/pr115-hardware-test-manifest.json
          if-no-files-found: error
          retention-days: 90
