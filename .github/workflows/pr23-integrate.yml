name: PR23 Integration Helper

on:
  push:
    branches:
      - feature/stereo-playback-control-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply staged integration patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .pr23-integration.patch.gz.b64 || exit 0
          base64 --decode .pr23-integration.patch.gz.b64 | gunzip > /tmp/pr23-integration.patch
          git apply --check /tmp/pr23-integration.patch
          git apply /tmp/pr23-integration.patch
          git rm .pr23-integration.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate stereo playback control plane"
          git push origin HEAD:feature/stereo-playback-control-parity
