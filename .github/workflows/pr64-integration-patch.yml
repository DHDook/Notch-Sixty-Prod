name: PR64 Integration Patch

on:
  push:
    branches:
      - feature/pr64-multichannel-calibration-workflow
    paths:
      - ci/pr64_fix_project_anchor.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr64-multichannel-calibration-workflow
          fetch-depth: 0
      - name: Correct explicit Xcode group anchor
        run: python3 ci/pr64_fix_project_anchor.py
      - name: Apply asserted PR64 integration patch
        run: python3 ci/pr64_apply_integration_patch.py
      - name: Commit production patch and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f ci/pr64_apply_integration_patch.py ci/pr64_fix_project_anchor.py .github/workflows/pr64-integration-patch.yml
          git add -A
          git commit -m "PR64: deploy multichannel calibration through device profiles [pr64-calibration-integrated]"
          git push origin HEAD:feature/pr64-multichannel-calibration-workflow
