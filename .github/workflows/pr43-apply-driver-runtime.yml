name: PR43 Apply Driver Runtime

on:
  push:
    branches:
      - pr43-advanced-acoustic-speaker-optimization
    paths:
      - .github/workflows/pr43-apply-driver-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr43-advanced-acoustic-speaker-optimization
          fetch-depth: 0

      - name: Apply realtime per-driver processing
        run: python3 ci/pr43_apply_driver_runtime.py

      - name: Validate architecture contract
        run: python3 ci/validate_pr43_driver_runtime.py

      - name: Validate realtime kernel numerically
        run: |
          cc -std=c11 -Wall -Wextra -Werror ci/validate_pr43_driver_runtime.c -lm -o /tmp/validate-pr43-driver-runtime
          /tmp/validate-pr43-driver-runtime

      - name: Commit implementation back to PR43
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/Realtime/N60SpeakerDriverProcessing.h
          git add NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.h
          git add NotchSixty/Audio/Realtime/N60RealtimeAudioBridge.c
          git add NotchSixty/Audio/Routing/AudioRouteConfiguration.swift
          git add NotchSixty/Audio/CoreAudio/CoreAudioError.swift
          git add NotchSixty/Audio/AudioIOEngine.swift
          git add ci/validate_pr43_driver_runtime.py
          git add ci/validate_pr43_driver_runtime.c
          git commit -m "PR43: add realtime per-driver speaker processing"
          git push origin HEAD:pr43-advanced-acoustic-speaker-optimization
