name: PR117B FIR Latency Headroom Reference

on:
  push:
    branches:
      - feature/pr117b-fir-latency-headroom-lab
  pull_request:
    branches:
      - feature/pr117a-384khz-crossover-precision
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr117b-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify FIR, group delay, headroom and true-peak analytical cases
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117b_fir_latency_headroom.py \
            --report "$RUNNER_TEMP/pr117b-fir-reference-portable.json" \
            --commit "$N60_COMMIT"
          python3 ci/validate_pr117a_crossover_precision.py --source-only
      - uses: actions/upload-artifact@v4
        with:
          name: pr117b-fir-reference-portable
          path: ${{ runner.temp }}/pr117b-fir-reference-portable.json
          retention-days: 30
          if-no-files-found: error

  apple-clang:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify same reference using Apple Clang
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117b_fir_latency_headroom.py \
            --report "$RUNNER_TEMP/pr117b-fir-reference-macos.json" \
            --commit "$N60_COMMIT"
          python3 ci/validate_pr117a_crossover_precision.py --source-only
          python3 ci/validate_pr112a_hardware_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr117b-fir-reference-macos
          path: ${{ runner.temp }}/pr117b-fir-reference-macos.json
          retention-days: 30
          if-no-files-found: error
