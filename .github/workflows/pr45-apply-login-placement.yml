name: PR45 Apply Login Placement

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-apply-login-placement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening

      - name: Move Launch at Login to Settings only
        run: python3 ci/pr45_remove_login_toggle_from_tray.py

      - name: Commit corrected app shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/NotchSixtyApp.swift
          git diff --cached --check
          git commit -m "PR45: keep Launch at Login in app settings"
          git push origin HEAD:pr45-v1-release-hardening
