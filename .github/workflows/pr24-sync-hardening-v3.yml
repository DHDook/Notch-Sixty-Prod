name: PR24 Sync Hardening V3

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-sync-hardening-v3.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add external-sync regression and minimal validation UI
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          # Minimal engineering-only controls for hardware acceptance.
          view = Path('NotchSixty/ContentView.swift')
          text = view.read_text()
          binding_marker = '''    private var balanceBinding: Binding<Double> {
                  Binding(get: { engine.playbackControlConfiguration.balance }, set: { try? engine.setChannelBalance($0) })
              }
          '''
          binding_addition = binding_marker + '''
              private var masterVolumeBinding: Binding<Double> {
                  Binding(get: { engine.masterVolumeConfiguration.level }, set: { try? engine.setMasterVolumeLevel($0) })
              }

              private var masterMuteBinding: Binding<Bool> {
                  Binding(get: { engine.masterVolumeConfiguration.muted }, set: { try? engine.setMasterMuted($0) })
              }
          '''
          if binding_marker not in text:
              raise SystemExit('balance binding marker not found')
          text = text.replace(binding_marker, binding_addition, 1)

          pattern = r'(?m)^(\s*)HStack\(spacing: 12\) \{\n\1    Text\("Balance"\)\.frame\(width: 90, alignment: \.leading\)'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit('balance UI block not found')
          indent = match.group(1)
          master_ui = '\n'.join([
              f'{indent}HStack(spacing: 12) {{',
              f'{indent}    Text("Master").frame(width: 90, alignment: .leading)',
              f'{indent}    Slider(value: masterVolumeBinding, in: MasterVolumeConfiguration.levelRange, step: 0.01)',
              f'{indent}    Text("\\(Int((engine.masterVolumeConfiguration.level * 100).rounded()))%")',
              f'{indent}        .monospacedDigit()',
              f'{indent}        .frame(width: 48, alignment: .trailing)',
              f'{indent}    Toggle("Mute", isOn: masterMuteBinding).toggleStyle(.switch)',
              f'{indent}    Text(engine.masterVolumeCapabilities.controlMode == .device ? "Device" : "Software DSP")',
              f'{indent}        .font(.caption)',
              f'{indent}        .foregroundStyle(.secondary)',
              f'{indent}        .frame(width: 95, alignment: .leading)',
              f'{indent}}}',
              '',
          ])
          text = text[:match.start()] + master_ui + text[match.start():]
          view.write_text(text)

          tests = Path('NotchSixtyTests/StereoPlaybackControlTests.swift')
          text = tests.read_text()
          if 'import CoreAudio\n' not in text:
              text = text.replace('import XCTest\n', 'import XCTest\nimport CoreAudio\n', 1)
          class_end = text.rfind('\n}')
          if class_end < 0:
              raise SystemExit('test class end not found')

          new_test = '''

              @MainActor
              func testExternalDeviceVolumeChangeUpdatesEngineWithoutWriteBack() throws {
                  let device = AudioOutputDevice(
                      deviceID: 77,
                      uid: "test-device",
                      name: "Test Device",
                      nominalSampleRate: 96_000,
                      availableSampleRateRanges: [AudioSampleRateRange(minimum: 44_100, maximum: 192_000)]
                  )
                  let controller = PR24FakeMasterVolumeController(
                      snapshot: MasterVolumeDeviceSnapshot(
                          capabilities: MasterVolumeDeviceCapabilities(
                              volumeReadable: true,
                              volumeWritable: true,
                              muteReadable: true,
                              muteWritable: true
                          ),
                          level: 0.65,
                          muted: false
                      )
                  )
                  let engine = AudioIOEngine(
                      deviceCatalog: PR24FakeOutputCatalog(devices: [device]),
                      masterVolumeController: controller
                  )

                  _ = try engine.refreshOutputDevices()
                  try engine.selectOutput(uid: device.uid)
                  XCTAssertEqual(engine.masterVolumeConfiguration.level, 0.65, accuracy: 0.000_001)
                  XCTAssertFalse(engine.masterVolumeConfiguration.muted)
                  XCTAssertEqual(controller.monitoredDeviceID, device.deviceID)
                  XCTAssertEqual(controller.setVolumeCalls, 0)
                  XCTAssertEqual(controller.setMuteCalls, 0)

                  controller.snapshot.level = 0.31
                  controller.snapshot.muted = true
                  controller.fireExternalChange()

                  XCTAssertEqual(engine.masterVolumeConfiguration.level, 0.31, accuracy: 0.000_001)
                  XCTAssertTrue(engine.masterVolumeConfiguration.muted)
                  XCTAssertEqual(controller.setVolumeCalls, 0, "external sync must not write volume back")
                  XCTAssertEqual(controller.setMuteCalls, 0, "external sync must not write mute back")

                  try engine.setMasterVolumeLevel(0.72)
                  XCTAssertEqual(controller.setVolumeCalls, 1)
                  XCTAssertEqual(controller.lastSetVolume, 0.72, accuracy: 0.000_001)
                  XCTAssertEqual(controller.setMuteCalls, 0)
              }
          '''
          text = text[:class_end] + new_test + text[class_end:]
          text += '''

          private struct PR24FakeOutputCatalog: OutputDeviceCataloging {
              let devices: [AudioOutputDevice]
              func outputDevices() throws -> [AudioOutputDevice] { devices }
          }

          private final class PR24FakeMasterVolumeController: MasterVolumeDeviceControlling {
              var onExternalChange: (() -> Void)?
              var snapshot: MasterVolumeDeviceSnapshot
              private(set) var monitoredDeviceID: AudioDeviceID?
              private(set) var setVolumeCalls = 0
              private(set) var setMuteCalls = 0
              private(set) var lastSetVolume: Double = 0
              private(set) var lastSetMuted = false

              init(snapshot: MasterVolumeDeviceSnapshot) { self.snapshot = snapshot }
              func inspect(deviceID: AudioDeviceID) throws -> MasterVolumeDeviceSnapshot { snapshot }
              func setVolume(_ level: Double, deviceID: AudioDeviceID) throws {
                  setVolumeCalls += 1
                  lastSetVolume = level
              }
              func setMuted(_ muted: Bool, deviceID: AudioDeviceID) throws {
                  setMuteCalls += 1
                  lastSetMuted = muted
              }
              func monitor(deviceID: AudioDeviceID?) throws { monitoredDeviceID = deviceID }
              func stopMonitoring() { monitoredDeviceID = nil }
              func fireExternalChange() { onExternalChange?() }
          }
          '''
          tests.write_text(text)
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit hardening and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr24-sync-hardening.yml \
            .github/workflows/pr24-sync-hardening-v2.yml \
            .github/workflows/pr24-sync-hardening-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden master volume synchronization'
          git push origin HEAD:feature/master-volume-mute-sync
