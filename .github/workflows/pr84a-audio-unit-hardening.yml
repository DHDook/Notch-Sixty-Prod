name: PR84A Audio Unit Hardening

on:
  push:
    branches:
      - feature/pr84a-au-hardening
  pull_request:
    branches:
      - feature/pr83-plugin-rack-ux
  workflow_dispatch:

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR84A hardening contract
        run: python3 ci/validate_pr84a_audio_unit_hardening.py
      - name: Validate inherited PR83 Plug-in Rack UX
        run: python3 ci/validate_pr83_plugin_rack_ux.py
      - name: Validate inherited PR82 mutation architecture
        run: python3 ci/validate_pr82_live_audio_unit_rack_mutation.py
      - name: Run inherited lock-free rack exchange simulator
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr82_audio_unit_rack_exchange.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr84a-rack-exchange
          /tmp/pr84a-rack-exchange
      - name: Prove PR84A lock-free stage fault gate
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr84a_audio_unit_stage_fault_gate.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr84a-stage-fault-gate
          /tmp/pr84a-stage-fault-gate

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR84A hardening contract
        run: python3 ci/validate_pr84a_audio_unit_hardening.py
      - name: Validate inherited PR83 Plug-in Rack UX
        run: python3 ci/validate_pr83_plugin_rack_ux.py
      - name: Validate inherited PR82 mutation architecture
        run: python3 ci/validate_pr82_live_audio_unit_rack_mutation.py
      - name: Run inherited lock-free rack exchange simulator
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr82_audio_unit_rack_exchange.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr84a-rack-exchange
          /tmp/pr84a-rack-exchange
      - name: Prove PR84A lock-free stage fault gate on arm64
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr84a_audio_unit_stage_fault_gate.c \
            NotchSixty/Audio/Realtime/N60AudioUnitRackExchange.c \
            -lm -o /tmp/pr84a-stage-fault-gate
          /tmp/pr84a-stage-fault-gate
      - name: Build arm64 app with AU hardening
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build
      - name: Run retained host-foundation tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitHostFoundationTests \
            test
      - name: Run PR84A offline abuse tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitOfflinePreparationTests \
            test
      - name: Run PR84A live runtime hardening tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitLiveRackRuntimeTests \
            test
      - name: Run PR84A transaction fault tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/AudioUnitRackMutationTests \
            test
      - name: Run retained XCTest suite
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test
