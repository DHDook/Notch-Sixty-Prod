name: PR43 Finish Surface Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-surface:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Apply PR43 finish-surface fixup
        run: python3 ci/pr43_finish_surface_fixup.py

      - name: Apply PR43 production surface
        run: python3 ci/pr43_finish_surface_patch.py

      - name: Validate PR43 closure surface
        run: python3 ci/validate_pr43_closure.py

      - name: Build Debug app
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Run XCTest
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test
