name: PR78 UI Information Architecture

on:
  push:
    branches:
      - feature/pr78-ui-information-architecture
  pull_request:
    branches:
      - feature/pr77-live-room-treatment-integration
  workflow_dispatch:

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate inherited PR77 hardware-gated live integration
        run: python3 ci/validate_pr77_live_room_treatment.py
      - name: Run inherited PR77 physical-output simulation
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr77_live_room_treatment.c \
            -lm -o /tmp/pr77-live-room-treatment
          /tmp/pr77-live-room-treatment
      - name: Validate PR78 UI information architecture
        run: python3 ci/validate_pr78_ui_information_architecture.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR78 UI information architecture
        run: python3 ci/validate_pr78_ui_information_architecture.py
      - name: Build arm64 app with production UI integration
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            build
      - name: Run PR78 navigation tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/ProductionInformationArchitectureTests \
            test
      - name: Run retained XCTest suite
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test
