name: PR65 Headphone Product Patch

on:
  push:
    branches:
      - feature/pr65-headphone-binaural-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr65-headphone-binaural-integration
          fetch-depth: 0
      - name: Apply asserted product integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Core Audio session: expose stopped-only hardware-stage configuration.
          p = "NotchSixty/Audio/CoreAudio/CoreAudioError.swift"
          replace_once(p,
              '    case speakerDriverProcessingConfigurationFailed\n',
              '    case speakerDriverProcessingConfigurationFailed\n    case headphoneDSPConfigurationFailed\n')
          replace_once(p,
              '        case .speakerDriverProcessingConfigurationFailed:\n            return "Unable to configure immutable per-driver speaker processing before audio callbacks start."\n',
              '        case .speakerDriverProcessingConfigurationFailed:\n            return "Unable to configure immutable per-driver speaker processing before audio callbacks start."\n        case .headphoneDSPConfigurationFailed:\n            return "Unable to configure the immutable headphone correction stage before audio callbacks start."\n')
          replace_once(p,
              '    func publishDSPGraph(_ snapshot: N60DSPGraphSnapshot) throws {\n',
              '    func configureHeadphoneDSP(_ snapshot: N60HeadphoneDSPSnapshot?) throws {\n        guard let bridge, !isOutputStarted, !isCaptureStarted else {\n            throw CoreAudioTransportError.headphoneDSPConfigurationFailed\n        }\n        if let snapshot {\n            guard N60RealtimeAudioBridgeConfigureHeadphoneDSP(bridge, snapshot) else {\n                throw CoreAudioTransportError.headphoneDSPConfigurationFailed\n            }\n        } else {\n            N60RealtimeAudioBridgeClearHeadphoneDSP(bridge)\n        }\n    }\n\n    func publishDSPGraph(_ snapshot: N60DSPGraphSnapshot) throws {\n')

          # Engine ownership + conflict policy + live activation.
          p = "NotchSixty/Audio/AudioIOEngine.swift"
          replace_once(p,
              '    @Published private(set) var outputDeviceProfileConfiguration: OutputDeviceProfileConfiguration?\n    @Published private(set) var speakerDriverProcessingConfiguration = SpeakerDriverProcessingConfiguration()\n',
              '    @Published private(set) var outputDeviceProfileConfiguration: OutputDeviceProfileConfiguration?\n    @Published private(set) var headphoneDeviceProfileConfiguration: HeadphoneDeviceProfileConfiguration?\n    @Published private(set) var speakerDriverProcessingConfiguration = SpeakerDriverProcessingConfiguration()\n')
          replace_once(p,
              '        if configuration?.enabled == true, outputDeviceProfileConfiguration?.enabled == true {\n            throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n',
              '        if configuration?.enabled == true, outputDeviceProfileConfiguration?.enabled == true {\n            throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n        if configuration?.enabled == true, headphoneDeviceProfileConfiguration?.enabled == true {\n            throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n')
          replace_once(p,
              '        if configuration?.enabled == true {\n            try configuration?.validateStructure(\n                bassManagementEnabled: bassManagementConfiguration.enabled\n            )\n            if multiOutputRoutingConfiguration?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n        }\n',
              '        if configuration?.enabled == true {\n            try configuration?.validateStructure(\n                bassManagementEnabled: bassManagementConfiguration.enabled\n            )\n            if multiOutputRoutingConfiguration?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n            if headphoneDeviceProfileConfiguration?.enabled == true {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n        }\n')
          replace_once(p,
              '    func replaceSpeakerDriverProcessingConfiguration(\n',
              '    func replaceHeadphoneDeviceProfileConfiguration(\n        _ configuration: HeadphoneDeviceProfileConfiguration?\n    ) throws {\n        if let configuration, configuration.enabled {\n            if outputDeviceProfileConfiguration?.enabled == true {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n            if multiOutputRoutingConfiguration?.enabled == true {\n                throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n            if !speakerDriverProcessingConfiguration.isNeutral {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("per-driver speaker processing")\n            }\n            if bassManagementConfiguration.enabled {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("speaker bass management")\n            }\n            if roomCorrectionConfiguration.enabled {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("speaker room correction")\n            }\n            if speakerIRConfiguration.enabled {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("Speaker IR")\n            }\n            if let output = selectedOutputDevice {\n                try configuration.validateStructure(sampleRate: output.nominalSampleRate)\n            }\n        }\n        guard lifecycle.state == .idle || configuration == headphoneDeviceProfileConfiguration else {\n            throw HeadphoneDeviceProfileError.configurationChangeRequiresRestart\n        }\n        headphoneDeviceProfileConfiguration = configuration\n        lastErrorDescription = nil\n    }\n\n    func replaceSpeakerDriverProcessingConfiguration(\n')
          replace_once(p,
              '    private func buildTransport(output: AudioOutputDevice) throws {\n        if outputDeviceProfileConfiguration?.enabled == true {\n            try buildNChannelTransport(output: output)\n            return\n        }\n        try buildStereoTransport(output: output)\n    }\n',
              '    private func buildTransport(output: AudioOutputDevice) throws {\n        if let headphone = headphoneDeviceProfileConfiguration, headphone.enabled {\n            if outputDeviceProfileConfiguration?.enabled == true {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n            guard headphone.spatialMode == .stereo else {\n                throw HeadphoneDeviceProfileError.binauralRuntimeUnavailable\n            }\n            try buildStereoTransport(output: output)\n            return\n        }\n        if outputDeviceProfileConfiguration?.enabled == true {\n            try buildNChannelTransport(output: output)\n            return\n        }\n        try buildStereoTransport(output: output)\n    }\n')
          replace_once(p,
              '    private func buildStereoTransport(output: AudioOutputDevice) throws {\n        let sameDeviceOutputPlan: SameDeviceOutputRoutePlan?\n',
              '    private func buildStereoTransport(output: AudioOutputDevice) throws {\n        var headphoneSnapshot: N60HeadphoneDSPSnapshot?\n        if let headphone = headphoneDeviceProfileConfiguration, headphone.enabled {\n            _ = try headphone.validateForActivation(\n                availableDevices: outputDevices,\n                selectedOutputUID: output.uid,\n                sampleRate: output.nominalSampleRate\n            )\n            guard headphone.spatialMode == .stereo else {\n                throw HeadphoneDeviceProfileError.binauralRuntimeUnavailable\n            }\n            guard multiOutputRoutingConfiguration?.enabled != true else {\n                throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n            guard outputDeviceProfileConfiguration?.enabled != true else {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n            guard speakerDriverProcessingConfiguration.isNeutral else {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("per-driver speaker processing")\n            }\n            guard !bassManagementConfiguration.enabled else {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("speaker bass management")\n            }\n            guard !roomCorrectionConfiguration.enabled else {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("speaker room correction")\n            }\n            guard !speakerIRConfiguration.enabled else {\n                throw HeadphoneDeviceProfileError.speakerProcessingConflict("Speaker IR")\n            }\n            headphoneSnapshot = try headphone.makeRealtimeSnapshot(sampleRate: output.nominalSampleRate)\n        }\n\n        let sameDeviceOutputPlan: SameDeviceOutputRoutePlan?\n')
          replace_once(p,
              '        activeEQFIRProgram = nil\n        nextEQFIRProgramSlot = 0\n',
              '        try session.configureHeadphoneDSP(headphoneSnapshot)\n        activeEQFIRProgram = nil\n        nextEQFIRProgramSlot = 0\n')

          # Add product-model error cases used by activation policy.
          p = "NotchSixty/Audio/Routing/HeadphoneDeviceProfileConfiguration.swift"
          replace_once(p,
              '    case legacyPhysicalRoutingConflict\n    case configurationChangeRequiresRestart\n',
              '    case legacyPhysicalRoutingConflict\n    case speakerProcessingConflict(String)\n    case binauralRuntimeUnavailable\n    case configurationChangeRequiresRestart\n')
          replace_once(p,
              '        case .legacyPhysicalRoutingConflict:\n            return "Disable legacy physical speaker routing before enabling the Headphone Device Profile."\n        case .configurationChangeRequiresRestart:\n',
              '        case .legacyPhysicalRoutingConflict:\n            return "Disable legacy physical speaker routing before enabling the Headphone Device Profile."\n        case .speakerProcessingConflict(let stage):\n            return "Disable \\(stage) before enabling the Headphone Device Profile."\n        case .binauralRuntimeUnavailable:\n            return "Virtual Speakers is not available until a prepared binaural profile is activated by the spatial runtime."\n        case .configurationChangeRequiresRestart:\n')

          # Playback System persistence remains schema-v1 compatible via optional field.
          p = "NotchSixty/State/ProductProfiles.swift"
          replace_once(p,
              '    var outputDeviceProfile: OutputDeviceProfileConfiguration?\n    var speakerDriverProcessing: SpeakerDriverProcessingConfiguration?\n',
              '    var outputDeviceProfile: OutputDeviceProfileConfiguration?\n    var headphoneDeviceProfile: HeadphoneDeviceProfileConfiguration?\n    var speakerDriverProcessing: SpeakerDriverProcessingConfiguration?\n')
          replace_once(p,
              '        outputDeviceProfile: OutputDeviceProfileConfiguration? = nil,\n        speakerDriverProcessing: SpeakerDriverProcessingConfiguration? = nil,\n',
              '        outputDeviceProfile: OutputDeviceProfileConfiguration? = nil,\n        headphoneDeviceProfile: HeadphoneDeviceProfileConfiguration? = nil,\n        speakerDriverProcessing: SpeakerDriverProcessingConfiguration? = nil,\n')
          replace_once(p,
              '        self.outputDeviceProfile = outputDeviceProfile\n        self.speakerDriverProcessing = speakerDriverProcessing\n',
              '        self.outputDeviceProfile = outputDeviceProfile\n        self.headphoneDeviceProfile = headphoneDeviceProfile\n        self.speakerDriverProcessing = speakerDriverProcessing\n')
          replace_once(p,
              '    var selectedSystemOutputDeviceProfile: OutputDeviceProfileConfiguration? {\n        selectedSystemProfile?.state.outputDeviceProfile\n    }\n',
              '    var selectedSystemOutputDeviceProfile: OutputDeviceProfileConfiguration? {\n        selectedSystemProfile?.state.outputDeviceProfile\n    }\n    var selectedSystemHeadphoneDeviceProfile: HeadphoneDeviceProfileConfiguration? {\n        selectedSystemProfile?.state.headphoneDeviceProfile\n    }\n')
          replace_once(p,
              '        if configuration?.enabled == true,\n           systemProfiles[index].state.outputDeviceProfile?.enabled == true {\n            throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n',
              '        if configuration?.enabled == true,\n           systemProfiles[index].state.outputDeviceProfile?.enabled == true {\n            throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n        if configuration?.enabled == true,\n           systemProfiles[index].state.headphoneDeviceProfile?.enabled == true {\n            throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n        }\n')
          replace_once(p,
              '            if systemProfiles[index].state.outputRouting?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n',
              '            if systemProfiles[index].state.outputRouting?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n            if systemProfiles[index].state.headphoneDeviceProfile?.enabled == true {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n')
          replace_once(p,
              '    func replaceSelectedSystemSpeakerDriverProcessing(\n',
              '    func replaceSelectedSystemHeadphoneDeviceProfile(\n        _ configuration: HeadphoneDeviceProfileConfiguration?\n    ) throws {\n        guard let selectedSystemProfileID,\n              let index = systemProfiles.firstIndex(where: { $0.id == selectedSystemProfileID }) else {\n            throw ProductProfileError.selectedSystemProfileRequired\n        }\n        if configuration?.enabled == true {\n            if systemProfiles[index].state.outputDeviceProfile?.enabled == true {\n                throw HeadphoneDeviceProfileError.speakerProfileConflict\n            }\n            if systemProfiles[index].state.outputRouting?.enabled == true {\n                throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n        }\n        let previousEngineConfiguration = engine.headphoneDeviceProfileConfiguration\n        let previousState = systemProfiles[index].state\n        do {\n            try engine.replaceHeadphoneDeviceProfileConfiguration(configuration)\n            systemProfiles[index].state.headphoneDeviceProfile = configuration\n            try persistThrowing()\n            lastErrorDescription = nil\n        } catch {\n            systemProfiles[index].state = previousState\n            try? engine.replaceHeadphoneDeviceProfileConfiguration(previousEngineConfiguration)\n            lastErrorDescription = error.localizedDescription\n            throw error\n        }\n    }\n\n    func replaceSelectedSystemSpeakerDriverProcessing(\n')
          replace_once(p,
              '            outputDeviceProfile: engine.outputDeviceProfileConfiguration,\n            speakerDriverProcessing: engine.speakerDriverProcessingConfiguration.isNeutral\n',
              '            outputDeviceProfile: engine.outputDeviceProfileConfiguration,\n            headphoneDeviceProfile: engine.headphoneDeviceProfileConfiguration,\n            speakerDriverProcessing: engine.speakerDriverProcessingConfiguration.isNeutral\n')
          replace_once(p,
              '            if state.outputRouting?.enabled == true, state.outputDeviceProfile?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n',
              '            if state.outputRouting?.enabled == true, state.outputDeviceProfile?.enabled == true {\n                throw OutputDeviceProfileError.legacyPhysicalRoutingConflict\n            }\n            if state.headphoneDeviceProfile?.enabled == true {\n                if state.outputRouting?.enabled == true {\n                    throw HeadphoneDeviceProfileError.legacyPhysicalRoutingConflict\n                }\n                if state.outputDeviceProfile?.enabled == true {\n                    throw HeadphoneDeviceProfileError.speakerProfileConflict\n                }\n            }\n')
          replace_once(p,
              '            try engine.replaceOutputDeviceProfileConfiguration(nil)\n            try engine.replaceMultiOutputRoutingConfiguration(state.outputRouting)\n',
              '            try engine.replaceHeadphoneDeviceProfileConfiguration(nil)\n            try engine.replaceOutputDeviceProfileConfiguration(nil)\n            try engine.replaceMultiOutputRoutingConfiguration(state.outputRouting)\n')
          replace_once(p,
              '            try engine.replaceSpeakerIRConfiguration(state.speakerIR)\n        } catch {\n',
              '            try engine.replaceSpeakerIRConfiguration(state.speakerIR)\n            try engine.replaceHeadphoneDeviceProfileConfiguration(state.headphoneDeviceProfile)\n        } catch {\n')
          replace_once(p,
              '            try? engine.replaceOutputDeviceProfileConfiguration(nil)\n            try? engine.replaceMultiOutputRoutingConfiguration(previous.outputRouting)\n',
              '            try? engine.replaceHeadphoneDeviceProfileConfiguration(nil)\n            try? engine.replaceOutputDeviceProfileConfiguration(nil)\n            try? engine.replaceMultiOutputRoutingConfiguration(previous.outputRouting)\n')
          replace_once(p,
              '            try? engine.replaceSpeakerIRConfiguration(previous.speakerIR)\n            throw error\n',
              '            try? engine.replaceSpeakerIRConfiguration(previous.speakerIR)\n            try? engine.replaceHeadphoneDeviceProfileConfiguration(previous.headphoneDeviceProfile)\n            throw error\n')

          # Xcode target membership for the new Swift model.
          p = "NotchSixty.xcodeproj/project.pbxproj"
          replace_once(p,
              '\t\tF62000000000000000000001 /* OutputDeviceProfileConfiguration.swift in Sources */ = {isa = PBXBuildFile; fileRef = F62000000000000000000011 /* OutputDeviceProfileConfiguration.swift */; };\n',
              '\t\tF62000000000000000000001 /* OutputDeviceProfileConfiguration.swift in Sources */ = {isa = PBXBuildFile; fileRef = F62000000000000000000011 /* OutputDeviceProfileConfiguration.swift */; };\n\t\tF65000000000000000000001 /* HeadphoneDeviceProfileConfiguration.swift in Sources */ = {isa = PBXBuildFile; fileRef = F65000000000000000000011 /* HeadphoneDeviceProfileConfiguration.swift */; };\n')
          replace_once(p,
              '\t\tA30000000000000000000020 /* N60RealtimeAudioBridge.c */ = {isa = PBXFileReference;',
              '\t\tF65000000000000000000011 /* HeadphoneDeviceProfileConfiguration.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = HeadphoneDeviceProfileConfiguration.swift; sourceTree = "<group>"; };\n\t\tA30000000000000000000020 /* N60RealtimeAudioBridge.c */ = {isa = PBXFileReference;')
          replace_once(p,
              'A20000000000000000000024 /* AudioRouteConfiguration.swift */, F62000000000000000000011 /* OutputDeviceProfileConfiguration.swift */, F64000000000000000000011 /* OutputDeviceCalibration.swift */,',
              'A20000000000000000000024 /* AudioRouteConfiguration.swift */, F62000000000000000000011 /* OutputDeviceProfileConfiguration.swift */, F65000000000000000000011 /* HeadphoneDeviceProfileConfiguration.swift */, F64000000000000000000011 /* OutputDeviceCalibration.swift */,')
          replace_once(p,
              '\t\t\t\tF62000000000000000000001 /* OutputDeviceProfileConfiguration.swift in Sources */,\n',
              '\t\t\t\tF62000000000000000000001 /* OutputDeviceProfileConfiguration.swift in Sources */,\n\t\t\t\tF65000000000000000000001 /* HeadphoneDeviceProfileConfiguration.swift in Sources */,\n')

          Path('.github/workflows/pr65-headphone-product-patch.yml').unlink()
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PR65: wire headphone device profiles into stereo transport"
          git push origin HEAD:feature/pr65-headphone-binaural-integration
