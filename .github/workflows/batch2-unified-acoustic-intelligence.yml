name: Batch 2 Unified Acoustic Intelligence

on:
  # Exactly one explicitly marked push can run the expensive final
  # integration even if the GitHub pull-request head index lags the ref.
  # Ordinary commits have no push-triggered jobs.
  push:
    branches:
      - feature/batch2-unified-acoustic-intelligence
  pull_request:
    branches:
      - feature/pr117d-real-sofa-import-384khz-fixtures
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch2-acoustic-${{ github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true

jobs:
  fast-contract:
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[integration-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify coherent read-only acoustic evidence boundaries
        run: |
          set -euo pipefail
          python3 ci/validate_batch2_unified_acoustics.py
          python3 ci/validate_pr109_cross_feature_contracts.py
          python3 ci/validate_pr112a_hardware_acceptance.py

  integration-apple-silicon:
    # Run only at an explicit label/dispatch/marked-commit checkpoint,
    # not on ordinary commits. Exact branch SHA is verified in GitHub Actions.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'integration-ci') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[integration-ci]'))
    needs: fast-contract
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile arm64 Release application
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj \
            -scheme NotchSixty -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=NO \
            INFOPLIST_FILE=NotchSixty/Info.plist build
      - name: Run full Debug XCTest suite including unified acoustic advisory
        run: |
          set -euo pipefail
          xcodebuild -project NotchSixty.xcodeproj \
            -scheme NotchSixty -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - name: Preserve PR112 physical acceptance boundary
        run: python3 ci/validate_pr112a_hardware_acceptance.py
