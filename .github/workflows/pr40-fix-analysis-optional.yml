name: PR40 Fix Analysis Optional

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-fix-analysis-optional.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Add explicit optional type for SNR expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty/Audio/RoomCorrectionMeasurementAnalyzer.swift')
          text = path.read_text()
          old = '        let snr = if let signalLevel, let noiseFloor {'
          new = '        let snr: Double? = if let signalLevel, let noiseFloor {'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Unexpected SNR expression count')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/RoomCorrectionMeasurementAnalyzer.swift
          git rm .github/workflows/pr40-fix-analysis-optional.yml
          git commit -m "PR40 Slice D: fix optional SNR inference"
          git push origin HEAD:pr40-room-correction-production-workflow
