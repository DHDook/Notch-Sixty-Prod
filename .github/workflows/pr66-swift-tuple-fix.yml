name: PR66 Swift Tuple Fix

on:
  push:
    branches:
      - feature/pr66-head-tracking-spatial-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply fixed-array compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("NotchSixty/Audio/Routing/BinauralProfileAsset.swift")
          s = p.read_text()
          old = """        for channel in 0..<layout.roles.count {\n            let target = descriptor.sources[channel]\n            guard let measurement = nearestMeasurement(\n"""
          new = """        for channel in 0..<layout.roles.count {\n            let target: N60BinauralSourcePosition = withUnsafePointer(\n                to: &descriptor.sources\n            ) { tuplePointer in\n                tuplePointer.withMemoryRebound(\n                    to: N60BinauralSourcePosition.self,\n                    capacity: Int(N60_MAX_PROGRAM_CHANNELS)\n                ) { sourcePointer in\n                    sourcePointer[channel]\n                }\n            }\n            guard let measurement = nearestMeasurement(\n"""
          count = s.count(old)
          if count == 0 and "withMemoryRebound" in s:
              print("Fix already applied")
              raise SystemExit(0)
          if count != 1:
              raise SystemExit(f"expected one tuple indexing anchor, got {count}")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/Routing/BinauralProfileAsset.swift
          git commit -m "PR66: fix Swift access to C fixed source array"
          git push
