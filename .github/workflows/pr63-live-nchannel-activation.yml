name: PR63 Live N-Channel Activation

on:
  pull_request:
    branches:
      - feature/pr62-output-device-profiles
      - main

permissions:
  contents: read

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate live N-channel activation architecture
        run: python3 ci/validate_pr63_live_activation.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate live N-channel activation architecture
        run: python3 ci/validate_pr63_live_activation.py
      - name: Build arm64 app with selectable N-channel transport
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build
