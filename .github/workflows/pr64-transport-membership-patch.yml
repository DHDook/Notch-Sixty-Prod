name: PR64 Targeted Transport Membership Patch

on:
  push:
    branches:
      - feature/pr64-multichannel-calibration-workflow
    paths:
      - ci/pr64_add_targeted_transport_to_project.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr64-multichannel-calibration-workflow
          fetch-depth: 0
      - name: Add targeted transport to explicit Xcode target
        run: python3 ci/pr64_add_targeted_transport_to_project.py
      - name: Commit membership and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f ci/pr64_add_targeted_transport_to_project.py .github/workflows/pr64-transport-membership-patch.yml
          git add NotchSixty.xcodeproj/project.pbxproj
          git commit -m "PR64: compile targeted multichannel calibration transport"
          git push origin HEAD:feature/pr64-multichannel-calibration-workflow
