name: PR41 Crossover Ownership Patch

on:
  push:
    branches:
      - pr41-active-crossover-matrix-parity
    paths:
      - .github/scripts/pr41_slice_a_b.py
      - .github/workflows/pr41-slice-a-b.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: xcode-27
    steps:
      - name: Check out PR41 branch
        uses: actions/checkout@v7
        with:
          ref: pr41-active-crossover-matrix-parity
          fetch-depth: 0

      - name: Apply PR41 Slice A/B patch
        run: python3 .github/scripts/pr41_slice_a_b.py

      - name: Validate project and focused tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project NotchSixty.xcodeproj >/dev/null
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:NotchSixtyTests/RoomCorrectionProjectControllerTests \
            -only-testing:NotchSixtyTests/StereoPlaybackControlTests \
            test

      - name: Validate ownership/UI patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'func replaceSelectedSystemBassManagement' NotchSixty/State/ProductProfiles.swift
          grep -q 'ProductionActiveCrossoverView(engine: engine, profiles: product.profiles)' NotchSixty/UI/ProductionRootView.swift
          grep -q 'try profiles.replaceSelectedSystemBassManagement(updated)' NotchSixty/UI/ProductionRootView.swift
          grep -q 'Sub Phase Alignment' NotchSixty/UI/ProductionRootView.swift
          grep -q 'Verification Monitor' NotchSixty/UI/ProductionRootView.swift
          grep -q 'testProfileBassManagementChangesOnlyPlaybackSystemAndRestoresWithRoomCorrectionIntact' NotchSixtyTests/RoomCorrectionProjectControllerTests.swift
          grep -q 'testCrossoverPreservesRoomCorrectionProgramIdentityLatencyAndRawBypass' NotchSixtyTests/StereoPlaybackControlTests.swift

      - name: Commit patch and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/pr41_slice_a_b.py .github/workflows/pr41-slice-a-b.yml
          git add NotchSixty/State/ProductProfiles.swift \
                  NotchSixty/UI/ProductionRootView.swift \
                  NotchSixtyTests/RoomCorrectionProjectControllerTests.swift \
                  NotchSixtyTests/StereoPlaybackControlTests.swift
          git commit -m 'PR41 Slice A/B: persist and complete crossover controls'
          git push origin HEAD:pr41-active-crossover-matrix-parity
