name: PR32 Slice 1 Integration

on:
  push:
    branches: [feature/dynamics-parity-closure]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/dynamics-parity-closure
          fetch-depth: 0
      - name: Apply PR32 Slice 1
        run: python3 scripts/pr32_slice1.py
      - name: Apply diagnostics compatibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('NotchSixty/Audio/Realtime/N60RenderKernel.c')
          s = p.read_text()
          old = 'diagnostics.multibandTopology = context.snapshot.dynamics.multibandCompressor.topology;'
          new = 'diagnostics.multibandTopology = context.snapshot.dynamics.multibandCompressor.lowTopology;'
          if old not in s:
              raise SystemExit('multiband diagnostics reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run full test suite
        run: |
          set -o pipefail
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Commit PR32 Slice 1 and clean helpers
        run: |
          rm -f scripts/pr32_slice1.py .github/workflows/pr32-slice1-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close advanced dynamics control-depth gaps'
          git push origin HEAD:feature/dynamics-parity-closure
