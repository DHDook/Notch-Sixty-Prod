name: PR68 Dashboard VU + Volume Polish

on:
  push:
    branches:
      - feature/pr68-vu-volume-polish
  pull_request:
    branches:
      - feature/pr67-product-hardening-acceptance
  workflow_dispatch:

jobs:
  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate inherited product hardening
        run: python3 ci/validate_pr67_product_hardening.py
      - name: Validate VU and software-volume polish
        run: python3 ci/validate_pr68_vu_volume_polish.py

  validate-macos-integration:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Validate inherited product hardening
        run: python3 ci/validate_pr67_product_hardening.py
      - name: Validate VU and software-volume polish
        run: python3 ci/validate_pr68_vu_volume_polish.py
      - name: Build arm64 app with dashboard and volume preference polish
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
