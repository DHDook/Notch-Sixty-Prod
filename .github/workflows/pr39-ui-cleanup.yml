name: PR39 UI Cleanup Apply

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Apply focused UI cleanup
        run: |
          python3 ci/pr39_ui_cleanup.py
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/UI/ProductionRootView.swift NotchSixty/UI/ProductionProfileToolbar.swift NotchSixty/State/ProductProfiles.swift
          git diff --cached --check
          git commit -m "PR39: simplify profile CRUD and restore system tint"
          git push origin HEAD:feature/pr39-production-meters-analysis
