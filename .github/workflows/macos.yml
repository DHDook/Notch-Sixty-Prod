name: macOS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: List project
        run: xcodebuild -project NotchSixty.xcodeproj -list

      - name: Build
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Test
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Package source snapshot
        if: always()
        run: tar -czf /tmp/notch-sixty-source.tgz NotchSixty NotchSixtyTests NotchSixty.xcodeproj docs AGENTS.md

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-source-snapshot
          path: /tmp/notch-sixty-source.tgz
          retention-days: 1
