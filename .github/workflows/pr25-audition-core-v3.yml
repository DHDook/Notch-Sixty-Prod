name: PR25 Audition Core V3

on:
  push:
    branches: [feature/latency-matched-audition-delta]
    paths:
      - .github/workflows/pr25-audition-core-v3.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply PR25 core patch and updated audition tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/pr25_audition_core.py')
          t = p.read_text()
          old = "'''    bool bypassed;\\n    N60AuditionMode auditionMode;\\n    uint32_t latencyFrames;\\n''', 2)"
          new = "'''    bool bypassed;\\n    N60AuditionMode auditionMode;\\n    uint32_t latencyFrames;\\n''')"
          if old not in t:
              raise SystemExit('cardinality marker missing')
          p.write_text(t.replace(old, new, 1))
          PY
          python3 .github/scripts/pr25_audition_core.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('NotchSixtyTests/StereoPlaybackControlTests.swift')
          t = p.read_text()
          old = '''    func testRawBypassDefersFIRPreparationPolicyAcrossRepeatedEdits() {
              let linearEQ = StereoEQConfiguration(phaseMode: .linearPhase)
              let room = RoomCorrectionConfiguration(enabled: true, filter: .validation)
              let bypassStates = [
                  PlaybackControlConfiguration(balance: 0, globalBypassed: true, flatAuditionEnabled: false),
                  PlaybackControlConfiguration(balance: 0, globalBypassed: false, flatAuditionEnabled: true),
                  PlaybackControlConfiguration(balance: 0, globalBypassed: true, flatAuditionEnabled: true),
              ]

              for playback in bypassStates {
                  for _ in 0..<32 {
                      XCTAssertTrue(FIRUpdatePolicy.isRawBypassed(playback))
                      XCTAssertFalse(FIRUpdatePolicy.shouldPrepareLinearPhase(stereoEQ: linearEQ, playback: playback))
                      XCTAssertFalse(FIRUpdatePolicy.shouldPrepareRoomCorrection(roomCorrection: room, playback: playback))
                  }
              }
          }
          '''
          new = '''    func testRawBypassDefersFIRPreparationPolicyAcrossRepeatedEdits() {
              let linearEQ = StereoEQConfiguration(phaseMode: .linearPhase)
              let room = RoomCorrectionConfiguration(enabled: true, filter: .validation)
              let globalBypassStates = [
                  PlaybackControlConfiguration(balance: 0, globalBypassed: true, auditionMode: .processed),
                  PlaybackControlConfiguration(balance: 0, globalBypassed: true, auditionMode: .reference),
                  PlaybackControlConfiguration(balance: 0, globalBypassed: true, auditionMode: .delta),
              ]

              for playback in globalBypassStates {
                  for _ in 0..<32 {
                      XCTAssertTrue(FIRUpdatePolicy.isRawBypassed(playback))
                      XCTAssertFalse(FIRUpdatePolicy.shouldPrepareLinearPhase(stereoEQ: linearEQ, playback: playback))
                      XCTAssertFalse(FIRUpdatePolicy.shouldPrepareRoomCorrection(roomCorrection: room, playback: playback))
                  }
              }
          }

          func testReferenceAndDeltaKeepFIRStagesPrepared() {
              let linearEQ = StereoEQConfiguration(phaseMode: .linearPhase)
              let room = RoomCorrectionConfiguration(enabled: true, filter: .validation)
              for mode in [AuditionMode.reference, .delta] {
                  let playback = PlaybackControlConfiguration(auditionMode: mode)
                  XCTAssertFalse(FIRUpdatePolicy.isRawBypassed(playback))
                  XCTAssertTrue(FIRUpdatePolicy.shouldPrepareLinearPhase(stereoEQ: linearEQ, playback: playback))
                  XCTAssertTrue(FIRUpdatePolicy.shouldPrepareRoomCorrection(roomCorrection: room, playback: playback))
              }
          }
          '''
          if old not in t:
              raise SystemExit('stale bypass-policy test block missing')
          p.write_text(t.replace(old, new, 1))
          PY

      - name: Run full test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit implementation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr25-audition-core.yml \
             .github/workflows/pr25-audition-core-v2.yml \
             .github/workflows/pr25-audition-core-v3.yml \
             .github/scripts/pr25_audition_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotchSixty/Audio/Realtime/N60RenderKernel.h \
                  NotchSixty/Audio/Realtime/N60RenderKernel.c \
                  NotchSixty/Audio/StereoPlaybackControl.swift \
                  NotchSixty/Audio/AudioIOEngine.swift \
                  NotchSixtyTests/StereoPlaybackControlTests.swift \
                  .github/workflows/pr25-audition-core.yml \
                  .github/workflows/pr25-audition-core-v2.yml \
                  .github/workflows/pr25-audition-core-v3.yml \
                  .github/scripts/pr25_audition_core.py
          git commit -m 'Add latency-matched reference and delta audition core'
          git push origin HEAD:feature/latency-matched-audition-delta
