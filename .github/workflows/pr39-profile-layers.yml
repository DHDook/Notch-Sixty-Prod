name: PR39 Profile Layers

on:
  push:
    branches:
      - feature/pr39-production-meters-analysis

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr39-production-meters-analysis
          fetch-depth: 0

      - name: Generate profile-layer implementation
        run: |
          python3 .github/scripts/pr39_profile_layers.py
          python3 .github/scripts/pr39_profile_layers_fix.py
          python3 ci/validate_pr39_profile_layers.py
          git diff --check

      - name: Compile and test profile layering
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit implementation and remove staging helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr39-profile-layers.yml .github/scripts/pr39_profile_layers.py .github/scripts/pr39_profile_layers_fix.py
          git add -A
          git diff --cached --check
          git commit -m "PR39: separate content presets from playback systems"
          git push origin HEAD:feature/pr39-production-meters-analysis
