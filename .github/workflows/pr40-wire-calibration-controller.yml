name: PR40 Calibration Controller Project Wiring

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-calibration-controller.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Wire controller and tests into Xcode project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = path.read_text()
          replacements = [
              (
                  '\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */; };',
                  '\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */; };\n'
                  '\t\tA1000000000000000000001B /* RoomCorrectionCalibrationControllerTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */; };'
              ),
              (
                  '\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */; };',
                  '\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */; };\n'
                  '\t\tA2000000000000000000001D /* RoomCorrectionCalibrationController.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002D /* RoomCorrectionCalibrationController.swift */; };'
              ),
              (
                  '\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementTests.swift; sourceTree = "<group>"; };',
                  '\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementTests.swift; sourceTree = "<group>"; };\n'
                  '\t\tA1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationControllerTests.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\tA2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationTransport.swift; sourceTree = "<group>"; };',
                  '\t\tA2000000000000000000002C /* RoomCorrectionCalibrationTransport.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationTransport.swift; sourceTree = "<group>"; };\n'
                  '\t\tA2000000000000000000002D /* RoomCorrectionCalibrationController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationController.swift; sourceTree = "<group>"; };'
              ),
              (
                  '\t\t\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */,\n\t\t\t);\n\t\t\tpath = NotchSixtyTests;',
                  '\t\t\t\tA1000000000000000000002D /* RoomCorrectionMeasurementTests.swift */,\n'
                  '\t\t\t\tA1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */,\n'
                  '\t\t\t);\n\t\t\tpath = NotchSixtyTests;'
              ),
              (
                  '\t\tA20000000000000000000054 /* State */ = {isa = PBXGroup; children = (A20000000000000000000025 /* AudioLifecycleState.swift */, A2000000000000000000002B /* ProductProfiles.swift */,); path = State; sourceTree = "<group>"; };',
                  '\t\tA20000000000000000000054 /* State */ = {isa = PBXGroup; children = (A20000000000000000000025 /* AudioLifecycleState.swift */, A2000000000000000000002B /* ProductProfiles.swift */, A2000000000000000000002D /* RoomCorrectionCalibrationController.swift */,); path = State; sourceTree = "<group>"; };'
              ),
              (
                  '\t\t\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */,\n\t\t\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */,',
                  '\t\t\t\tA2000000000000000000001C /* RoomCorrectionCalibrationTransport.swift in Sources */,\n'
                  '\t\t\t\tA2000000000000000000001D /* RoomCorrectionCalibrationController.swift in Sources */,\n'
                  '\t\t\t\tA20000000000000000000017 /* StereoPlaybackControl.swift in Sources */,'
              ),
              (
                  '\t\t\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */,\n\t\t\t);',
                  '\t\t\t\tA1000000000000000000001A /* RoomCorrectionMeasurementTests.swift in Sources */,\n'
                  '\t\t\t\tA1000000000000000000001B /* RoomCorrectionCalibrationControllerTests.swift in Sources */,\n'
                  '\t\t\t);'
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one Xcode anchor, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit project wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-wire-calibration-controller.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: wire calibration controller and tests"
          git push origin HEAD:pr40-room-correction-production-workflow
