name: PR24 Retrigger Integration

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-retrigger-integration.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retrigger structural integration
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# retrigger after Core Audio compiler fixes\n' >> .github/workflows/pr24-master-volume-integration-v2.yml
          rm .github/workflows/pr24-retrigger-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Retrigger PR24 integration'
          git push origin HEAD:feature/master-volume-mute-sync
