name: PR24 Integration Runner V5

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-integration-runner-v5.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply structural integration with schema update
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr24-master-volume-integration-v2.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run test suite"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('embedded patch start not found')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('embedded patch end not found')
          lines = source[start:end].splitlines()
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/pr24_patch.py').write_text(patch)
          PY
          python3 /tmp/pr24_patch.py
          python3 <<'PY'
          from pathlib import Path

          # Remove only the accidental master-gain arguments on FIR attach helpers,
          # preserving all graph-builder master-gain arguments.
          p = Path('NotchSixty/Audio/AudioIOEngine.swift')
          lines = p.read_text().splitlines()
          out = []
          removed = 0
          for line in lines:
              if 'masterGainLinear: currentMasterSoftwareGain' in line:
                  context = '\n'.join(out[-10:])
                  if 'attachActiveLinearPhaseProgramIfNeeded(' in context or 'attachActiveRoomCorrectionProgramIfNeeded(' in context:
                      if out and out[-1].rstrip().endswith(','):
                          out[-1] = out[-1].rstrip()[:-1]
                      removed += 1
                      continue
              out.append(line)
          text = '\n'.join(out) + '\n'
          remaining = text.count('masterGainLinear: currentMasterSoftwareGain')
          if removed != 5:
              raise SystemExit(f'expected to remove 5 accidental attach-helper args, removed {removed}')
          if remaining < 4:
              raise SystemExit(f'expected graph-builder master gain arguments to remain, found {remaining}')
          p.write_text(text)

          # PR24 adds master playback state to the versioned product snapshot.
          tests = Path('NotchSixtyTests/LiveLinearPhaseTests.swift')
          test_text = tests.read_text()
          old_name = 'func testProductConfigurationSchemaIsVersionTwoForStereoPlaybackState()'
          if old_name not in test_text:
              raise SystemExit('schema test name not found')
          test_text = test_text.replace(
              old_name,
              'func testProductConfigurationSchemaIsVersionThreeForMasterPlaybackState()',
              1
          )
          # Restrict replacement to the renamed test block rather than changing arbitrary 2s.
          start = test_text.find('func testProductConfigurationSchemaIsVersionThreeForMasterPlaybackState()')
          end = test_text.find('\n    func ', start + 1)
          if end < 0:
              end = len(test_text)
          block = test_text[start:end]
          block = block.replace('XCTAssertEqual(ProductConfiguration.currentSchemaVersion, 2)', 'XCTAssertEqual(ProductConfiguration.currentSchemaVersion, 3)')
          block = block.replace('XCTAssertEqual(ProductConfiguration().schemaVersion, 2)', 'XCTAssertEqual(ProductConfiguration().schemaVersion, 3)')
          test_text = test_text[:start] + block + test_text[end:]
          tests.write_text(test_text)
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit integration and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr24-master-volume-integration.yml \
            .github/workflows/pr24-master-volume-integration-v2.yml \
            .github/workflows/pr24-retrigger-integration.yml \
            .github/workflows/pr24-integration-runner.yml \
            .github/workflows/pr24-integration-runner-v3.yml \
            .github/workflows/pr24-integration-runner-v4.yml \
            .github/workflows/pr24-integration-runner-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate master volume mute and device synchronization'
          git push origin HEAD:feature/master-volume-mute-sync
