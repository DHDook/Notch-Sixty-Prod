name: PR105 Guided Speaker Characterization Verification

on:
  push:
    branches:
      - feature/pr105-guided-speaker-characterization-verification
  pull_request:
    branches:
      - feature/pr104-speaker-optimization-engine
  workflow_dispatch:

concurrency:
  group: pr105-speaker-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR105 characterization boundary
        run: python3 ci/validate_pr105_speaker_characterization.py
      - name: Preserve PR104 optimizer closure
        run: python3 ci/validate_pr104_speaker_optimizer.py
      - name: Preserve PR103 measurement foundation
        run: python3 ci/validate_pr103_speaker_optimizer_measurement.py

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR105 characterization boundary
        run: python3 ci/validate_pr105_speaker_characterization.py
      - name: Preserve PR104 optimizer closure
        run: python3 ci/validate_pr104_speaker_optimizer.py
      - name: Build arm64 Debug app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
      - name: Run PR105 characterization tests
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/SpeakerOptimizerCharacterizationMeasurementTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerEarlyWindowCharacterizationTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerCrossDomainClassifierTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerClassificationAwareCandidateTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerCharacterizationControllerTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerCommissioningContractTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerPEQDeploymentTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerPEQApplyTransactionTests test
      - name: Run full XCTest regression
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
