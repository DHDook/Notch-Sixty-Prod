name: PR117C Spatial SOFA Reference

on:
  push:
    branches:
      - feature/pr117c-sofa-spatial-reference
  pull_request:
    branches:
      - feature/pr117b-fir-latency-headroom-lab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr117c-spatial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify normalized SOFA view using production binaural renderer
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117c_spatial_reference.py \
            --commit "$N60_COMMIT" \
            --report "$RUNNER_TEMP/pr117c-spatial-portable.json"
          python3 ci/validate_pr117b_fir_latency_headroom.py
          python3 ci/validate_pr117a_crossover_precision.py --source-only
      - uses: actions/upload-artifact@v4
        with:
          name: pr117c-spatial-portable
          path: ${{ runner.temp }}/pr117c-spatial-portable.json
          retention-days: 30
          if-no-files-found: error

  apple-spatial:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify same spatial references under Apple Clang
        env:
          N60_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 ci/validate_pr117c_spatial_reference.py \
            --commit "$N60_COMMIT" \
            --report "$RUNNER_TEMP/pr117c-spatial-apple.json"
          python3 ci/validate_pr112a_hardware_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr117c-spatial-apple
          path: ${{ runner.temp }}/pr117c-spatial-apple.json
          retention-days: 30
          if-no-files-found: error
