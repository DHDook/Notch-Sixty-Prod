name: PR40 Calibration Transport Lifecycle Hardening

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-harden-calibration-transport.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Harden transport lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NotchSixty/Audio/CoreAudio/RoomCorrectionCalibrationTransport.swift')
          text = path.read_text()

          replacements = [
              (
                  '    case ioProcUnavailable\n    case incompleteCapture',
                  '    case ioProcUnavailable\n    case closed\n    case incompleteCapture'
              ),
              (
                  '        case .ioProcUnavailable:\n            return "Core Audio did not return a usable room-measurement IOProc."\n        case .incompleteCapture:',
                  '        case .ioProcUnavailable:\n            return "Core Audio did not return a usable room-measurement IOProc."\n        case .closed:\n            return "Room-measurement transport is already closed."\n        case .incompleteCapture:'
              ),
              (
                  '        guard !isClosed else {\n            throw RoomCorrectionCalibrationTransportError.operationFailed(\n                operation: "start closed room-measurement transport",\n                status: kAudioHardwareNotRunningError\n            )\n        }',
                  '        guard !isClosed else {\n            throw RoomCorrectionCalibrationTransportError.closed\n        }'
              ),
              (
                  '                try Self.writeNominalSampleRate(\n                    deviceID: input.deviceID,\n                    sampleRate: sampleRate,\n                    operation: "set measurement microphone sample rate"\n                )\n                let applied = try Self.readNominalSampleRate(deviceID: input.deviceID)',
                  '                try Self.writeNominalSampleRate(\n                    deviceID: input.deviceID,\n                    sampleRate: sampleRate,\n                    operation: "set measurement microphone sample rate"\n                )\n                // Mark immediately after a successful device write so teardown\n                // restores the user\'s prior rate even if verification or later\n                // aggregate setup fails.\n                inputSampleRateWasChanged = true\n                let applied = try Self.readNominalSampleRate(deviceID: input.deviceID)'
              ),
              (
                  '                inputSampleRateWasChanged = true\n            }\n\n            let outputInputChannels',
                  '            }\n\n            let outputInputChannels'
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one lifecycle anchor, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/CoreAudio/RoomCorrectionCalibrationTransport.swift
          git rm .github/workflows/pr40-harden-calibration-transport.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "PR40: harden calibration transport teardown"
          git push origin HEAD:pr40-room-correction-production-workflow
