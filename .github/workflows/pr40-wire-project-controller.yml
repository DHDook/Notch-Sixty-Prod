name: PR40 Wire Project Controller

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-project-controller.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Wire project controller and tests into Xcode targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = path.read_text()
          insertions = [
              (
                  '\t\tA1000000000000000000001C /* RoomCorrectionMeasurementAnalyzerTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */; };\n',
                  '\t\tA1000000000000000000001D /* RoomCorrectionProjectControllerTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A10000000000000000000032 /* RoomCorrectionProjectControllerTests.swift */; };\n',
              ),
              (
                  '\t\tA2000000000000000000001E /* RoomCorrectionMeasurementAnalyzer.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002E /* RoomCorrectionMeasurementAnalyzer.swift */; };\n',
                  '\t\tA2000000000000000000001F /* RoomCorrectionProjectController.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002F /* RoomCorrectionProjectController.swift */; };\n',
              ),
              (
                  '\t\tA1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementAnalyzerTests.swift; sourceTree = "<group>"; };\n',
                  '\t\tA10000000000000000000032 /* RoomCorrectionProjectControllerTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionProjectControllerTests.swift; sourceTree = "<group>"; };\n',
              ),
              (
                  '\t\tA2000000000000000000002E /* RoomCorrectionMeasurementAnalyzer.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementAnalyzer.swift; sourceTree = "<group>"; };\n',
                  '\t\tA2000000000000000000002F /* RoomCorrectionProjectController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionProjectController.swift; sourceTree = "<group>"; };\n',
              ),
              (
                  '\t\t\t\tA1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */,\n',
                  '\t\t\t\tA10000000000000000000032 /* RoomCorrectionProjectControllerTests.swift */,\n',
              ),
              (
                  '\t\tA20000000000000000000054 /* State */ = {isa = PBXGroup; children = (A20000000000000000000025 /* AudioLifecycleState.swift */, A2000000000000000000002B /* ProductProfiles.swift */, A2000000000000000000002D /* RoomCorrectionCalibrationController.swift */,); path = State; sourceTree = "<group>"; };\n',
                  '\t\tA20000000000000000000054 /* State */ = {isa = PBXGroup; children = (A20000000000000000000025 /* AudioLifecycleState.swift */, A2000000000000000000002B /* ProductProfiles.swift */, A2000000000000000000002D /* RoomCorrectionCalibrationController.swift */, A2000000000000000000002F /* RoomCorrectionProjectController.swift */,); path = State; sourceTree = "<group>"; };\n',
                  True,
              ),
              (
                  '\t\t\t\tA2000000000000000000001E /* RoomCorrectionMeasurementAnalyzer.swift in Sources */,\n',
                  '\t\t\t\tA2000000000000000000001F /* RoomCorrectionProjectController.swift in Sources */,\n',
              ),
              (
                  '\t\t\t\tA1000000000000000000001C /* RoomCorrectionMeasurementAnalyzerTests.swift in Sources */,\n',
                  '\t\t\t\tA1000000000000000000001D /* RoomCorrectionProjectControllerTests.swift in Sources */,\n',
              ),
          ]

          for item in insertions:
              anchor, addition = item[0], item[1]
              replace_anchor = len(item) == 3 and item[2]
              if addition in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'Unexpected Xcode project anchor count for: {anchor.strip()}')
              if replace_anchor:
                  text = text.replace(anchor, addition, 1)
              else:
                  text = text.replace(anchor, anchor + addition, 1)

          path.write_text(text)
          PY

      - name: Commit wiring and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-wire-project-controller.yml
          git commit -m "PR40 Slice D: compile multi-position project layer"
          git push origin HEAD:pr40-room-correction-production-workflow
