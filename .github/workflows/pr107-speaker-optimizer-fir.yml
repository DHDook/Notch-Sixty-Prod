name: PR107 Speaker Optimizer FIR Deployment

on:
  push:
    branches:
      - feature/pr107-speaker-optimizer-fir-deployment-latency
  pull_request:
    branches:
      - feature/pr106-advanced-speaker-measurement-lab
  workflow_dispatch:

concurrency:
  group: pr107-speaker-optimizer-fir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR107 FIR deployment boundary
        run: python3 ci/validate_pr107_speaker_optimizer_fir.py
      - name: Preserve PR106 Advanced Speaker Measurement Lab closure
        run: python3 ci/validate_pr106_speaker_measurement_lab.py
      - name: Run PR107 sparse program FIR runtime
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr107_program_fir_runtime.c \
            -lm -o /tmp/pr107-program-fir
          /tmp/pr107-program-fir
      - name: Run PR107 live FIR render integration
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr107_live_fir_render.c \
            -lm -o /tmp/pr107-live-fir-render
          /tmp/pr107-live-fir-render

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate PR107 FIR deployment boundary
        run: python3 ci/validate_pr107_speaker_optimizer_fir.py
      - name: Preserve PR106 Advanced Speaker Measurement Lab closure
        run: python3 ci/validate_pr106_speaker_measurement_lab.py
      - name: Run PR107 sparse program FIR runtime on Apple clang
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr107_program_fir_runtime.c \
            -lm -o /tmp/pr107-program-fir
          /tmp/pr107-program-fir
      - name: Run PR107 live FIR render integration on Apple clang
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -INotchSixty/Audio/Realtime \
            ci/validate_pr107_live_fir_render.c \
            -lm -o /tmp/pr107-live-fir-render
          /tmp/pr107-live-fir-render
      - name: Build arm64 Debug app
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES build
      - name: Run PR107 FIR deployment and Apply tests
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/SpeakerOptimizerFIRDeploymentTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerFIRApplyTransactionTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerCommissioningContractTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerFIRAVSyncTests
          -only-testing:NotchSixtyTests/SpeakerOptimizerFIRPostApplyVerificationTests
          test
      - name: Run full XCTest regression
        run: >-
          xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
