name: macOS full

# Nightly on main, pull requests labelled full-ci, and on demand: the PR check
# plus the Release performance build and the render benchmarks. Not run on every
# merge: the PR check has already run the full XCTest suite on the merged code.
on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    branches:
      - main
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build and test (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee "$RUNNER_TEMP/xctest.log"

      # FC1: flags-off matrix. While graduated flags exist, the flags-off path must keep passing (AGENTS.md section 11).
      # The XCTest host cannot take launch arguments, so a debug-build environment variable switches every graduated
      # flag off (FeatureFlags.graduatedOffEnvironmentKey); xcodebuild forwards TEST_RUNNER_-prefixed variables.
      - name: Test with graduated flags off (Debug)
        env:
          TEST_RUNNER_NOTCHSIXTY_GRADUATED_FLAGS_OFF: "1"
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee "$RUNNER_TEMP/xctest-flags-off.log"

      - name: Build Release performance scheme
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty-Performance
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Behavioural C harnesses
        env:
          N60_PARITY_FULL: "1" # E6 S10: full parity corpus at all eight rates, with graph timings
          SOAK: "1" # E4 S13: long acoustic-twin drift and fault soak; S29: plus 8 simulated hours (about 80 s)
        run: ci/run_harnesses.sh

      - name: Render and bridge benchmarks
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/benchmarks"
          # Link step shared with pr.yml (ci/build_benchmarks.sh); this step then runs the binaries.
          ci/build_benchmarks.sh "$OUT"
          for opt in O0 O3; do
            echo "=== render kernel $opt ===" | tee -a "$OUT/benchmarks.txt"
            "$OUT/render-$opt" | tee -a "$OUT/benchmarks.txt"
          done
          echo "=== realtime bridge O3 ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/bridge-O3" | tee -a "$OUT/benchmarks.txt"
          echo "=== multi-sub search ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/multisub" | grep '^benchmark' | tee -a "$OUT/benchmarks.txt"
          echo "=== non-uniform convolution ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/convolution" | tee -a "$OUT/benchmarks.txt"
          # E20 S1: regressions above 1.5x of core/bench/baseline-macos-arm64.json fail the step. E20 S10 (G3, G4, G6):
          # budgets are enforced; R2 and R3 are judged with two worker threads (the critical path), and R7 must be in the
          # JSON (the build passes -DN60_BENCH_ANC). JSON goes to the uploaded artifact.
          echo "=== graph render benchmark ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/n60_bench" --out "$OUT/bench.json" --baseline core/bench/baseline-macos-arm64.json \
            --budgets core/bench/budgets.json --enforce-budgets --workers 2 | tee -a "$OUT/benchmarks.txt"
          "$OUT/n60_bench_profile" --profile-only --out "$OUT/bench-profile.json" > /dev/null

      - name: Upload logs and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/xctest.log
            ${{ runner.temp }}/xctest-flags-off.log
            ${{ runner.temp }}/benchmarks/benchmarks.txt
            ${{ runner.temp }}/benchmarks/bench.json
            ${{ runner.temp }}/benchmarks/bench-profile.json
          if-no-files-found: warn
          retention-days: 14

  # E6 S2: the portable engine core builds and passes its tests with clang on
  # Linux, proving it has no Apple framework dependency.
  core-linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test libn60core (clang, Linux)
        run: ci/run_core_linux.sh

  # E20 G23: the parallel render under ThreadSanitizer (workers, join, rebuild fade, worker retune). Lite corpus: the
  # sanitizer slows the render about tenfold.
  core-tsan:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parallel render test under ThreadSanitizer
        run: |
          set -euo pipefail
          source ci/core_sources.sh
          LIB=()
          for f in "${CORE_SOURCES[@]}"; do
            obj="$RUNNER_TEMP/tsan_${f//\//_}.o"
            clang++ -std=c++20 -O1 -g -fsanitize=thread -Wno-unknown-warning-option -fno-exceptions -fno-rtti \
              -Icore/include -Icore/src -c core/src/$f.cpp -o "$obj"
            LIB+=("$obj")
          done
          clang++ -std=c++20 -O1 -g -fsanitize=thread -Icore/include core/tests/test_parallel.cpp "${LIB[@]}" -pthread \
            -o "$RUNNER_TEMP/tsan_parallel"
          N60_PARALLEL_TEST_LITE=1 TSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/tsan_parallel"

  # E20 S2: RealtimeSanitizer. Apple's clang does not ship -fsanitize=realtime, so the core tests run on Linux with
  # upstream LLVM 20 (apt.llvm.org; CI only, nothing shipped; owner decision Q6, 9 Nov 2026). Every function the audio
  # thread calls is [[clang::nonblocking]]; the sanitizer aborts a test that allocates, locks or blocks inside one.
  core-rtsan:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    # Pinned: ubuntu-latest moved to 'resolute', which apt.llvm.org does not serve. Move this when LLVM 20 is published for it.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LLVM 20
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          clang++-20 --version

      - name: Core tests under RealtimeSanitizer
        run: |
          set -euo pipefail
          CXX=clang++-20
          CC=clang-20
          source ci/core_sources.sh
          SAN="-fsanitize=realtime"
          LIB=()
          for f in "${CORE_SOURCES[@]}"; do
            obj="$RUNNER_TEMP/rtsan_${f//\//_}.o"
            $CXX -std=c++20 -O1 -g -Wall -Wextra -Werror -Werror=function-effects $SAN -fno-exceptions -fno-rtti \
              -Icore/include -Icore/src -c core/src/$f.cpp -o "$obj"
            LIB+=("$obj")
          done
          for t in test_graph test_stages test_rebuild; do
            $CC -std=c11 -O1 -g -Wall -Wextra -Werror -Icore/include -c core/tests/$t.c -o "$RUNNER_TEMP/rtsan_$t.o"
            $CXX $SAN "$RUNNER_TEMP/rtsan_$t.o" "${LIB[@]}" -lm -pthread -o "$RUNNER_TEMP/rtsan_$t"
            "$RUNNER_TEMP/rtsan_$t"
          done
          # E20 G11: the whole-graph parity suite (goldens skipped: they are pinned to the Apple FFT) and the portable half-band test.
          for t in test_parity_suite; do
            $CC -std=c11 -O1 -g -Wall -Wextra -Werror -Icore/include -c core/tests/$t.c -o "$RUNNER_TEMP/rtsan_$t.o"
            $CXX $SAN "$RUNNER_TEMP/rtsan_$t.o" "${LIB[@]}" -lm -pthread -o "$RUNNER_TEMP/rtsan_$t"
            N60_PARITY_NO_GOLDENS=1 "$RUNNER_TEMP/rtsan_$t"
          done
          for t in test_alloc test_fpenv test_conv_rebuild test_protection_halfband; do
            $CXX -std=c++20 -O1 -g -Wall -Wextra -Werror $SAN -Icore/include -Icore/src core/tests/$t.cpp \
              "${LIB[@]}" -pthread -o "$RUNNER_TEMP/rtsan_$t"
            "$RUNNER_TEMP/rtsan_$t"
          done
