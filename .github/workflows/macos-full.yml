name: macOS full

# Nightly on main, pull requests labelled full-ci, and on demand: the PR check
# plus the Release performance build and the render benchmarks. Not run on every
# merge: the PR check has already run the full XCTest suite on the merged code.
on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    branches:
      - main
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build and test (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee "$RUNNER_TEMP/xctest.log"

      - name: Build Release performance scheme
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty-Performance
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Behavioural C harnesses
        env:
          N60_PARITY_FULL: "1" # E6 S10: full parity corpus at all eight rates, with graph timings
          SOAK: "1" # E4 S13: long acoustic-twin drift and fault soak
        run: ci/run_harnesses.sh

      - name: Render and bridge benchmarks
        run: |
          set -euo pipefail
          RT=NotchSixty/Audio/Realtime
          OUT="$RUNNER_TEMP/benchmarks"
          mkdir -p "$OUT"
          NO_BRIDGE=$(find "$RT" -name '*.c' ! -name 'N60RealtimeAudioBridge.c' ! -name 'N60MeasurementMonitorProc.c' -print)
          ALL=$(find "$RT" -name '*.c' -print)
          for opt in O0 O3; do
            clang -std=c11 -"$opt" -Wall -Wextra -include stddef.h -I"$RT" -Icore/include \
              ci/benchmark_pr35_render_kernel.c $NO_BRIDGE -framework Accelerate -o "$OUT/render-$opt"
            echo "=== render kernel $opt ===" | tee -a "$OUT/benchmarks.txt"
            "$OUT/render-$opt" | tee -a "$OUT/benchmarks.txt"
          done
          # The realtime bridge calls libn60core (n60_graph_*) since E6 S8a, so link the core
          # objects too, built the same way as ci/run_harnesses.sh build_core_objs.
          CORE_OBJS=()
          for f in graph snapshot fft stages_dsp stages_system stages_matrix stages_generator stages_route layout measure/offline_fft measure/ess measure/deconvolve measure/reference_room measure/timing measure/distortion measure/decay measure/waterfall measure/monitor_ring measure/spl measure/rta correct/minphase correct/design correct/synth correct/bass correct/multisub_search xover/xover; do
            obj="$OUT/n60core_${f//\//_}.o"
            clang++ -std=c++20 -O3 -Wall -Wextra -fno-exceptions -fno-rtti -Icore/include -Icore/src -c "core/src/$f.cpp" -o "$obj"
            CORE_OBJS+=("$obj")
          done
          clang -std=c11 -O3 -Wall -Wextra -include stddef.h -I"$RT" -Icore/include \
            ci/benchmark_pr35_realtime_bridge.c $ALL "${CORE_OBJS[@]}" -lc++ \
            -framework Accelerate -framework CoreAudio -o "$OUT/bridge-O3"
          echo "=== realtime bridge O3 ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/bridge-O3" | tee -a "$OUT/benchmarks.txt"
          # E8 A6a: design time of the multi-sub search (8 subs x 8 seats x 128 bins, Release build of the core unit).
          clang++ -std=c++20 -O3 -Wall -Wextra -fno-exceptions -fno-rtti -Icore/include -c core/src/correct/multisub_search.cpp \
            -o "$OUT/multisub_search.o"
          clang -std=c11 -O3 -Wall -Wextra -I"$RT" -Icore/include -Ici ci/validate_e8_multi_sub_tools.c "$OUT/multisub_search.o" \
            -lc++ -lm -o "$OUT/multisub"
          echo "=== multi-sub search ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/multisub" | grep '^benchmark' | tee -a "$OUT/benchmarks.txt"
          clang -std=c11 -O2 -Wall -Wextra -I"$RT" "$RT/N60Convolution.c" ci/benchmark_nonuniform_convolution.c \
            -framework Accelerate -o "$OUT/convolution"
          echo "=== non-uniform convolution ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/convolution" | tee -a "$OUT/benchmarks.txt"

      - name: Upload logs and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/xctest.log
            ${{ runner.temp }}/benchmarks/benchmarks.txt
          if-no-files-found: warn
          retention-days: 14

  # E6 S2: the portable engine core builds and passes its tests with clang on
  # Linux, proving it has no Apple framework dependency.
  core-linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test libn60core (clang, Linux)
        run: |
          set -euo pipefail
          clang++ --version
          # Keep this list in step with build_core_objs in ci/run_harnesses.sh.
          LIB=()
          for f in graph snapshot fft stages_dsp stages_system stages_matrix stages_generator stages_route layout measure/offline_fft measure/ess measure/deconvolve measure/reference_room measure/timing measure/distortion measure/decay measure/waterfall measure/monitor_ring measure/spl measure/rta correct/minphase correct/design correct/synth correct/bass correct/multisub_search xover/xover; do
            obj="$RUNNER_TEMP/n60core_${f//\//_}.o"
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -Icore/include -Icore/src \
              -c core/src/$f.cpp -o "$obj"
            LIB+=("$obj")
          done
          for t in test_graph test_stages test_dsp test_system test_rebuild test_denoiser_carry test_layout test_multisub test_readbacks; do
            clang -std=c11 -O2 -Wall -Wextra -Werror -Icore/include -c core/tests/$t.c -o "$RUNNER_TEMP/$t.o"
            clang++ "$RUNNER_TEMP/$t.o" "${LIB[@]}" -lm -pthread -o "$RUNNER_TEMP/$t"
            "$RUNNER_TEMP/$t"
          done
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Icore/include core/tests/test_alloc.cpp \
            "${LIB[@]}" -o "$RUNNER_TEMP/test_alloc"
          "$RUNNER_TEMP/test_alloc"
          "$RUNNER_TEMP/test_graph"
