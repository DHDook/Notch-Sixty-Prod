name: macOS full

# Nightly on main, pull requests labelled full-ci, and on demand: the PR check
# plus the Release performance build and the render benchmarks. Not run on every
# merge: the PR check has already run the full XCTest suite on the merged code.
on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    branches:
      - main
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build and test (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_TESTABILITY=YES \
            test 2>&1 | tee "$RUNNER_TEMP/xctest.log"

      - name: Build Release performance scheme
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty-Performance
          -configuration Release
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/DerivedDataRelease"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Behavioural C harnesses
        env:
          N60_PARITY_FULL: "1" # E6 S10: full parity corpus at all eight rates, with graph timings
          SOAK: "1" # E4 S13: long acoustic-twin drift and fault soak; S29: plus 8 simulated hours (about 80 s)
        run: ci/run_harnesses.sh

      - name: Render and bridge benchmarks
        run: |
          set -euo pipefail
          RT=NotchSixty/Audio/Realtime
          OUT="$RUNNER_TEMP/benchmarks"
          mkdir -p "$OUT"
          # E4 S15: the render kernel links the C++20 howl guard.
          clang++ -std=c++20 -O3 -Wall -Wextra -I"$RT" -c "$RT/n60_anc_guard.cpp" -o "$OUT/n60_anc_guard.o"
          # E4 S25b: and the live feed-forward filter.
          clang++ -std=c++20 -O3 -Wall -Wextra -I"$RT" -c "$RT/n60_ff_live.cpp" -o "$OUT/n60_ff_live.o"
          clang++ -std=c++20 -O3 -Wall -Wextra -I"$RT" -c "$RT/n60_ff_echo.cpp" -o "$OUT/n60_ff_echo.o"
          clang++ -std=c++20 -O3 -Wall -Wextra -I"$RT" -c "$RT/n60_fxlms.cpp" -o "$OUT/n60_fxlms.o"
          # E26: the bridge feeds the ANC lane (N60AncLaneFeed).
          clang++ -std=c++20 -O3 -Wall -Wextra -I"$RT" -c "$RT/n60_anc_lane_feed.cpp" -o "$OUT/n60_anc_lane_feed.o"
          NO_BRIDGE="$(find "$RT" -name '*.c' ! -name 'N60RealtimeAudioBridge.c' ! -name 'N60MeasurementMonitorProc.c' -print) $OUT/n60_anc_guard.o $OUT/n60_ff_live.o $OUT/n60_ff_echo.o $OUT/n60_fxlms.o $OUT/n60_anc_lane_feed.o"
          ALL="$(find "$RT" -name '*.c' -print) $OUT/n60_anc_guard.o $OUT/n60_ff_live.o $OUT/n60_ff_echo.o $OUT/n60_fxlms.o $OUT/n60_anc_lane_feed.o"
          # libn60core objects, from the shared list (ci/core_sources.sh). The render kernel and
          # the realtime bridge both link them (N60LevelSessionProc, n60_graph_*).
          source ci/core_sources.sh
          CORE_OBJS=()
          for f in "${CORE_SOURCES[@]}"; do
            obj="$OUT/n60core_${f//\//_}.o"
            clang++ -std=c++20 -O3 -Wall -Wextra -Wno-unknown-warning-option -Werror=function-effects -fno-exceptions -fno-rtti -Icore/include -Icore/src -c "core/src/$f.cpp" -o "$obj"
            CORE_OBJS+=("$obj")
          done
          for opt in O0 O3; do
            clang -std=c11 -"$opt" -Wall -Wextra -include stddef.h -I"$RT" -Icore/include \
              ci/benchmark_pr35_render_kernel.c $NO_BRIDGE "${CORE_OBJS[@]}" -lc++ -framework Accelerate -o "$OUT/render-$opt"
            echo "=== render kernel $opt ===" | tee -a "$OUT/benchmarks.txt"
            "$OUT/render-$opt" | tee -a "$OUT/benchmarks.txt"
          done
          clang -std=c11 -O3 -Wall -Wextra -include stddef.h -I"$RT" -Icore/include \
            ci/benchmark_pr35_realtime_bridge.c $ALL "${CORE_OBJS[@]}" -lc++ \
            -framework Accelerate -framework CoreAudio -o "$OUT/bridge-O3"
          echo "=== realtime bridge O3 ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/bridge-O3" | tee -a "$OUT/benchmarks.txt"
          # E8 A6a: design time of the multi-sub search (8 subs x 8 seats x 128 bins, Release build of the core unit).
          clang++ -std=c++20 -O3 -Wall -Wextra -fno-exceptions -fno-rtti -Icore/include -c core/src/correct/multisub_search.cpp \
            -o "$OUT/multisub_search.o"
          clang -std=c11 -O3 -Wall -Wextra -I"$RT" -Icore/include -Ici ci/validate_e8_multi_sub_tools.c "$OUT/multisub_search.o" \
            -lc++ -lm -o "$OUT/multisub"
          echo "=== multi-sub search ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/multisub" | grep '^benchmark' | tee -a "$OUT/benchmarks.txt"
          clang -std=c11 -O2 -Wall -Wextra -I"$RT" "$RT/N60Convolution.c" ci/benchmark_nonuniform_convolution.c \
            -framework Accelerate -o "$OUT/convolution"
          echo "=== non-uniform convolution ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/convolution" | tee -a "$OUT/benchmarks.txt"
          # E20 S1: graph render benchmark (core/bench/n60_bench.cpp). The timing binary links product objects (no profile
          # hooks) and the ANC lane feed (R7); a second binary links a -DN60_GRAPH_PROFILE snapshot object for the
          # per-stage ns/sample rows. Regressions above 1.5x of core/bench/baseline-macos-arm64.json fail the step; budget
          # breaches only warn until E20 S10 adds --enforce-budgets. JSON goes to the uploaded artifact.
          clang -std=c11 -O3 -Wall -Wextra -include stddef.h -I"$RT" -c "$RT/N60ActiveQuietZone.c" -o "$OUT/n60_aqz.o"
          clang++ -std=c++20 -O3 -Wall -Wextra -fno-exceptions -fno-rtti -DN60_GRAPH_PROFILE -Icore/include -Icore/src \
            -c core/src/snapshot.cpp -o "$OUT/n60core_snapshot_profile.o"
          PROFILE_OBJS=()
          for obj in "${CORE_OBJS[@]}"; do
            if [ "$obj" = "$OUT/n60core_snapshot.o" ]; then PROFILE_OBJS+=("$OUT/n60core_snapshot_profile.o"); else PROFILE_OBJS+=("$obj"); fi
          done
          ANC_OBJS="$OUT/n60_aqz.o $OUT/n60_anc_lane_feed.o $OUT/n60_ff_live.o $OUT/n60_ff_echo.o $OUT/n60_fxlms.o"
          # shellcheck disable=SC2086
          clang++ -std=c++20 -O3 -Wall -Wextra -DN60_BENCH_ANC -I"$RT" -Icore/include -Icore/src core/bench/n60_bench.cpp \
            "${CORE_OBJS[@]}" $ANC_OBJS -framework Accelerate -o "$OUT/n60_bench"
          clang++ -std=c++20 -O3 -Wall -Wextra -DN60_BENCH_PROFILE -Icore/include -Icore/src core/bench/n60_bench.cpp \
            "${PROFILE_OBJS[@]}" -framework Accelerate -o "$OUT/n60_bench_profile"
          echo "=== graph render benchmark ===" | tee -a "$OUT/benchmarks.txt"
          "$OUT/n60_bench" --out "$OUT/bench.json" --baseline core/bench/baseline-macos-arm64.json \
            --budgets core/bench/budgets.json | tee -a "$OUT/benchmarks.txt"
          "$OUT/n60_bench_profile" --profile-only --out "$OUT/bench-profile.json" > /dev/null

      - name: Upload logs and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/xctest.log
            ${{ runner.temp }}/benchmarks/benchmarks.txt
            ${{ runner.temp }}/benchmarks/bench.json
            ${{ runner.temp }}/benchmarks/bench-profile.json
          if-no-files-found: warn
          retention-days: 14

  # E6 S2: the portable engine core builds and passes its tests with clang on
  # Linux, proving it has no Apple framework dependency.
  core-linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test libn60core (clang, Linux)
        run: |
          set -euo pipefail
          clang++ --version
          # Keep this list in step with build_core_objs in ci/run_harnesses.sh.
          source ci/core_sources.sh
          LIB=()
          for f in "${CORE_SOURCES[@]}"; do
            obj="$RUNNER_TEMP/n60core_${f//\//_}.o"
            clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-unknown-warning-option -Werror=function-effects \
              -fno-exceptions -fno-rtti -Icore/include -Icore/src -c core/src/$f.cpp -o "$obj"
            LIB+=("$obj")
          done
          for t in test_graph test_stages test_dsp test_system test_rebuild test_denoiser_carry test_layout test_multisub test_readbacks; do
            clang -std=c11 -O2 -Wall -Wextra -Werror -Icore/include -c core/tests/$t.c -o "$RUNNER_TEMP/$t.o"
            clang++ "$RUNNER_TEMP/$t.o" "${LIB[@]}" -lm -pthread -o "$RUNNER_TEMP/$t"
            "$RUNNER_TEMP/$t"
          done
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Icore/include core/tests/test_alloc.cpp \
            "${LIB[@]}" -o "$RUNNER_TEMP/test_alloc"
          "$RUNNER_TEMP/test_alloc"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Icore/include -Icore/src core/tests/test_fpenv.cpp \
            "${LIB[@]}" -o "$RUNNER_TEMP/test_fpenv"
          "$RUNNER_TEMP/test_fpenv"
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -Icore/include -Icore/src core/tests/test_conv.cpp \
            "${LIB[@]}" -o "$RUNNER_TEMP/test_conv"
          "$RUNNER_TEMP/test_conv"
          "$RUNNER_TEMP/test_graph"

  # E20 S2: RealtimeSanitizer. Apple's clang does not ship -fsanitize=realtime, so the core tests run on Linux with
  # upstream LLVM 20 (apt.llvm.org; CI only, nothing shipped; owner decision Q6, 9 Nov 2026). Every function the audio
  # thread calls is [[clang::nonblocking]]; the sanitizer aborts a test that allocates, locks or blocks inside one.
  core-rtsan:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LLVM 20
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          clang++-20 --version

      - name: Core tests under RealtimeSanitizer
        run: |
          set -euo pipefail
          CXX=clang++-20
          CC=clang-20
          source ci/core_sources.sh
          SAN="-fsanitize=realtime"
          LIB=()
          for f in "${CORE_SOURCES[@]}"; do
            obj="$RUNNER_TEMP/rtsan_${f//\//_}.o"
            $CXX -std=c++20 -O1 -g -Wall -Wextra -Werror -Werror=function-effects $SAN -fno-exceptions -fno-rtti \
              -Icore/include -Icore/src -c core/src/$f.cpp -o "$obj"
            LIB+=("$obj")
          done
          for t in test_graph test_stages test_rebuild; do
            $CC -std=c11 -O1 -g -Wall -Wextra -Werror -Icore/include -c core/tests/$t.c -o "$RUNNER_TEMP/rtsan_$t.o"
            $CXX $SAN "$RUNNER_TEMP/rtsan_$t.o" "${LIB[@]}" -lm -pthread -o "$RUNNER_TEMP/rtsan_$t"
            "$RUNNER_TEMP/rtsan_$t"
          done
          for t in test_alloc test_fpenv test_conv_rebuild; do
            $CXX -std=c++20 -O1 -g -Wall -Wextra -Werror $SAN -Icore/include -Icore/src core/tests/$t.cpp \
              "${LIB[@]}" -pthread -o "$RUNNER_TEMP/rtsan_$t"
            "$RUNNER_TEMP/rtsan_$t"
          done
