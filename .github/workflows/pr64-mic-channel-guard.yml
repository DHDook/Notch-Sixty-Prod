name: PR64 Physical Mic Channel Guard

on:
  push:
    branches:
      - feature/pr64-multichannel-calibration-workflow
    paths:
      - ci/pr64_validate_physical_mic_channel.py
      - .github/workflows/pr64-mic-channel-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr64-multichannel-calibration-workflow
          fetch-depth: 0
      - name: Apply asserted microphone-channel guard
        run: python3 ci/pr64_validate_physical_mic_channel.py
      - name: Commit guard and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f ci/pr64_validate_physical_mic_channel.py .github/workflows/pr64-mic-channel-guard.yml
          git add NotchSixty/Audio/CoreAudio/MultichannelCalibrationTransport.swift
          git commit -m "PR64: validate physical microphone channel before aggregation"
          git push origin HEAD:feature/pr64-multichannel-calibration-workflow
