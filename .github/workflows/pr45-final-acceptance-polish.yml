name: PR45 Final Acceptance Polish

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - ci/pr45_final_acceptance_polish.py
      - .github/workflows/pr45-final-acceptance-polish.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: xcode-27
    steps:
      - name: Check out PR45
        uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening

      - name: Apply final acceptance polish
        run: python3 ci/pr45_final_acceptance_polish.py

      - name: Validate retained contracts
        run: |
          python3 ci/validate_pr39_app_identity.py
          python3 ci/validate_pr42_app_shell.py
          python3 ci/validate_pr45_release_hardening.py

      - name: Build Debug
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Commit accepted fixes
        run: |
          rm -f ci/pr45_final_acceptance_polish.py .github/workflows/pr45-final-acceptance-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'PR45: final hardware acceptance polish'
          git push origin HEAD:pr45-v1-release-hardening
