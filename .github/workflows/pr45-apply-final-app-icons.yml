name: PR45 Apply Final App Icons

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-apply-final-app-icons.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: pr45-v1-release-hardening
          fetch-depth: 0

      - name: Verify approved PNG masters and tray preservation
        shell: bash
        run: |
          set -euo pipefail
          for icon in artwork/AppIcon-light-master.png artwork/AppIcon-dark-master.png; do
            test -s "$icon"
            WIDTH="$(sips -g pixelWidth "$icon" | awk '/pixelWidth/ {print $2}')"
            HEIGHT="$(sips -g pixelHeight "$icon" | awk '/pixelHeight/ {print $2}')"
            echo "$icon: ${WIDTH}x${HEIGHT}"
            test "$WIDTH" = "$HEIGHT"
            test "$WIDTH" -ge 1024
          done
          test "$(git hash-object NotchSixty/Assets.xcassets/TrayIcon.imageset/notch_sixty_tray_icon_final_tightcrop.svg)" = "759c6f2700c1250b8c697ca0eb480e1a2f11c577"

      - name: Generate macOS app icon slots from approved PNG masters
        run: swift ci/generate_app_icons.swift

      - name: Validate generated asset catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          catalog = Path('NotchSixty/Assets.xcassets/AppIcon.appiconset')
          data = json.loads((catalog / 'Contents.json').read_text())
          expected = {
              'icon_16x16.png': 16,
              'icon_16x16@2x.png': 32,
              'icon_32x32.png': 32,
              'icon_32x32@2x.png': 64,
              'icon_128x128.png': 128,
              'icon_128x128@2x.png': 256,
              'icon_256x256.png': 256,
              'icon_256x256@2x.png': 512,
              'icon_512x512.png': 512,
              'icon_512x512@2x.png': 1024,
              'icon_dark_16x16.png': 16,
              'icon_dark_16x16@2x.png': 32,
              'icon_dark_32x32.png': 32,
              'icon_dark_32x32@2x.png': 64,
              'icon_dark_128x128.png': 128,
              'icon_dark_128x128@2x.png': 256,
              'icon_dark_256x256.png': 256,
              'icon_dark_256x256@2x.png': 512,
              'icon_dark_512x512.png': 512,
              'icon_dark_512x512@2x.png': 1024,
          }
          files = [entry.get('filename') for entry in data['images'] if entry.get('filename')]
          assert set(files) == set(expected), (len(files), set(expected) - set(files), set(files) - set(expected))
          assert sum(1 for entry in data['images'] if not entry.get('appearances')) == 10
          assert sum(1 for entry in data['images'] if entry.get('appearances')) == 10
          for filename, pixels in expected.items():
              path = catalog / filename
              assert path.exists() and path.stat().st_size > 0, filename
              out = subprocess.check_output(['sips', '-g', 'pixelWidth', '-g', 'pixelHeight', str(path)], text=True)
              values = [int(line.split(':', 1)[1].strip()) for line in out.splitlines() if 'pixelWidth:' in line or 'pixelHeight:' in line]
              assert values == [pixels, pixels], (filename, values, pixels)
          print('20-slot light/dark AppIcon catalog verified')
          PY
          test "$(git hash-object NotchSixty/Assets.xcassets/TrayIcon.imageset/notch_sixty_tray_icon_final_tightcrop.svg)" = "759c6f2700c1250b8c697ca0eb480e1a2f11c577"

      - name: Compile app with final icon catalog
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NotchSixty.xcodeproj \
            -scheme NotchSixty \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Commit final icon assets and remove one-shot staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artwork/AppIcon-light-master.png artwork/AppIcon-dark-master.png
          git add artwork/AppIcon-light-final.png artwork/AppIcon-dark-final.png
          git add NotchSixty/Assets.xcassets/AppIcon.appiconset/*.png

          git rm -f icon_payload/pr45-light-final.webp icon_payload/pr45-dark-final.webp 2>/dev/null || true
          git rm -f artwork/AppIcon-light-master.webp artwork/AppIcon-dark-master.webp 2>/dev/null || true
          git rm -f artwork/AppIcon-light.svg artwork/AppIcon-dark.svg 2>/dev/null || true
          git rm -f .github/workflows/pr45-export-current-icons.yml 2>/dev/null || true
          git rm -f .github/workflows/pr45-apply-final-app-icons.yml

          git diff --cached --check
          git commit -m "PR45: install approved light and dark app icons"
          git push origin HEAD:pr45-v1-release-hardening
