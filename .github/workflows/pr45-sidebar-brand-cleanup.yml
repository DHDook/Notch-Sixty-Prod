name: PR45 Sidebar Brand Cleanup

on:
  push:
    branches:
      - pr45-v1-release-hardening
    paths:
      - .github/workflows/pr45-sidebar-brand-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr45-v1-release-hardening

      - name: Simplify sidebar brand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("NotchSixty/UI/ProductionRootView.swift")
          text = root.read_text(encoding="utf-8")

          old = '''private struct ProductionSidebarBrand: View {
              var body: some View {
                  HStack(spacing: 12) {
                      if let icon = NSApplication.shared.applicationIconImage {
                          Image(nsImage: icon)
                              .resizable()
                              .interpolation(.high)
                              .frame(width: 44, height: 44)
                              .clipShape(.rect(cornerRadius: 10))
                      }

                      VStack(alignment: .leading, spacing: 2) {
                          Text("Notch Sixty")
                              .textCase(.uppercase)
                              .font(.headline.weight(.semibold))
                              .tracking(1.5)
                          Text("Stereo DSP")
                              .font(.caption)
                              .foregroundStyle(.secondary)
                      }
                      Spacer(minLength: 0)
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 12)
                  .accessibilityElement(children: .combine)
                  .accessibilityLabel("Notch Sixty Stereo DSP")
              }
          }
          '''

          new = '''private struct ProductionSidebarBrand: View {
              var body: some View {
                  HStack {
                      Text("Notch Sixty")
                          .textCase(.uppercase)
                          .font(.headline.weight(.semibold))
                          .tracking(1.5)
                      Spacer(minLength: 0)
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 12)
                  .accessibilityElement(children: .combine)
                  .accessibilityLabel("Notch Sixty")
              }
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one sidebar brand block, found {text.count(old)}")
          text = text.replace(old, new)

          if text.count("import AppKit\n") != 1:
              raise SystemExit("unexpected AppKit import count")
          text = text.replace("import AppKit\n", "", 1)
          root.write_text(text, encoding="utf-8")

          doc = Path("docs/PR45_V1_RELEASE_HARDENING.md")
          d = doc.read_text(encoding="utf-8")
          old_line = "15. final app-icon appearance in Finder, Dock, Settings/sidebar, light/dark appearance, and packaged DMG;"
          new_line = "15. final app-icon appearance in Finder, Dock, light/dark appearance, and packaged DMG;"
          if d.count(old_line) != 1:
              raise SystemExit("expected PR45 icon-acceptance line not found exactly once")
          doc.write_text(d.replace(old_line, new_line), encoding="utf-8")
          PY

          rm .github/workflows/pr45-sidebar-brand-cleanup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/UI/ProductionRootView.swift docs/PR45_V1_RELEASE_HARDENING.md .github/workflows/pr45-sidebar-brand-cleanup.yml
          git commit -m "PR45: simplify sidebar branding"
          git push origin HEAD:pr45-v1-release-hardening
