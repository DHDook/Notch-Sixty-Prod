name: PR40 Preserve Sweep Settings

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-preserve-sweep-settings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Preserve originating sweep settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NotchSixty/Audio/Devices/OutputDeviceCatalog.swift')
          lines = path.read_text().splitlines()

          struct_anchor = 'struct RoomCorrectionSweepProgram: Equatable, Sendable {'
          struct_matches = [i for i, line in enumerate(lines) if line.strip() == struct_anchor]
          if len(struct_matches) != 1:
              raise SystemExit('Unexpected RoomCorrectionSweepProgram declaration count')
          struct_index = struct_matches[0]
          if not any(line.strip() == 'var settings: RoomCorrectionSweepSettings' for line in lines[struct_index:struct_index + 8]):
              sample_index = next(
                  (i for i in range(struct_index + 1, min(struct_index + 8, len(lines)))
                   if lines[i].strip() == 'var sampleRate: Double'),
                  None,
              )
              if sample_index is None:
                  raise SystemExit('RoomCorrectionSweepProgram sampleRate field not found')
              indent = lines[sample_index][:len(lines[sample_index]) - len(lines[sample_index].lstrip())]
              lines.insert(sample_index, indent + 'var settings: RoomCorrectionSweepSettings')

          init_anchor = 'return RoomCorrectionSweepProgram('
          init_matches = [i for i, line in enumerate(lines) if line.strip() == init_anchor]
          if len(init_matches) != 1:
              raise SystemExit('Unexpected RoomCorrectionSweepProgram construction count')
          init_index = init_matches[0]
          if not any(line.strip() == 'settings: settings,' for line in lines[init_index:init_index + 8]):
              sample_index = next(
                  (i for i in range(init_index + 1, min(init_index + 8, len(lines)))
                   if lines[i].strip() == 'sampleRate: sampleRate,'),
                  None,
              )
              if sample_index is None:
                  raise SystemExit('RoomCorrectionSweepProgram sampleRate argument not found')
              indent = lines[sample_index][:len(lines[sample_index]) - len(lines[sample_index].lstrip())]
              lines.insert(sample_index, indent + 'settings: settings,')

          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/Devices/OutputDeviceCatalog.swift
          git rm .github/workflows/pr40-preserve-sweep-settings.yml
          git commit -m "PR40: preserve exact measurement sweep settings"
          git push origin HEAD:pr40-room-correction-production-workflow
