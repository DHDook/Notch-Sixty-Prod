name: PR64 Targeted Bridge Pointer Fix

on:
  push:
    branches:
      - feature/pr64-multichannel-calibration-workflow
    paths:
      - ci/pr64_fix_targeted_bridge_pointer.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pr64-multichannel-calibration-workflow
          fetch-depth: 0
      - run: python3 ci/pr64_fix_targeted_bridge_pointer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f ci/pr64_fix_targeted_bridge_pointer.py .github/workflows/pr64-transport-pointer-fix.yml
          git add NotchSixty/Audio/CoreAudio/MultichannelCalibrationTransport.swift
          git commit -m "PR64: use typed targeted measurement bridge pointer"
          git push origin HEAD:feature/pr64-multichannel-calibration-workflow
