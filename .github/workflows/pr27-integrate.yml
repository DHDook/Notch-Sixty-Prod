name: PR27 Protection Integration

on:
  push:
    branches: [feature/overload-protection-oversampling]
    paths:
      - .github/workflows/pr27-integrate.yml
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr27-integrate.yml'
      - '.github/scripts/pr27_integrate.py'
      - 'NotchSixty/**'
      - 'NotchSixtyTests/**'

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == '' || github.head_ref == 'feature/overload-protection-oversampling'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feature/overload-protection-oversampling
      - name: Apply graph integration
        run: python3 .github/scripts/pr27_integrate.py
      - name: Run full test suite
        run: xcodebuild -project NotchSixty.xcodeproj -scheme NotchSixty -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES test
      - name: Commit production integration and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr27-integrate.yml .github/scripts/pr27_integrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate oversampled clipper and true-peak limiter'
          git push origin HEAD:feature/overload-protection-oversampling
