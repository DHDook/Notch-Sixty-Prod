name: PR34 Parity Regression Gate

on:
  push:
    branches:
      - feature/dsp-optimization-parity-audit

permissions:
  contents: read

jobs:
  verify-pr34-parity:
    runs-on: xcode-27
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/dsp-optimization-parity-audit

      # Phases A-D and the Phase E Dynamic EQ correction are committed source.
      # This gate is verification-only: no integration helper may mutate product source.
      - name: Validate Band Pass DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_bandpass.c -o /tmp/validate-pr34-bandpass
          /tmp/validate-pr34-bandpass

      - name: Validate Constant-Q DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_constantq.c -o /tmp/validate-pr34-constantq
          /tmp/validate-pr34-constantq

      - name: Validate Linkwitz Transform DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_linkwitz.c -o /tmp/validate-pr34-linkwitz
          /tmp/validate-pr34-linkwitz

      - name: Validate compiled EQ, slopes, and Tilt DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_compiled_eq.c -o /tmp/validate-pr34-compiled-eq
          /tmp/validate-pr34-compiled-eq

      - name: Validate Mid Side transform DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_midside.c -o /tmp/validate-pr34-midside
          /tmp/validate-pr34-midside

      - name: Validate per-band FIR cascade DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_per_band_fir.c NotchSixty/Audio/Realtime/N60Convolution.c -lm -o /tmp/validate-pr34-per-band-fir
          /tmp/validate-pr34-per-band-fir

      - name: Validate Mixed Phase DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_mixed_phase.c -lm -o /tmp/validate-pr34-mixed-phase
          /tmp/validate-pr34-mixed-phase

      - name: Validate domain-aware Dynamic EQ DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror \
            -I NotchSixty/Audio/Realtime \
            ci/validate_pr34_dynamic_domains.c \
            NotchSixty/Audio/Realtime/N60DynamicEQ.c \
            -lm -o /tmp/validate-pr34-dynamic-domains
          /tmp/validate-pr34-dynamic-domains

      - name: Validate Symmetry Balance DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_symmetry_balance.c -lm -o /tmp/validate-pr34-symmetry-balance
          /tmp/validate-pr34-symmetry-balance

      - name: Validate speaker crossfeed DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_speaker_crossfeed.c -lm -o /tmp/validate-pr34-speaker-crossfeed
          /tmp/validate-pr34-speaker-crossfeed

      - name: Validate crosstalk cancellation DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_crosstalk_cancellation.c -lm -o /tmp/validate-pr34-crosstalk
          /tmp/validate-pr34-crosstalk

      - name: Validate sub-bass phase alignment DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_sub_phase_alignment.c -lm -o /tmp/validate-pr34-sub-phase
          /tmp/validate-pr34-sub-phase

      - name: Build
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Test three independent FIR workflows
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          -only-testing:NotchSixtyTests/NotchSixtyTests/testSpeakerIRIsThirdIndependentGlobalConvolutionSlot
          -only-testing:NotchSixtyTests/NotchSixtyTests/testSpeakerIRPublishRejectsUnpreparedGeneration
          -only-testing:NotchSixtyTests/NotchSixtyTests/testSpeakerIRPolicyKeepsRawBypassRaw
          test

      - name: Test
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test
