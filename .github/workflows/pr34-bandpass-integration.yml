name: PR34 Band Pass Integration

on:
  push:
    branches:
      - feature/dsp-optimization-parity-audit

permissions:
  contents: write

jobs:
  integrate-band-pass:
    runs-on: xcode-27
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/dsp-optimization-parity-audit

      - name: Apply deterministic Swift integration
        run: python3 ci/pr34_apply_bandpass_integration.py

      - name: Validate Band Pass DSP
        run: |
          clang -std=c11 -Wall -Wextra -Werror ci/validate_pr34_bandpass.c -o /tmp/validate-pr34-bandpass
          /tmp/validate-pr34-bandpass

      - name: Build
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          build

      - name: Test
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit integrated source
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty/Audio/AudioIOEngine.swift NotchSixtyTests/NotchSixtyTests.swift
          git commit -m "Integrate PR34 Band Pass through Swift EQ model"
          git push origin HEAD:feature/dsp-optimization-parity-audit
