name: PR24 Sync Hardening

on:
  push:
    branches:
      - feature/master-volume-mute-sync
    paths:
      - .github/workflows/pr24-sync-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add engine sync tests and validation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Minimal validation UI; this remains engineering-only and intentionally unpolished.
          view = Path('NotchSixty/ContentView.swift')
          text = view.read_text()
          marker = '''    private var balanceBinding: Binding<Double> {
                  Binding(get: { engine.playbackControlConfiguration.balance }, set: { try? engine.setChannelBalance($0) })
              }
          '''
          addition = marker + '''
              private var masterVolumeBinding: Binding<Double> {
                  Binding(get: { engine.masterVolumeConfiguration.level }, set: { try? engine.setMasterVolumeLevel($0) })
              }

              private var masterMuteBinding: Binding<Bool> {
                  Binding(get: { engine.masterVolumeConfiguration.muted }, set: { try? engine.setMasterMuted($0) })
              }
          '''
          if marker not in text:
              raise SystemExit('balance binding marker not found')
          text = text.replace(marker, addition, 1)

          ui_marker = '''            HStack(spacing: 12) {
                      Text("Balance").frame(width: 90, alignment: .leading)
          '''
          master_ui = '''            HStack(spacing: 12) {
                      Text("Master").frame(width: 90, alignment: .leading)
                      Slider(value: masterVolumeBinding, in: MasterVolumeConfiguration.levelRange, step: 0.01)
                      Text("\\(Int((engine.masterVolumeConfiguration.level * 100).rounded()))%")
                          .monospacedDigit()
                          .frame(width: 48, alignment: .trailing)
                      Toggle("Mute", isOn: masterMuteBinding).toggleStyle(.switch)
                      Text(engine.masterVolumeCapabilities.controlMode == .device ? "Device" : "Software DSP")
                          .font(.caption)
                          .foregroundStyle(.secondary)
                          .frame(width: 95, alignment: .leading)
                  }
          '''
          if ui_marker not in text:
              raise SystemExit('balance UI marker not found')
          view.write_text(text.replace(ui_marker, master_ui + ui_marker, 1))

          # Engine-level regression for the historical sync failure: external HAL notification
          # must update product state without causing a write-back loop.
          tests = Path('NotchSixtyTests/StereoPlaybackControlTests.swift')
          text = tests.read_text()
          class_end = text.rfind('\n}')
          if class_end < 0:
              raise SystemExit('test class end not found')
          new_tests = '''

              @MainActor
              func testExternalDeviceVolumeChangeUpdatesEngineWithoutWriteBack() throws {
                  let device = AudioOutputDevice(
                      deviceID: 77,
                      uid: "test-device",
                      name: "Test Device",
                      nominalSampleRate: 96_000,
                      availableSampleRateRanges: [AudioSampleRateRange(minimum: 44_100, maximum: 192_000)]
                  )
                  let catalog = PR24FakeOutputCatalog(devices: [device])
                  let controller = PR24FakeMasterVolumeController(
                      snapshot: MasterVolumeDeviceSnapshot(
                          capabilities: MasterVolumeDeviceCapabilities(
                              volumeReadable: true,
                              volumeWritable: true,
                              muteReadable: true,
                              muteWritable: true
                          ),
                          level: 0.65,
                          muted: false
                      )
                  )
                  let engine = AudioIOEngine(
                      deviceCatalog: catalog,
                      masterVolumeController: controller
                  )

                  _ = try engine.refreshOutputDevices()
                  try engine.selectOutput(uid: device.uid)
                  XCTAssertEqual(engine.masterVolumeConfiguration.level, 0.65, accuracy: 0.000_001)
                  XCTAssertFalse(engine.masterVolumeConfiguration.muted)
                  XCTAssertEqual(controller.monitoredDeviceID, device.deviceID)
                  XCTAssertEqual(controller.setVolumeCalls, 0)
                  XCTAssertEqual(controller.setMuteCalls, 0)

                  controller.snapshot.level = 0.31
                  controller.snapshot.muted = true
                  controller.fireExternalChange()

                  XCTAssertEqual(engine.masterVolumeConfiguration.level, 0.31, accuracy: 0.000_001)
                  XCTAssertTrue(engine.masterVolumeConfiguration.muted)
                  XCTAssertEqual(controller.setVolumeCalls, 0, "external synchronization must never write volume back")
                  XCTAssertEqual(controller.setMuteCalls, 0, "external synchronization must never write mute back")

                  try engine.setMasterVolumeLevel(0.72)
                  XCTAssertEqual(controller.setVolumeCalls, 1)
                  XCTAssertEqual(controller.lastSetVolume, 0.72, accuracy: 0.000_001)
                  XCTAssertEqual(controller.setMuteCalls, 0)
              }

              @MainActor
              func testFixedVolumeDeviceUsesSoftwareAuthorityWithoutHardwareWrites() throws {
                  let device = AudioOutputDevice(
                      deviceID: 88,
                      uid: "fixed-device",
                      name: "Fixed Device",
                      nominalSampleRate: 96_000,
                      availableSampleRateRanges: [AudioSampleRateRange(minimum: 96_000, maximum: 96_000)]
                  )
                  let controller = PR24FakeMasterVolumeController(
                      snapshot: MasterVolumeDeviceSnapshot(
                          capabilities: .softwareOnly,
                          level: nil,
                          muted: nil
                      )
                  )
                  let engine = AudioIOEngine(
                      deviceCatalog: PR24FakeOutputCatalog(devices: [device]),
                      masterVolumeController: controller
                  )

                  _ = try engine.refreshOutputDevices()
                  try engine.selectOutput(uid: device.uid)
                  XCTAssertEqual(engine.masterVolumeCapabilities.controlMode, .softwareDSP)

                  try engine.setMasterVolumeLevel(0.42)
                  try engine.setMasterMuted(true)

                  XCTAssertEqual(engine.masterVolumeConfiguration.level, 0.42, accuracy: 0.000_001)
                  XCTAssertTrue(engine.masterVolumeConfiguration.muted)
                  XCTAssertEqual(controller.setVolumeCalls, 0)
                  XCTAssertEqual(controller.setMuteCalls, 0)
                  XCTAssertEqual(engine.masterVolumeConfiguration.softwareGain(for: engine.masterVolumeCapabilities), 0)
              }
          '''
          text = text[:class_end] + new_tests + text[class_end:]
          text += '''

          private struct PR24FakeOutputCatalog: OutputDeviceCataloging {
              let devices: [AudioOutputDevice]
              func outputDevices() throws -> [AudioOutputDevice] { devices }
          }

          private final class PR24FakeMasterVolumeController: MasterVolumeDeviceControlling {
              var onExternalChange: (() -> Void)?
              var snapshot: MasterVolumeDeviceSnapshot
              private(set) var monitoredDeviceID: AudioDeviceID?
              private(set) var setVolumeCalls = 0
              private(set) var setMuteCalls = 0
              private(set) var lastSetVolume: Double = 0
              private(set) var lastSetMuted = false

              init(snapshot: MasterVolumeDeviceSnapshot) {
                  self.snapshot = snapshot
              }

              func inspect(deviceID: AudioDeviceID) throws -> MasterVolumeDeviceSnapshot { snapshot }

              func setVolume(_ level: Double, deviceID: AudioDeviceID) throws {
                  setVolumeCalls += 1
                  lastSetVolume = level
              }

              func setMuted(_ muted: Bool, deviceID: AudioDeviceID) throws {
                  setMuteCalls += 1
                  lastSetMuted = muted
              }

              func monitor(deviceID: AudioDeviceID?) throws {
                  monitoredDeviceID = deviceID
              }

              func stopMonitoring() {
                  monitoredDeviceID = nil
              }

              func fireExternalChange() {
                  onExternalChange?()
              }
          }
          '''
          tests.write_text(text)
          PY

      - name: Run test suite
        run: >-
          xcodebuild
          -project NotchSixty.xcodeproj
          -scheme NotchSixty
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ENABLE_TESTABILITY=YES
          test

      - name: Commit hardening and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr24-sync-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden master volume synchronization'
          git push origin HEAD:feature/master-volume-mute-sync
