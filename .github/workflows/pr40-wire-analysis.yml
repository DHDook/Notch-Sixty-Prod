name: PR40 Wire Measurement Analyzer

on:
  push:
    branches:
      - pr40-room-correction-production-workflow
    paths:
      - .github/workflows/pr40-wire-analysis.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr40-room-correction-production-workflow
          fetch-depth: 0

      - name: Wire analyzer and tests into Xcode targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('NotchSixty.xcodeproj/project.pbxproj')
          text = path.read_text()

          insertions = [
              (
                  '\t\tA1000000000000000000001B /* RoomCorrectionCalibrationControllerTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */; };\n',
                  '\t\tA1000000000000000000001C /* RoomCorrectionMeasurementAnalyzerTests.swift in Sources */ = {isa = PBXBuildFile; fileRef = A1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */; };\n',
              ),
              (
                  '\t\tA2000000000000000000001D /* RoomCorrectionCalibrationController.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002D /* RoomCorrectionCalibrationController.swift */; };\n',
                  '\t\tA2000000000000000000001E /* RoomCorrectionMeasurementAnalyzer.swift in Sources */ = {isa = PBXBuildFile; fileRef = A2000000000000000000002E /* RoomCorrectionMeasurementAnalyzer.swift */; };\n',
              ),
              (
                  '\t\tA1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationControllerTests.swift; sourceTree = "<group>"; };\n',
                  '\t\tA1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementAnalyzerTests.swift; sourceTree = "<group>"; };\n',
              ),
              (
                  '\t\tA2000000000000000000002D /* RoomCorrectionCalibrationController.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionCalibrationController.swift; sourceTree = "<group>"; };\n',
                  '\t\tA2000000000000000000002E /* RoomCorrectionMeasurementAnalyzer.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = RoomCorrectionMeasurementAnalyzer.swift; sourceTree = "<group>"; };\n',
              ),
              (
                  '\t\t\t\tA1000000000000000000002E /* RoomCorrectionCalibrationControllerTests.swift */,\n',
                  '\t\t\t\tA1000000000000000000002F /* RoomCorrectionMeasurementAnalyzerTests.swift */,\n',
              ),
              (
                  '\t\t\t\tA20000000000000000000029 /* DynamicsConfiguration.swift */,\n',
                  '\t\t\t\tA2000000000000000000002E /* RoomCorrectionMeasurementAnalyzer.swift */,\n',
              ),
              (
                  '\t\t\t\tA2000000000000000000001D /* RoomCorrectionCalibrationController.swift in Sources */,\n',
                  '\t\t\t\tA2000000000000000000001E /* RoomCorrectionMeasurementAnalyzer.swift in Sources */,\n',
              ),
              (
                  '\t\t\t\tA1000000000000000000001B /* RoomCorrectionCalibrationControllerTests.swift in Sources */,\n',
                  '\t\t\t\tA1000000000000000000001C /* RoomCorrectionMeasurementAnalyzerTests.swift in Sources */,\n',
              ),
          ]

          for anchor, addition in insertions:
              if addition in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'Unexpected Xcode project anchor count for: {anchor.strip()}')
              text = text.replace(anchor, anchor + addition, 1)

          path.write_text(text)
          PY

      - name: Commit wiring and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NotchSixty.xcodeproj/project.pbxproj
          git rm .github/workflows/pr40-wire-analysis.yml
          git commit -m "PR40 Slice D: compile measurement analyzer and tests"
          git push origin HEAD:pr40-room-correction-production-workflow
